<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Fairway One - one hole of blocky 3D golf on a floating course, played with a gamepad, a keyboard or a thumb.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fairway One">
<title>Fairway One</title>
<style>
  :root {
    --panel: rgba(12, 24, 20, 0.74);
    --panel-soft: rgba(12, 24, 20, 0.5);
    --edge: rgba(255, 255, 255, 0.16);
    --accent: #ffd23f;
    --text: #f2f7f3;
    --muted: #9fb4a6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #7fb9dc;
    font-family: ui-rounded, "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
  }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 14px;
    padding: 9px 13px;
    backdrop-filter: blur(6px);
  }

  #hud {
    position: fixed; inset: 0;
    padding: calc(10px + env(safe-area-inset-top)) 14px 14px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; gap: 10px;
  }
  #left { display: flex; flex-direction: column; gap: 8px; }
  #right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

  .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--muted); }
  .big { font-size: clamp(20px, 4vw, 30px); font-weight: 700; line-height: 1.05; }
  .mid { font-size: clamp(13px, 2.3vw, 17px); font-weight: 600; }
  #dist { color: var(--accent); }

  .tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; pointer-events: auto; }
  .tools button {
    font: inherit; font-size: 11px; color: var(--text);
    background: var(--panel-soft); border: 1px solid var(--edge);
    border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap;
  }
  .tools button[hidden] { display: none; }
  #fullBtn { background: rgba(255, 210, 63, 0.18); border-color: rgba(255, 210, 63, 0.5); }

  /* the swing meter, up the left of the screen where it does not cover the shot */
  #meterWrap {
    position: fixed; left: 16px; bottom: 96px;
    width: 26px; height: 190px;
    border-radius: 14px; border: 1px solid var(--edge);
    background: var(--panel); overflow: hidden;
    display: none; pointer-events: none;
  }
  #meterWrap.show { display: block; }
  #meterFill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: #7fd66b; }
  #meterWrap::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0;
    height: 2px; background: var(--accent);
  }

  #msg {
    position: fixed; left: 50%; top: 18%; transform: translateX(-50%);
    font-size: clamp(15px, 3vw, 22px); font-weight: 700;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
    pointer-events: none; text-align: center;
  }
  #prompt {
    position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    font-size: clamp(11px, 2.2vw, 14px); color: var(--text);
    background: var(--panel-soft); border: 1px solid var(--edge);
    border-radius: 999px; padding: 7px 16px; white-space: nowrap;
    pointer-events: none;
  }

  /* thumb controls, for playing it on a phone */
  #touch {
    position: fixed; left: 10px; right: 10px;
    bottom: calc(56px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; align-items: center; justify-content: flex-end;
    flex-wrap: wrap-reverse; pointer-events: auto;
  }
  #touch button {
    font: inherit; font-weight: 700; color: #0c1814;
    background: var(--accent); border: none; border-radius: 999px;
    padding: 14px 22px; font-size: 15px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
  }
  #touch button[hidden] { display: none; }
  #touch .aim { font-size: 15px; padding: 12px 16px; }
  #touch .small {
    background: var(--panel); color: var(--text); border: 1px solid var(--edge);
    padding: 12px 14px; font-size: 13px; font-weight: 600;
  }

  #card {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(6, 14, 11, 0.55); backdrop-filter: blur(3px);
  }
  #card.show { display: flex; }
  #cardInner {
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 20px; padding: 26px 34px; text-align: center;
    max-width: 82vw;
  }
  #cardTitle { font-size: clamp(26px, 6vw, 42px); font-weight: 800; color: var(--accent); }
  #cardBody { margin-top: 10px; font-size: clamp(13px, 2.6vw, 17px); line-height: 1.6; }
  #cardBtn {
    margin-top: 18px; font: inherit; font-weight: 800; color: #0c1814;
    background: var(--accent); border: none; border-radius: 999px;
    padding: 16px 34px; font-size: clamp(15px, 3.4vw, 19px); cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
  }
  .soft { color: var(--muted); }

  @media (max-width: 560px) {
    #meterWrap { height: 150px; bottom: 120px; }
    #touch button { padding: 12px 18px; }
  }
  @media (max-width: 430px) {
    #touch .small { padding: 11px 11px; font-size: 12px; }
    #touch .aim { padding: 11px 13px; font-size: 13px; }
    #touch button { padding: 12px 15px; font-size: 14px; }
  }
</style>
</head>
<body>

<div id="stage"></div>

<div id="hud">
  <div id="left">
    <div class="panel">
      <div class="label">Hole</div>
      <div class="mid" id="hole">&mdash;</div>
    </div>
    <div class="panel">
      <div class="label">To the pin</div>
      <div class="big" id="dist">—</div>
      <div class="mid" id="lie">—</div>
    </div>
    <div class="panel">
      <div class="label">Wind</div>
      <div class="mid" id="wind">—</div>
    </div>
  </div>
  <div id="right">
    <div class="panel" style="text-align:right">
      <div class="label">Club</div>
      <div class="big" id="club">—</div>
      <div class="mid" id="shots">—</div>
    </div>
    <div class="tools">
      <button id="fullBtn" type="button" hidden>Full screen</button>
      <button id="jogBtn" type="button">Go to ball</button>
      <button id="dropBtn" type="button">Drop +1</button>
      <button id="resetBtn" type="button">Replay hole</button>
    </div>
  </div>
</div>

<div id="meterWrap"><div id="meterFill"></div></div>
<div id="msg"></div>
<div id="prompt"></div>

<div id="touch">
  <button class="small aim" id="aimLeftBtn" type="button">&#9664;</button>
  <button class="small aim" id="aimRightBtn" type="button">&#9654;</button>
  <button class="small" id="clubDownBtn" type="button">&lt;</button>
  <button class="small" id="clubUpBtn" type="button">&gt;</button>
  <button class="small" id="jumpBtn" type="button">Jump</button>
  <button class="small" id="cancelBtn" type="button">Back</button>
  <button id="hitBtn" type="button">Go to ball</button>
</div>

<div id="card"><div id="cardInner">
  <div id="cardTitle"></div>
  <div id="cardBody"></div>
  <button id="cardBtn" type="button">Next hole</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ====================== FAIRWAY ONE CORE START ====================== */
/* One hole of golf: the ground, the ball and the rules. Nothing in here
   knows about three.js or the DOM, so it can be run and checked headlessly -
   which matters, because a golf ball's flight is the whole game and it is
   very easy to make one that looks plausible and carries 600 metres. */

/* ------------------------------------------------------------- the course */

/* Everything solid on a course here is a box. Flat tops to run along,
   vertical faces to bounce off, tilted ones for ramps and banks, and some
   that turn. That is the whole reason it is boxes and not a height field: a
   height field cannot have a wall in it, because a vertical face is an
   infinitely steep slope and a ball meeting one either climbs it or falls
   through. Mini golf is mostly walls. Everything else is thin air - miss the
   course and you are off it. */

var BALL_RADIUS = 0.21;
var VOID_Y = -30;          /* below this you have left the course */
var MAX_STEP = 0.14;       /* how far the ball may move between collision
                              checks, so that a drive at sixty metres a second
                              cannot step straight through a rail */
var REST_SPEED = 1.15;     /* slower than this into a floor and it settles
                              instead of bouncing */

function rotY(p, a) {
  var c = Math.cos(a), s = Math.sin(a);
  return { x: p.x * c + p.z * s, y: p.y, z: -p.x * s + p.z * c };
}
function rotZ(p, a) {
  var c = Math.cos(a), s = Math.sin(a);
  return { x: p.x * c - p.y * s, y: p.x * s + p.y * c, z: p.z };
}

/* A box. It is leaned about its own z axis and then turned about the upright,
   in that order. Either of those two angles can be made to run with the
   clock: turning gives a sweeping arm, leaning gives a wheel going end over
   end, which is what a windmill's sails do. */
function slab(x, y, z, w, h, d, opts) {
  opts = opts || {};
  var sl = {
    pos: { x: x, y: y, z: z },
    half: { x: w / 2, y: h / 2, z: d / 2 },
    yaw: opts.yaw || 0,
    tilt: opts.tilt || 0,
    kind: opts.kind || 'fairway',
    spin: opts.spin || 0,        /* radians a second about the upright */
    roll: opts.roll || 0,        /* radians a second end over end */
    kick: opts.kick || 0,        /* a pad of its own strength, if it wants one */
    slide: opts.slide || null,   /* how far it shuttles, and about which way */
    slideRate: opts.slideRate || 0,  /* radians a second of that shuttle */
    belt: opts.belt || 0,        /* metres a second along its own length */
    beltSide: opts.beltSide || 0, /* and across it, for a belt that shoves */
    phase: opts.phase || 0
  };
  sl.bound = slabBounds(sl);
  return sl;
}
function moving(sl) { return !!(sl.spin || sl.roll || sl.slide); }

/* Where a slab is at a given moment. Everything that asks about a slab asks
   through this, so a platform that shuttles is solid in the right place
   rather than solid where it was built. */
function slabPos(sl, time) {
  if (!sl.slide) return sl.pos;
  var a = Math.sin(sl.slideRate * (time || 0) + sl.phase);
  return { x: sl.pos.x + sl.slide.x * a,
           y: sl.pos.y + sl.slide.y * a,
           z: sl.pos.z + sl.slide.z * a };
}

/* How far a slab reaches along each world axis, once it has been leaned and
   turned - and, if it moves, over every position it will ever be in. Six
   comparisons against this throw out almost every slab on almost every step,
   which is what makes it cheap enough to play the whole shot through this
   same physics on every frame to draw the aiming line. */
function slabBounds(sl) {
  var h = sl.half;
  var ex, ey, ez;
  if (sl.roll) {
    /* end over end: in its own frame it sweeps a circle in x and y */
    ex = ey = Math.sqrt(h.x * h.x + h.y * h.y);
    ez = h.z;
  } else {
    var ct = Math.abs(Math.cos(sl.tilt)), st = Math.abs(Math.sin(sl.tilt));
    ex = h.x * ct + h.y * st;
    ey = h.x * st + h.y * ct;
    ez = h.z;
  }
  if (sl.spin) {
    var r = Math.sqrt(ex * ex + ez * ez);
    return { x: r, y: ey, z: r };
  }
  var cy = Math.abs(Math.cos(sl.yaw)), sy = Math.abs(Math.sin(sl.yaw));
  return { x: ex * cy + ez * sy, y: ey, z: ex * sy + ez * cy };
}

/* true when a ball of radius r could not possibly be touching this slab */
function slabFar(sl, p, r, time) {
  var b = sl.bound, c = slabPos(sl, time);
  return Math.abs(p.x - c.x) > b.x + r ||
         Math.abs(p.y - c.y) > b.y + r ||
         Math.abs(p.z - c.z) > b.z + r;
}

/* A platform described by the surface you land on rather than its middle,
   which is how one actually thinks about a course. */
function deck(x, top, z, w, d, kind, opts) {
  opts = opts || {};
  var thick = opts.thick === undefined ? 4 : opts.thick;
  return slab(x, top - thick / 2, z, w, thick, d,
    { kind: kind || 'fairway', yaw: opts.yaw, belt: opts.belt,
      beltSide: opts.beltSide, kick: opts.kick });
}

/* A deck with a rectangular patch of something else let into it - a conveyor,
   a bounce pad, a bunker. Cut out rather than laid on top, so the patch is
   flush with the fairway around it and there is no lip anywhere on it. */
function inlay(x0, x1, z0, z1, top, kind, patch) {
  var out = [];
  function piece(a, b, c, d, k, o) {
    if (b - a < 0.01 || d - c < 0.01) return;
    out.push(deck((a + b) / 2, top, (c + d) / 2, b - a, d - c, k, o));
  }
  piece(x0, patch.x0, z0, z1, kind);
  piece(patch.x1, x1, z0, z1, kind);
  piece(patch.x0, patch.x1, z0, patch.z0, kind);
  piece(patch.x0, patch.x1, patch.z1, z1, kind);
  piece(patch.x0, patch.x1, patch.z0, patch.z1, patch.kind, patch.opts);
  return out;
}

/* A slope whose top face runs exactly from one point on the ground to
   another, at any angle across the course. Getting this wrong leaves a lip
   where the slope meets a deck, and a lip stops a ball dead - which is the
   single most annoying thing a golf course can do. */
function slope(x0, z0, y0, x1, z1, y1, width, kind, thick) {
  var t = thick === undefined ? 2.4 : thick;
  var dx = x1 - x0, dz = z1 - z0, dy = y1 - y0;
  var run = Math.sqrt(dx * dx + dz * dz);
  var len = Math.sqrt(run * run + dy * dy);
  var tilt = Math.atan2(dy, run);
  var yaw = Math.atan2(-dz, dx);
  var st = Math.sin(tilt), ct = Math.cos(tilt);
  /* the middle sits half a thickness straight down the box's own upright */
  return slab((x0 + x1) / 2 + (t / 2) * st * Math.cos(yaw),
              (y0 + y1) / 2 - (t / 2) * ct,
              (z0 + z1) / 2 - (t / 2) * st * Math.sin(yaw),
              len, t, width, { tilt: tilt, yaw: yaw, kind: kind });
}
/* the common case: a ramp running straight down the x axis */
function ramp(x0, y0, x1, y1, z, d, kind, thick) {
  return slope(x0, z, y0, x1, z, y1, d, kind, thick);
}

/* A square dish: a flat pad with four banks sloping up and out to a rim.
   Where two banks overlap at a corner the higher one wins, which leaves a
   ridge running out to each corner - the shape a square hip roof has, upside
   down. Land anywhere on it and you are fed towards the middle. */
function bowl(cx, cz, inner, rim, floorY, rimY, kinds) {
  var i = inner / 2, o = rim / 2;
  return [
    deck(cx, floorY, cz, inner, inner, kinds.pad, { thick: 3 }),
    slope(cx + i, cz, floorY, cx + o, cz, rimY, rim, kinds.east || kinds.bank, 2.2),
    slope(cx - i, cz, floorY, cx - o, cz, rimY, rim, kinds.west || kinds.bank, 2.2),
    slope(cx, cz + i, floorY, cx, cz + o, rimY, rim, kinds.south || kinds.bank, 2.2),
    slope(cx, cz - i, floorY, cx, cz - o, rimY, rim, kinds.north || kinds.bank, 2.2)
  ];
}

/* push a list of slabs onto a course */
function push(c, list) { for (var i = 0; i < list.length; i++) c.push(list[i]); return c; }

/* ------------------------------------------------------------- the holes */

/* Hole one. A high tee with a chute down to a railed fairway shelf, two
   stone pillars to thread and a sand trap cut into it as a real hollow, a
   hill down to a wide lower shelf, a windmill standing across the run up to
   the green with a doorway through it, and the green laid flush into the
   shelf so a putt runs onto it rather than over a lip. */
function buildHoleOne() {
  var c = [];

  /* the tee, up on its own block */
  c.push(deck(2, 12, 0, 32, 28, 'tee'));
  /* a chute down to the fairway, so a topped shot still gets somewhere */
  c.push(ramp(18, 12, 44, 4, 0, 24, 'fairway'));

  /* the fairway shelf, in pieces so the sand trap can be a real hollow in it
     rather than a patch of differently coloured fairway */
  c.push(deck(90, 4, 0, 92, 60, 'fairway'));        /* x  44..136 */
  c.push(deck(167, 4, 0, 18, 60, 'fairway'));       /* x 158..176 */
  c.push(deck(147, 4, 16, 22, 28, 'fairway'));      /* z   2.. 30 */
  c.push(deck(147, 4, -25, 22, 10, 'fairway'));     /* z -30..-20 */
  c.push(deck(147, 3.1, -9, 22, 22, 'sand', { thick: 3.1 }));

  /* railed down both sides, so a ball that stays down can't fall off */
  c.push(slab(110, 5.6, -31, 132, 3.2, 2, { kind: 'rail' }));
  c.push(slab(110, 5.6, 31, 132, 3.2, 2, { kind: 'rail' }));
  /* two pillars to thread, or bounce off */
  c.push(slab(100, 7, -13, 5, 6, 5, { kind: 'stone' }));
  c.push(slab(100, 7, 13, 5, 6, 5, { kind: 'stone' }));

  /* the hill down, railed like the rest, and the only way across on the
     ground - everything either side of it is thin air */
  c.push(ramp(176, 4, 206, -4, 0, 60, 'fairway'));
  c.push(slab(191, 1.6, -31, 31.2, 3.2, 2, { kind: 'rail', tilt: -0.26062 }));
  c.push(slab(191, 1.6, 31, 31.2, 3.2, 2, { kind: 'rail', tilt: -0.26062 }));

  /* The lower shelf, where a drive lands and runs out - so this is where an
     obstacle actually changes a tee shot. A conveyor is let into it: find it
     off the tee and it fires you most of the way to the green, miss it and
     you play the hole the ordinary way. */
  push(c, inlay(206, 283, -30, 86, -4, 'fairway',
    { x0: 224, x1: 248, z0: 4, z1: 34, kind: 'belt', opts: { belt: 20 } }));
  c.push(deck(327.5, -4, 28, 21, 116, 'fairway'));  /* x 317..338 */
  c.push(deck(300, -4, -0.5, 34, 59, 'fairway'));   /* z -30.. 29 */
  c.push(deck(300, -4, 74.5, 34, 23, 'fairway'));   /* z  63.. 86 */
  c.push(deck(300, -4, 46, 34, 34, 'green'));

  c.push(slab(272, -2.4, -31, 132, 3.2, 2, { kind: 'rail' }));
  c.push(slab(272, -2.4, 87, 132, 3.2, 2, { kind: 'rail' }));
  c.push(slab(339, -2.4, 28, 2, 3.2, 116, { kind: 'rail' }));

  /* The windmill. A wall across the run up to the green with a doorway
     through it, and the sails turning in the doorway - so the sails are the
     thing you have to time, rather than a decoration turning above one. Go
     round the wall and you are safe but long; go through and you have to
     catch the gap. */
  /* The wall is deliberately low. A tall one is a trap: a ball lying against
     it cannot be played over it, because even a wedge is still below the top
     by the time it gets there. */
  c.push(slab(272, -2.8, 32.85, 2, 2.4, 11.7, { kind: 'stone' }));  /* z 27..38.7 */
  c.push(slab(272, -2.8, 49.15, 2, 2.4, 11.7, { kind: 'stone' }));  /* z 43.3..55 */
  /* Battered on both faces, so a ball running into the wall rides up it and
     comes back rather than parking against it. A ball lying flush against a
     wall has no shot over it - even a wedge is still below the top by the
     time it gets there - and that is a dead end, not a hazard. */
  c.push(slope(268, 32.85, -4, 271, 32.85, -1.6, 11.7, 'stone', 1.2));
  c.push(slope(268, 49.15, -4, 271, 49.15, -1.6, 11.7, 'stone', 1.2));
  c.push(slope(276, 32.85, -4, 273, 32.85, -1.6, 11.7, 'stone', 1.2));
  c.push(slope(276, 49.15, -4, 273, 49.15, -1.6, 11.7, 'stone', 1.2));
  c.push(slab(272, -1.1, 41, 2, 1, 4.6, { kind: 'stone' }));        /* over the door */
  c.push(slab(273.2, 0.8, 41, 3.2, 2.8, 8, { kind: 'stone' }));     /* the mill house */
  /* One long sail, turning end over end and reaching right down to the deck
     at the bottom of its swing, so it seals the doorway when it is down and
     leaves it open when it is up. It is turned a quarter so that it faces
     you as you play up to it, the way a windmill's sails do - the wheel
     turns about the line of play rather than across it. A pair of sails
     rather than a cross: with four arms there was always one down. */
  c.push(slab(270.2, 2, 41, 12, 4.2, 2.2,
    { kind: 'wood', yaw: Math.PI / 2, roll: -0.9 }));

  return c;
}

/* Hole two. A short hole off a high tower straight down into a dish, with a
   railed shelf halfway for anyone who does not fancy it. The dish is the
   point: land anywhere on it and the banks feed you in, which makes an ace a
   real possibility - but the far bank is sand, so going long is not free. */
function buildHoleTwo() {
  var c = [];

  /* the tower you play from */
  c.push(deck(0, 26, 0, 26, 26, 'tee'));

  /* The shelf to lay up on. Railed on three sides, but deliberately open on
     the side facing the green: a rail there is a trap, because a ball lying
     against it cannot be played over it - even a wedge is still below the top
     of the rail by the time it gets there. */
  c.push(deck(88, 6, 4, 56, 56, 'fairway'));        /* x 60..116, z -24..32 */
  c.push(slab(88, 7.6, -25, 56, 3.2, 2, { kind: 'rail' }));
  c.push(slab(88, 7.6, 33, 56, 3.2, 2, { kind: 'rail' }));
  c.push(slab(59, 7.6, 4, 2, 3.2, 56, { kind: 'rail' }));

  /* the dish, on its plinth, with the far bank in sand */
  c.push(deck(172, -8.1, 24, 56, 56, 'stone', { thick: 22 }));
  var dish = bowl(172, 24, 14, 68, -8, 0,
    { pad: 'green', bank: 'fairway', east: 'sand' });
  for (var i = 0; i < dish.length; i++) c.push(dish[i]);

  /* a lip right round the rim, so that what lands on the dish stays on it */
  c.push(slab(172, 0.8, -11, 76, 1.6, 2, { kind: 'rail' }));
  c.push(slab(172, 0.8, 59, 76, 1.6, 2, { kind: 'rail' }));
  c.push(slab(137, 0.8, 24, 2, 1.6, 72, { kind: 'rail' }));
  c.push(slab(207, 0.8, 24, 2, 1.6, 72, { kind: 'rail' }));

  /* and a pair of standing stones on the near rim, to thread or bounce off */
  c.push(slab(146, -0.7, 8, 4, 7, 4, { kind: 'stone' }));
  c.push(slab(146, -0.7, 40, 4, 7, 4, { kind: 'stone' }));

  return c;
}

/* Hole three. A long one, with two great arms turning across it at ankle
   height: one out where a layup lands, one guarding the run up to the green.
   Drive over them if you can carry that far; otherwise wait for the gap. */
function buildHoleThree() {
  var c = [];

  c.push(deck(0, 8, 0, 30, 26, 'tee'));             /* x -15..15 */
  /* a conveyor running the wrong way, over half the width, right where a
     drive runs out: aim away from it or get dragged back down the hole */
  push(c, inlay(15, 225, -35, 35, 8, 'fairway',
    { x0: 176, x1: 214, z0: -35, z1: -2, kind: 'belt', opts: { belt: -17 } }));
  c.push(slab(120, 9.6, -36, 210, 3.2, 2, { kind: 'rail' }));
  c.push(slab(120, 9.6, 36, 210, 3.2, 2, { kind: 'rail' }));

  /* The first arm, out where a short drive or a layup comes to rest. Kept
     short on purpose: a ball cannot settle anywhere an arm will reach, so a
     wide slow arm is not an obstacle but a blender - everything that lands
     inside it gets punted about until the shot clock runs out. */
  c.push(slab(150, 11.5, 0, 3, 7, 3, { kind: 'stone' }));
  c.push(slab(150, 9.3, 0, 22, 2.4, 2.4, { kind: 'wood', spin: 0.7 }));

  /* down to the lower half */
  c.push(ramp(225, 8, 260, 2, 0, 70, 'fairway'));
  c.push(slab(242.5, 6.6, -36, 36, 3.2, 2, { kind: 'rail', tilt: -0.1699 }));
  c.push(slab(242.5, 6.6, 36, 36, 3.2, 2, { kind: 'rail', tilt: -0.1699 }));

  push(c, inlay(260, 545, -25, 75, 2, 'fairway',
    { x0: 322, x1: 344, z0: 8, z1: 30, kind: 'spring' }));
  c.push(deck(610, 2, 25, 70, 100, 'fairway'));    /* x 575..645 */
  c.push(deck(560, 2, 0, 30, 50, 'fairway'));      /* z -25..25 */
  c.push(deck(560, 2, 65, 30, 20, 'fairway'));     /* z  55..75 */
  c.push(deck(560, 2, 40, 30, 30, 'green'));
  c.push(slab(452.5, 3.6, -26, 385, 3.2, 2, { kind: 'rail' }));
  c.push(slab(452.5, 3.6, 76, 385, 3.2, 2, { kind: 'rail' }));
  c.push(slab(646, 3.6, 25, 2, 3.2, 100, { kind: 'rail' }));

  /* and the second, turning the other way across the run up to the green */
  c.push(slab(405, 5.5, 40, 3, 7, 3, { kind: 'stone' }));

}

/* Hole four. A half pipe: a groove ten metres wide with a bank up each side,
   so a ball that strays is thrown back towards the middle instead of off the
   course. There is a sand trap in the fast lane, which is the reason to ride
   a bank rather than sit in the groove all the way down. */
function buildHoleFour() {
  var c = [];

  c.push(deck(0, 14, 0, 26, 24, 'tee'));

  /* The groove, with a patch of sand laid flush into it rather than sunk.
     Sunk, it was a prison: the groove funnels every ball into the far wall
     of the pit, and from up against a wall there is no shot that clears it.
     Further down there is a conveyor running across the groove, which shoves
     anything sitting in the fast lane out onto a bank. */
  c.push(deck(90, 0, 0, 160, 10, 'fairway'));       /* x  10..170, under the tee */
  c.push(deck(180, 0, 0, 20, 10, 'sand'));          /* x 170..190 */
  /* Set in from the edges of the groove on purpose. Run a sideways belt
     right up to where the bank starts and a ball rolling back down the bank
     lands on it, is thrown up again, and pinballs there until the shot clock
     saves it. */
  push(c, inlay(190, 332, -5, 5, 0, 'fairway',
    { x0: 232, x1: 260, z0: -3, z1: 3, kind: 'belt', opts: { beltSide: 22 } }));

  /* and the banks, running the whole length */
  c.push(slope(171, -5, 0, 171, -45, 14, 322, 'fairway', 2.6));
  c.push(slope(171, 5, 0, 171, 45, 14, 322, 'fairway', 2.6));
  c.push(slab(171, 15.6, -46, 322, 3.2, 2, { kind: 'rail' }));
  c.push(slab(171, 15.6, 46, 322, 3.2, 2, { kind: 'rail' }));

  /* a shelf at the end for the green, walled so nothing runs off it */
  c.push(deck(349, 0, -22, 34, 24, 'fairway'));     /* z -34..-10 */
  c.push(deck(349, 0, 22, 34, 24, 'fairway'));      /* z  10..34 */
  c.push(deck(349, 0, 0, 34, 20, 'green'));         /* x 332..366, z -10..10 */
  c.push(slab(367, 1.1, 0, 2, 2.2, 70, { kind: 'rail' }));
  c.push(slab(349, 1.1, -35, 34, 2.2, 2, { kind: 'rail' }));
  c.push(slab(349, 1.1, 35, 34, 2.2, 2, { kind: 'rail' }));

  return c;
}

/* Hole five. All carry: a small island out over nothing, with a lip round it
   so that anything landing on it stays, and sand along the far side so going
   long is still going long. */
function buildHoleFive() {
  var c = [];

  c.push(deck(0, 10, 0, 24, 24, 'tee'));

  /* the island, cut so the green is flush in the middle of it */
  /* A green with sand all the way round it. The sand is not decoration: it
     is what stops a ball that lands hot from skipping straight off the far
     side, because sand takes a bounce out of one and grass does not. */
  c.push(deck(131, 0, 22, 16, 56, 'sand'));         /* x 123..139, z -6..50 */
  c.push(deck(172, 0, 22, 14, 56, 'sand'));         /* x 165..179 */
  c.push(deck(152, 0, 0, 26, 12, 'sand'));          /* z -6.. 6 */
  c.push(deck(152, 0, 44, 26, 12, 'sand'));         /* z 38..50 */
  c.push(deck(152, 0, 22, 26, 32, 'green'));        /* x 139..165, z  6..38 */

  /* and the lip that keeps on it whatever lands on it */
  c.push(slab(151, 0.8, -6.9, 58, 1.6, 1.8, { kind: 'rail' }));
  c.push(slab(151, 0.8, 50.9, 58, 1.6, 1.8, { kind: 'rail' }));
  c.push(slab(122.1, 0.8, 22, 1.8, 1.6, 62, { kind: 'rail' }));
  c.push(slab(179.9, 0.8, 22, 1.8, 1.6, 62, { kind: 'rail' }));

  return c;
}

/* A platform that shuttles. Given where it sits at the middle of its run and
   how far it goes each way, so a lift is written down as the two heights it
   travels between. */
function shuttle(sl, slide, seconds, phase) {
  sl.slide = slide;
  sl.slideRate = (Math.PI * 2) / seconds;
  sl.phase = phase || 0;
  sl.bound = slabBounds(sl);
  return sl;
}
function platform(x, y, z, w, d, kind, slide, seconds, opts) {
  opts = opts || {};
  return shuttle(deck(x, y, z, w, d, kind, opts), slide, seconds, opts.phase);
}

/* Hole six. It goes up. A drive that runs onto the bounce pad is thrown
   clean up onto the next shelf; one that does not has to grind up the ramp
   beside it. The last climb is too tall for either, so there is a lift - ride
   it to the top and chip across to the green, and mind that you do not chip
   while it is still down there. */
function buildHoleSix() {
  var c = [];

  c.push(deck(0, 0, 0, 30, 28, 'tee'));             /* x -15..15 */

  /* the bottom shelf, with the pad set where a drive runs out */
  push(c, inlay(15, 250, -35, 35, 0, 'fairway',
    { x0: 210, x1: 234, z0: -20, z1: 20, kind: 'spring', opts: { kick: 16 } }));
  c.push(slab(132, 1.6, -36, 235, 3.2, 2, { kind: 'rail' }));
  c.push(slab(132, 1.6, 36, 235, 3.2, 2, { kind: 'rail' }));

  /* the slow way up, for anyone who missed the pad and can still run it */
  c.push(ramp(250, 0, 264, 6, 0, 70, 'fairway'));

  /* the middle shelf */
  c.push(deck(332, 6, 0, 136, 70, 'fairway', { thick: 10 }));   /* x 264..400 */
  c.push(slab(332, 7.6, -36, 136, 3.2, 2, { kind: 'rail' }));
  c.push(slab(332, 7.6, 36, 136, 3.2, 2, { kind: 'rail' }));

  /* The lift. Its top rides between the middle shelf and the top one, and it
     is walled on three sides so that what lands on it stays on it - the side
     facing back down the hole is left open so a ball can roll straight on
     while it is down. */
  var run = { x: 0, y: 7, z: 0 };
  var turn = 11;
  c.push(platform(422, 13, 0, 44, 44, 'fairway', run, turn, { thick: 6 }));
  /* Kerbed rather than walled: a ball lying flush against a wall has no shot
     over it, and a lift with a dead ball on it is a dead hole. Kerbs down
     the two sides to hold it on, and nothing front or back. The back is open
     so a ball can roll aboard off the middle shelf while the lift is down;
     the front is closed by the top shelf itself, and that is only a wall
     while the lift is low - by the time it is at the top there is nothing
     in the way at all, which is what makes waiting the whole hole. */
  c.push(shuttle(slope(422, -20.9, 13, 422, -23.1, 15.2, 48, 'stone', 1), run, turn));
  c.push(shuttle(slope(422, 20.9, 13, 422, 23.1, 15.2, 48, 'stone', 1), run, turn));

  /* the top shelf, with the green cut into it */
  push(c, inlay(444, 520, -30, 30, 20, 'fairway',
    { x0: 470, x1: 500, z0: -15, z1: 15, kind: 'green' }));
  c.push(slab(482, 21.6, -31, 76, 3.2, 2, { kind: 'rail' }));
  c.push(slab(482, 21.6, 31, 76, 3.2, 2, { kind: 'rail' }));
  c.push(slab(521, 21.6, 0, 2, 3.2, 62, { kind: 'rail' }));

  return c;
}

/* Hole seven. One hole, two holes. Straight ahead is a causeway twenty
   metres wide over nothing, and a drive down it leaves a putt for three.
   Round to the right is a fairway seventy metres wide with a bunker in it
   and no danger at all, and it leaves a wedge. Everything about this hole is
   decided before you swing. */
function buildHoleSeven() {
  var c = [];

  /* the tee is the near end of the causeway, so you are standing on it */
  c.push(deck(0, 10, 0, 30, 20, 'tee'));            /* x -15..15, z -10..10 */
  c.push(deck(141.5, 10, 0, 253, 20, 'fairway'));   /* x  15..268 */
  c.push(slab(141.5, 10.5, -11, 253, 1, 2, { kind: 'rail' }));
  c.push(slab(141.5, 10.5, 11, 253, 1, 2, { kind: 'rail' }));

  /* the long way: wide, railed, and with one bunker in it to think about */
  push(c, inlay(40, 268, 26, 96, 10, 'fairway',
    { x0: 150, x1: 182, z0: 44, z1: 76, kind: 'sand' }));
  c.push(slab(154, 11.6, 25, 228, 3.2, 2, { kind: 'rail' }));
  c.push(slab(154, 11.6, 97, 228, 3.2, 2, { kind: 'rail' }));

  /* and the shelf they both arrive at */
  push(c, inlay(268, 350, -25, 100, 10, 'fairway',
    { x0: 278, x1: 308, z0: -15, z1: 15, kind: 'green' }));
  c.push(slab(309, 11.6, -26, 82, 3.2, 2, { kind: 'rail' }));
  c.push(slab(309, 11.6, 101, 82, 3.2, 2, { kind: 'rail' }));
  c.push(slab(351, 11.6, 37.5, 2, 3.2, 127, { kind: 'rail' }));

  return c;
}

/* The one hole that is loaded. TEE and PIN are filled in rather than
   replaced, so anything holding on to them keeps working across a change. */
var COURSE = [];
var TEE = { x: 0, y: 0, z: 0 };
var PIN = { x: 0, y: 0, z: 0 };
var PAR = 4;
var GREEN_RADIUS = 17;
var CUP_RADIUS = 0.5;
var HOLE_INDEX = 0;

function loadHole(i) {
  HOLE_INDEX = ((i % HOLES.length) + HOLES.length) % HOLES.length;
  var h = HOLES[HOLE_INDEX];
  var built = h.build();
  COURSE.length = 0;
  for (var k = 0; k < built.length; k++) COURSE.push(built[k]);
  TEE.x = h.tee.x; TEE.y = h.tee.y; TEE.z = h.tee.z;
  PIN.x = h.pin.x; PIN.y = h.pin.y; PIN.z = h.pin.z;
  PAR = h.par;
  GREEN_RADIUS = h.greenRadius;
  return HOLE_INDEX;
}
function currentHole() {
  return { index: HOLE_INDEX, name: HOLES[HOLE_INDEX].name, par: PAR,
           count: HOLES.length, tee: TEE, pin: PIN, greenRadius: GREEN_RADIUS };
}
loadHole(0);

/* how fast the grass is, how much it gives, how much it grabs at a ball
   skidding along it, and how much of your swing gets to the ball from it */
var SURFACES = {
  tee:     { name: 'Tee',      roll: 0.062, bounce: 0.36, skid: 0.70, grab: 1.00 },
  fairway: { name: 'Fairway',  roll: 0.062, bounce: 0.36, skid: 0.70, grab: 1.00 },
  green:   { name: 'Green',    roll: 0.048, bounce: 0.26, skid: 0.50, grab: 1.00 },
  sand:    { name: 'Bunker',   roll: 1.80, bounce: 0.04, skid: 0.05, grab: 0.42 },
  stone:   { name: 'Stone',    roll: 0.06, bounce: 0.45, skid: 0.80, grab: 0.70 },
  wood:    { name: 'Windmill', roll: 0.08, bounce: 0.22, skid: 0.85, grab: 0.70 },
  rail:    { name: 'Rail',     roll: 0.08, bounce: 0.55, skid: 0.86, grab: 0.70 },
  belt:    { name: 'Conveyor', roll: 1.40, bounce: 0.22, skid: 0.60, grab: 0.90 },
  spring:  { name: 'Bounce pad', roll: 0.20, bounce: 0.45, skid: 0.88, grab: 0.90,
             kick: 12 },
  'void':  { name: 'Off the course', roll: 0.09, bounce: 0, skid: 0, grab: 1.00 }
};

function gripOf(kind) { return (SURFACES[kind] || SURFACES.fairway).roll; }

/* --------------------------------------------------------- what is solid */

/* Where a world point sits in one slab's own frame, and back again. */
function slabYaw(sl, time) {
  return sl.yaw + (sl.spin ? sl.spin * (time || 0) + sl.phase : 0);
}
function slabTilt(sl, time) {
  return sl.tilt + (sl.roll ? sl.roll * (time || 0) + sl.phase : 0);
}
function toLocal(sl, p, time) {
  var c = slabPos(sl, time);
  var d = { x: p.x - c.x, y: p.y - c.y, z: p.z - c.z };
  return rotZ(rotY(d, -slabYaw(sl, time)), -slabTilt(sl, time));
}
function toWorldDir(sl, n, time) {
  return rotY(rotZ(n, slabTilt(sl, time)), slabYaw(sl, time));
}
function toWorld(sl, l, time) {
  var d = toWorldDir(sl, l, time), c = slabPos(sl, time);
  return { x: c.x + d.x, y: c.y + d.y, z: c.z + d.z };
}

/* The closest point on a slab to a ball, and how deep it is in. Null when
   they are not touching. The normal points out of the slab at the ball. */
function slabContact(sl, p, r, time) {
  if (slabFar(sl, p, r, time)) return null;
  var l = toLocal(sl, p, time);
  var h = sl.half;
  var cx = Math.max(-h.x, Math.min(h.x, l.x));
  var cy = Math.max(-h.y, Math.min(h.y, l.y));
  var cz = Math.max(-h.z, Math.min(h.z, l.z));
  var dx = l.x - cx, dy = l.y - cy, dz = l.z - cz;
  var d2 = dx * dx + dy * dy + dz * dz;
  if (d2 > r * r) return null;
  var n, depth;
  if (d2 > 1e-10) {
    var d = Math.sqrt(d2);
    n = { x: dx / d, y: dy / d, z: dz / d };
    depth = r - d;
  } else {
    /* the middle of the ball is inside it: push out through the nearest face */
    var ox = h.x - Math.abs(l.x), oy = h.y - Math.abs(l.y), oz = h.z - Math.abs(l.z);
    var sgn = function (v) { return v < 0 ? -1 : 1; };
    if (ox <= oy && ox <= oz) { n = { x: sgn(l.x), y: 0, z: 0 }; depth = r + ox; }
    else if (oy <= oz) { n = { x: 0, y: sgn(l.y), z: 0 }; depth = r + oy; }
    else { n = { x: 0, y: 0, z: sgn(l.z) }; depth = r + oz; }
  }
  return { n: toWorldDir(sl, n, time), depth: depth, slab: sl, local: l };
}

/* How fast the surface of a slab is moving at a point on it. Worked out by
   asking where that bit of the slab will be a moment later, rather than by
   hand, because getting a sign wrong here would fling the ball backwards. */
function surfaceVelocity(sl, p, time) {
  if (sl.belt || sl.beltSide) {
    /* a conveyor: the surface itself runs, along the slab or across it */
    return toWorldDir(sl, { x: sl.belt, y: 0, z: sl.beltSide }, time);
  }
  if (!moving(sl)) return { x: 0, y: 0, z: 0 };
  var e = 0.001;
  var l = toLocal(sl, p, time);
  var later = toWorld(sl, l, (time || 0) + e);
  return { x: (later.x - p.x) / e, y: (later.y - p.y) / e, z: (later.z - p.z) / e };
}

/* Where the top face of one slab sits above or below a column, if the column
   passes through it at all. Solved directly, because for a tilted box the
   height of the top face is linear in the local across-slab distance. */
function slabTopAt(sl, x, z, time) {
  var c = slabPos(sl, time);
  if (Math.abs(x - c.x) > sl.bound.x || Math.abs(z - c.z) > sl.bound.z) return null;
  var h = sl.half;
  var f = rotY({ x: x - c.x, y: 0, z: z - c.z }, -slabYaw(sl, time));
  var tilt = slabTilt(sl, time);
  var ct = Math.cos(tilt), st = Math.sin(tilt);
  /* local y is h.y on the top face, so the world height follows at once */
  var y = c.y + (h.y + f.x * st) / ct;
  var lx = f.x / ct + h.y * st / ct;
  if (Math.abs(lx) > h.x || Math.abs(f.z) > h.z) return null;
  return { y: y, kind: sl.kind, slab: sl,
           normal: toWorldDir(sl, { x: 0, y: 1, z: 0 }, time) };
}

/* The top of whatever you would be standing on at a spot, and what it is made
   of. Used for standing the golfer up, for the camera, and for telling you
   your lie. Rails and anything that is turning are not floors. Null over the
   void. */
function groundUnder(x, z, time) {
  var best = null;
  for (var i = 0; i < COURSE.length; i++) {
    var sl = COURSE[i];
    /* a platform that only shuttles is still a floor - it is the turning
       things that cannot be stood on */
    if (sl.kind === 'rail' || sl.spin || sl.roll) continue;
    var top = slabTopAt(sl, x, z, time);
    if (top === null) continue;
    if (!best) { best = top; continue; }
    if (top.y > best.y + 1e-6) { best = top; continue; }
    /* Where two faces meet at exactly the same height - the ridge running out
       to the corner of a dish, or the edge of a green laid into a shelf - go
       with whichever grips least, and do it the same way everywhere. */
    if (top.y > best.y - 1e-6 && gripOf(top.kind) < gripOf(best.kind)) best = top;
  }
  return best;
}

function surfaceAt(x, z, time) {
  var g = groundUnder(x, z, time);
  return g ? g.kind : 'void';
}
function heightAt(x, z, time) {
  var g = groundUnder(x, z, time);
  return g ? g.y : VOID_Y;
}
function normalAt(x, z, time) {
  var g = groundUnder(x, z, time);
  return g ? g.normal : { x: 0, y: 1, z: 0 };
}
/* where the middle of a ball sits when it is lying on the ground there */
function restHeight(x, z, time) { return heightAt(x, z, time) + BALL_RADIUS; }

/* Somewhere a turning part of the course will come round to. A ball is not
   allowed to settle in here: it waits, still, until it is knocked clear,
   which is what you would see happen and so what has to happen. */
function inSweep(x, y, z) {
  var r = BALL_RADIUS;
  for (var i = 0; i < COURSE.length; i++) {
    var sl = COURSE[i], h = sl.half;
    if (!sl.spin && !sl.roll) continue;
    var c = slabPos(sl, 0);
    var dx = x - c.x, dy = y - c.y, dz = z - c.z;
    if (sl.spin) {
      var reach = h.x + r;
      if (dx * dx + dz * dz < reach * reach && Math.abs(dy) < h.y + r) return true;
    } else if (sl.roll) {
      /* it turns in a plane; the face it can reach is a disc in that plane,
         and it never reaches further than its own depth across it */
      var R = Math.sqrt(h.x * h.x + h.y * h.y) + r;
      var nx = Math.sin(sl.yaw), nz = Math.cos(sl.yaw);
      var across = dx * nx + dz * nz;
      var flat = dx * dx + dy * dy + dz * dz - across * across;
      if (flat < R * R && Math.abs(across) < h.z + r) return true;
    }
  }
  return false;
}
function onCourse(x, z, time) { return groundUnder(x, z, time) !== null; }

var CLUBS = [

  { id: 'wood',   name: '3 Wood',  speed: 49.3, loft: 14, curve: 0.85, spin: 1.15 },
  { id: 'iron5',  name: '5 Iron',  speed: 40.5, loft: 21, curve: 0.70, spin: 1.45 },
  { id: 'iron8',  name: '8 Iron',  speed: 34, loft: 30, curve: 0.55, spin: 1.80 },
  { id: 'wedge',  name: 'Wedge',   speed: 29.4, loft: 46, curve: 0.40, spin: 2.30 },
  { id: 'putter', name: 'Putter',  speed: 7.0, loft: 0, curve: 0.10, spin: 0 }
];
function clubById(id) {
  for (var i = 0; i < CLUBS.length; i++) if (CLUBS[i].id === id) return CLUBS[i];
  return CLUBS[0];
}

/* What a sensible player would reach for, given the distance left, the lie,
   and how far below you the target is - which matters enormously here, where
   a tee can be thirty metres up. A ball hit downhill is in the air longer and
   goes further for it, so the club you want is the one for a shorter shot. */
function suggestClub(distance, surface, drop) {
  if (surface === 'green' && distance < GREEN_RADIUS) return 'putter';
  var plays = Math.max(6, distance - (drop || 0) * 1.2);
  if (surface === 'sand') return plays > 90 ? 'iron8' : 'wedge';
  var reach = [
    ['wedge', 82], ['iron8', 128], ['iron5', 160], ['wood', 198], ['driver', 1e9]
  ];
  for (var i = 0; i < reach.length; i++) if (plays <= reach[i][1]) return reach[i][0];
  return 'driver';
}

/* ------------------------------------------------------------- the flight */

var GRAVITY = 9.81;
/* Quadratic drag, and a lift term standing in for backspin. The lift is what
   makes a golf ball a golf ball: without it a struck drive falls out of the
   sky at about 150 metres, and every club carries roughly the same distance
   because loft stops buying you anything. It has to act ACROSS the line of
   flight rather than straight up, or it is simply free energy and a 3 wood
   ends up out-driving the driver, which is what the first version did. */
var DRAG = 0.0026;
var LIFT = 0.0042;
var SPIN_DECAY = 0.11;     /* backspin bleeds off through the flight */
var BALL_STOP = 0.30;      /* below this it has stopped, in m/s */
/* Faster than this over the cup and it lips out. The cup here is half a
   metre across - ten times a real one - so the speed a ball can be going and
   still drop has to scale with it, or soft putts horseshoe out of a bucket. */
var HOLE_SPEED = 4.2;
var ROLL_SLOPE = 5 / 7;    /* a rolling sphere only gets this much of gravity */
var ROLL_DRAG = 0.010;     /* air, felt on the ground as well as in it */
/* A shot clock. Almost every shot is done inside ten seconds, but a ball can
   find a corner of a course that keeps it alive - swatted by an arm, back
   down a bank, swatted again, creeping down a ramp - and nobody wants to
   watch that for a minute. Past this many seconds the grass starts to hold
   it, harder and harder, until it stops. Holding it rather than simply
   slowing it matters: slowing a ball on a slope only finds the speed where
   the braking balances gravity, and it creeps down for ever at that. */
var STALL_AFTER = 24;
/* One fixed step for everything. The aiming line is the shot played ahead
   of time, so it is only honest if it is played at exactly the same step as
   the real one - a ball rattling between two boxes will not land in the same
   place at 90 a second as it does at 240. */
var SIM_DT = 1 / 120;

/* What leaves the club face: how hard, how high, and how far off line. */
function launchVelocity(club, power, aimYaw, face) {
  var c = typeof club === 'string' ? clubById(club) : club;
  var speed = c.speed * power;
  var loft = c.loft * Math.PI / 180;
  /* a mishit starts the ball offline as well as bending it in the air */
  var yaw = aimYaw + face * 0.07 * c.curve;
  var flat = speed * Math.cos(loft);
  return {
    x: flat * Math.cos(yaw),
    y: speed * Math.sin(loft),
    z: flat * Math.sin(yaw)
  };
}

function Ball() {
  this.age = 0;           /* seconds since it was struck */
  this.pos = { x: TEE.x, y: restHeight(TEE.x, TEE.z), z: TEE.z };
  this.vel = { x: 0, y: 0, z: 0 };
  this.bend = 0;          /* sideways bend left in the shot */
  this.backspin = 0;
  this.wind = { x: 0, z: 0 };
  this.grounded = false;
  this.gn = { x: 0, y: 1, z: 0 };
  this.gv = { x: 0, y: 0, z: 0 };   /* and how fast it is running */
  this.gslab = null;                /* and which slab it actually is */
  this.gkind = 'tee';
  this.padHits = 0;
  this.moving = false;
  this.holed = false;
  this.lost = false;      /* fell off the course */
  this.peak = 0;
  this.carry = 0;
  this.launchedFrom = { x: TEE.x, z: TEE.z };
}

Ball.prototype.strike = function (club, power, aimYaw, face, windX, windZ) {
  var c = typeof club === 'string' ? clubById(club) : club;
  this.vel = launchVelocity(c, power, aimYaw, face);
  this.bend = face * c.curve;
  this.backspin = c.spin;
  this.moving = true;
  this.holed = false;
  this.lost = false;
  this.age = 0;
  this.padHits = 0;
  this.peak = this.pos.y;
  this.carry = 0;
  this.launchedFrom = { x: this.pos.x, z: this.pos.z };
  this.wind = { x: windX || 0, z: windZ || 0 };
  this.grounded = c.loft === 0;
  this.pos.y = restHeight(this.pos.x, this.pos.z) + 0.005;
  /* find out what it is sitting on before the first step, so that a putt off
     a conveyor is on the conveyor from the off */
  this.probeGround(0);
  return this;
};

/* Through the air: drag against the wind, lift across the line of flight,
   gravity, and whatever bend was put on it at impact. */
Ball.prototype.fly = function (dt) {
  var v = this.vel;
  var rx = v.x - this.wind.x, ry = v.y, rz = v.z - this.wind.z;
  var rel = Math.sqrt(rx * rx + ry * ry + rz * rz) || 1e-6;
  v.x -= DRAG * rel * rx * dt;
  v.y -= DRAG * rel * ry * dt;
  v.z -= DRAG * rel * rz * dt;

  /* Lift is perpendicular to the way the ball is actually travelling, in the
     vertical plane, which is what makes it hold its line on the way up and
     drop steeply on the way down instead of skating on forever. */
  var sp = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z) || 1e-6;
  var flat = Math.sqrt(v.x * v.x + v.z * v.z) || 1e-6;
  var mag = LIFT * this.backspin * sp * sp;
  v.x += mag * (-v.y * v.x / flat) / sp * dt;
  v.y += mag * (flat) / sp * dt;
  v.z += mag * (-v.y * v.z / flat) / sp * dt;
  this.backspin *= Math.exp(-SPIN_DECAY * dt);

  v.y -= GRAVITY * dt;

  /* and the shot bends the way it was struck, sideways across the flight */
  var bend = this.bend * 0.30 * dt;
  var nx = -v.z / flat, nz = v.x / flat;
  v.x += nx * bend * flat * 0.06;
  v.z += nz * bend * flat * 0.06;
};

/* On the ground: gravity split about whatever it is resting on, with only
   five sevenths of the slope reaching it because the rest goes into spinning
   it up, and then the surface dragging at it. */
/* how hard the ground is holding the ball, which grows once it has been
   rolling for longer than any shot reasonably takes */
Ball.prototype.grip = function () {
  var sfc = SURFACES[this.gkind] || SURFACES.fairway;
  var over = this.age - STALL_AFTER;
  return sfc.roll + (over > 0 ? over * 0.6 : 0);
};

Ball.prototype.rollForces = function (dt) {
  var v = this.vel, n = this.gn;
  var gn = -GRAVITY * n.y;                       /* gravity along the normal */
  var gtx = -gn * n.x, gty = -GRAVITY - gn * n.y, gtz = -gn * n.z;
  v.x += (gn * n.x + gtx * ROLL_SLOPE) * dt;
  v.y += (gn * n.y + gty * ROLL_SLOPE) * dt;
  v.z += (gn * n.z + gtz * ROLL_SLOPE) * dt;

  /* The ground drags the ball towards whatever the ground itself is doing,
     which on a conveyor belt is not standing still. */
  var gv = this.gv;
  var rx = v.x - gv.x, ry = v.y - gv.y, rz = v.z - gv.z;
  var vn = rx * n.x + ry * n.y + rz * n.z;
  var tx = rx - vn * n.x, ty = ry - vn * n.y, tz = rz - vn * n.z;
  var tsp = Math.sqrt(tx * tx + ty * ty + tz * tz);
  var drop = this.grip() * GRAVITY * dt;
  var k = tsp <= drop ? 0 : (tsp - drop) / tsp;
  v.x = gv.x + vn * n.x + tx * k;
  v.y = gv.y + vn * n.y + ty * k;
  v.z = gv.z + vn * n.z + tz * k;

  /* and the air slows it whatever the ground is doing - without this a ball
     fired off a rail rolls the length of the hole and back */
  var asp = Math.sqrt(v.x * v.x + v.z * v.z);
  if (asp > 1e-6) {
    var air = ROLL_DRAG * asp * asp * dt;
    var ak = asp <= air ? 0 : (asp - air) / asp;
    v.x *= ak; v.z *= ak;
  }

  this.backspin *= Math.exp(-3 * dt);
  this.bend *= Math.exp(-6 * dt);
};

/* One contact: push the ball out, then decide whether it bounced or settled. */
Ball.prototype.respond = function (ct, time) {
  var p = this.pos, v = this.vel, n = ct.n;
  var sl = ct.slab;
  p.x += n.x * ct.depth;
  p.y += n.y * ct.depth;
  p.z += n.z * ct.depth;

  var sv = surfaceVelocity(sl, p, time);
  var rx = v.x - sv.x, ry = v.y - sv.y, rz = v.z - sv.z;
  var into = rx * n.x + ry * n.y + rz * n.z;
  if (into >= 0) return;

  if (!this.carry && n.y > 0.5) {
    this.carry = Math.sqrt(
      (p.x - this.launchedFrom.x) * (p.x - this.launchedFrom.x) +
      (p.z - this.launchedFrom.z) * (p.z - this.launchedFrom.z));
  }

  var sfc = SURFACES[sl.kind] || SURFACES.fairway;
  /* a bounce pad never lets the ball settle on it - that is the whole idea */
  var settling = n.y > 0.55 && -into < REST_SPEED && !sfc.kick;
  var e = settling ? 0 : sfc.bounce;
  rx -= (1 + e) * into * n.x;
  ry -= (1 + e) * into * n.y;
  rz -= (1 + e) * into * n.z;

  if (!settling) {
    /* the turf grabs at whatever is skidding along it, and heavy backspin
       checks the ball up rather than letting it release */
    var vn = rx * n.x + ry * n.y + rz * n.z;
    var tx = rx - vn * n.x, ty = ry - vn * n.y, tz = rz - vn * n.z;
    /* the turf grabs at what is skidding along it, and backspin checks a
       lofted shot up rather than letting it release - which is what keeps a
       wedge stopping dead while a drive runs on */
    var k = sfc.skid * (1 - Math.min(0.62, this.backspin * 0.42));
    rx = vn * n.x + tx * k;
    ry = vn * n.y + ty * k;
    rz = vn * n.z + tz * k;
    this.bend *= 0.35;
    this.backspin *= 0.4;
  }

  /* A pad throws the ball off it whatever it arrived at, so that a dribble
     onto one goes up as well as a drive. Each hop in a row off the same pad
     gets less, or a ball dropped on one would bounce for ever. */
  if (sfc.kick && n.y > 0.5) {
    this.padHits++;
    var kick = (sl.kick || sfc.kick) * Math.pow(0.5, this.padHits - 1);
    var outN = rx * n.x + ry * n.y + rz * n.z;
    if (outN < kick) {
      rx += (kick - outN) * n.x;
      ry += (kick - outN) * n.y;
      rz += (kick - outN) * n.z;
    }
  }

  v.x = rx + sv.x; v.y = ry + sv.y; v.z = rz + sv.z;
};

/* Every slab the ball is in, dealt with. One slab needs one go; two or more
   are a corner, and those have to be worked over a few times or the ball
   rattles between them instead of settling into the join. */
Ball.prototype.resolve = function (time) {
  for (var pass = 0; pass < 3; pass++) {
    var hits = 0;
    for (var i = 0; i < COURSE.length; i++) {
      var ct = slabContact(COURSE[i], this.pos, BALL_RADIUS, time);
      if (!ct) continue;
      hits++;
      this.respond(ct, time);
    }
    if (hits < 2) return;
  }
};

/* A lower bound on how far the ball is from anything solid. If a slab is
   clear of the ball along any one axis then it is at least that far away, so
   the largest of the three gaps is a distance it cannot be nearer than. Used
   to skip the collision work altogether while the ball is up in the air,
   which is most of a drive. */
Ball.prototype.clearance = function () {
  var best = 1e9, p = this.pos;
  for (var i = 0; i < COURSE.length; i++) {
    var sl = COURSE[i], b = sl.bound;
    /* a slab that shuttles could be anywhere along its run, so allow for it */
    var slack = sl.slide
      ? Math.abs(sl.slide.x) + Math.abs(sl.slide.y) + Math.abs(sl.slide.z) : 0;
    var d = Math.abs(p.x - sl.pos.x) - b.x - slack;
    var dy = Math.abs(p.y - sl.pos.y) - b.y - slack;
    if (dy > d) d = dy;
    var dz = Math.abs(p.z - sl.pos.z) - b.z - slack;
    if (dz > d) d = dz;
    if (d < best) best = d;
  }
  return best;
};

/* Is it lying on something? Asked with a slightly fat ball, because a ball
   resting exactly on a floor is touching it by nothing at all, and a ball
   that keeps forgetting it is on the ground gets no rolling friction. */
Ball.prototype.probeGround = function (time) {
  this.grounded = false;
  this.gslab = null;
  var best = null;
  for (var i = 0; i < COURSE.length; i++) {
    var ct = slabContact(COURSE[i], this.pos, BALL_RADIUS + 0.04, time);
    if (!ct || ct.n.y <= 0.55) continue;
    if (!best || ct.n.y > best.n.y + 0.02) { best = ct; continue; }
    /* On the join between two faces, go with whichever grips least - or a
       ball balanced on the ridge between grass and sand is held fast by the
       sand while standing on a slope the grass would run it straight down. */
    if (ct.n.y > best.n.y - 0.02 && gripOf(ct.slab.kind) < gripOf(best.slab.kind)) best = ct;
  }
  if (!best) return;
  this.gn = best.n;
  this.gv = surfaceVelocity(best.slab, this.pos, time);
  this.gslab = best.slab;
  this.gkind = best.slab.kind;
  this.grounded = true;
  if (!(SURFACES[this.gkind] || {}).kick) this.padHits = 0;
};

/* Last resort. A turning arm can carry a ball round with it indefinitely -
   the ball rides the face, the push is always along the way it is going, and
   it gets quicker rather than slower. When the shot clock has run right out,
   set the ball down outside whatever is sweeping it and give the player their
   turn back. */
Ball.prototype.parkClear = function (time) {
  for (var i = 0; i < COURSE.length; i++) {
    var sl = COURSE[i];
    if (!sl.spin) continue;
    var dx = this.pos.x - sl.pos.x, dz = this.pos.z - sl.pos.z;
    var d = Math.sqrt(dx * dx + dz * dz);
    var want = sl.half.x + BALL_RADIUS + 0.4;
    if (d >= want) continue;
    var a = d > 1e-6 ? Math.atan2(dz, dx) : 0;
    var x = sl.pos.x + Math.cos(a) * want, z = sl.pos.z + Math.sin(a) * want;
    if (!onCourse(x, z, time)) continue;
    this.pos.x = x; this.pos.z = z;
    this.pos.y = restHeight(x, z, time);
  }
};

/* A ball lying on a platform travels with it between shots. Without this it
   would be left hanging in the air the moment the platform moved on. */
Ball.prototype.drift = function (from, to) {
  if (this.moving || !this.gslab || !this.gslab.slide) return;
  var a = slabPos(this.gslab, from), b = slabPos(this.gslab, to);
  this.pos.x += b.x - a.x;
  this.pos.y += b.y - a.y;
  this.pos.z += b.z - a.z;
};

Ball.prototype.settled = function () {
  this.moving = false;
  this.vel.x = 0; this.vel.y = 0; this.vel.z = 0;
  if (!this.carry) this.carry = Math.sqrt(
    (this.pos.x - this.launchedFrom.x) * (this.pos.x - this.launchedFrom.x) +
    (this.pos.z - this.launchedFrom.z) * (this.pos.z - this.launchedFrom.z));
};

Ball.prototype.step = function (dt, time) {
  if (!this.moving || this.holed) return this;
  var t = time === undefined ? 0 : time;
  var p = this.pos, v = this.vel;

  this.age += dt;
  if (this.grounded) this.rollForces(dt);
  else this.fly(dt);

  /* in the air, a ball still going after all that long is bouncing about in
     a corner somewhere, so take it out of it */
  if (!this.grounded && this.age > STALL_AFTER) {
    var tired = Math.exp(-Math.min(3, (this.age - STALL_AFTER) * 0.5) * dt);
    v.x *= tired; v.y *= tired; v.z *= tired;
  }

  var travel = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z) * dt;

  /* well clear of everything: one step, and nothing to collide with */
  if (this.clearance() - BALL_RADIUS > travel + 0.05) {
    p.x += v.x * dt; p.y += v.y * dt; p.z += v.z * dt;
    if (p.y > this.peak) this.peak = p.y;
    this.grounded = false;
    if (p.y < VOID_Y) {
      this.lost = true; this.moving = false;
      if (!this.carry) this.carry = Math.sqrt(
        (p.x - this.launchedFrom.x) * (p.x - this.launchedFrom.x) +
        (p.z - this.launchedFrom.z) * (p.z - this.launchedFrom.z));
    }
    return this;
  }

  var n = Math.max(1, Math.min(48, Math.ceil(travel / MAX_STEP)));
  var h = dt / n;
  for (var i = 0; i < n; i++) {
    p.x += v.x * h; p.y += v.y * h; p.z += v.z * h;
    if (p.y > this.peak) this.peak = p.y;
    this.resolve(t + h * (i + 1));
    if (this.cup(t)) return this;
    if (p.y < VOID_Y) {
      this.lost = true; this.moving = false;
      if (!this.carry) this.carry = Math.sqrt(
        (p.x - this.launchedFrom.x) * (p.x - this.launchedFrom.x) +
        (p.z - this.launchedFrom.z) * (p.z - this.launchedFrom.z));
      return this;
    }
  }
  this.probeGround(t + dt);

  /* A ball that rolls onto a pad never strikes it - it is in resting contact
     the whole way across - so nothing in the collision ever fires. Arriving
     on one at all is what throws you, however you got there. */
  if (this.grounded && !this.padHits) {
    var padSfc = SURFACES[this.gkind] || SURFACES.fairway;
    if (padSfc.kick) {
      this.padHits = 1;
      /* arriving on the pad is where the shot came down, whether it struck
         the pad hard enough to register as a bounce or settled onto it */
      if (!this.carry) this.carry = Math.sqrt(
        (p.x - this.launchedFrom.x) * (p.x - this.launchedFrom.x) +
        (p.z - this.launchedFrom.z) * (p.z - this.launchedFrom.z));
      var pn = this.gn;
      var up = (this.gslab && this.gslab.kick) || padSfc.kick;
      var along = v.x * pn.x + v.y * pn.y + v.z * pn.z;
      if (along < up) {
        v.x += (up - along) * pn.x;
        v.y += (up - along) * pn.y;
        v.z += (up - along) * pn.z;
      }
      this.grounded = false;
    }
  }

  if (this.age > STALL_AFTER + 4) {
    if (this.grounded) {
      this.parkClear(t + dt);
      this.settled();
      return this;
    }
    /* still in the air, so it has nowhere to be put down: take the pace out
       of it and let it come down wherever that leaves it */
    v.x *= 0.1; v.z *= 0.1;
  }

  if (this.grounded) {
    var slope = Math.sqrt(Math.max(0, 1 - this.gn.y * this.gn.y));
    var held = GRAVITY * slope * ROLL_SLOPE <= this.grip() * GRAVITY;
    var sp = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
    /* A ball is not normally allowed to settle where something turning will
       come round to it. Once the shot clock has run right out it is, or a
       ball caught between an arm and a wall never gives you your turn back. */
    var pinned = inSweep(p.x, p.y, p.z);
    /* Nor may it settle on a conveyor, which will carry it off whatever it
       looks like at the moment its own speed passes through zero, nor on a
       bounce pad until the pad has stopped throwing it back up. */
    var rel = Math.sqrt(
      (v.x - this.gv.x) * (v.x - this.gv.x) +
      (v.y - this.gv.y) * (v.y - this.gv.y) +
      (v.z - this.gv.z) * (v.z - this.gv.z));
    var lively = (SURFACES[this.gkind] || {}).kick && this.padHits < 6;
    /* A platform carries the ball with it; a belt runs away underneath one.
       So on a platform what counts as still is being still RELATIVE TO IT,
       and the ball then rides along at rest. */
    var carried = !!(this.gslab && this.gslab.slide);
    var still = carried ? rel < BALL_STOP : (sp < BALL_STOP && rel < BALL_STOP);
    if (held && still && !pinned && !lively) this.settled();
  }
  return this;
};

/* The cup. Too quick over it and it horseshoes out, which is golf. */
Ball.prototype.cup = function (time) {
  var p = this.pos, v = this.vel;
  if (!this.grounded && p.y > restHeight(PIN.x, PIN.z, time) + 0.5) return false;
  var dx = p.x - PIN.x, dz = p.z - PIN.z;
  var cd = Math.sqrt(dx * dx + dz * dz);
  if (cd >= CUP_RADIUS) return false;
  var sp = Math.sqrt(v.x * v.x + v.z * v.z);
  if (sp < HOLE_SPEED) {
    this.holed = true;
    this.moving = false;
    p.x = PIN.x; p.z = PIN.z;
    p.y = heightAt(PIN.x, PIN.z, time) - 0.12;
    v.x = 0; v.y = 0; v.z = 0;
    if (!this.carry) this.carry = Math.sqrt(
      (p.x - this.launchedFrom.x) * (p.x - this.launchedFrom.x) +
      (p.z - this.launchedFrom.z) * (p.z - this.launchedFrom.z));
    return true;
  }
  /* it caught the lip: most of the pace goes, and it carries on roughly the
     way it was going rather than squirting off sideways */
  var away = Math.atan2(dz || 1e-6, dx || 1e-6);
  v.x = (v.x * 0.5 + Math.cos(away) * sp * 0.2) * 0.62;
  v.z = (v.z * 0.5 + Math.sin(away) * sp * 0.2) * 0.62;
  return false;
};

/* Where a shot would actually finish, run through the same physics that will
   run it for real. The aiming line is not a guess or a parabola drawn to look
   about right - it is the shot, played ahead of time. */
function predictShot(fromX, fromZ, clubId, power, aimYaw, face, wind, grab, time) {
  var ghost = new Ball();
  ghost.pos = { x: fromX, y: restHeight(fromX, fromZ), z: fromZ };
