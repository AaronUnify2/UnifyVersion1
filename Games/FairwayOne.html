<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Fairway One - one hole of blocky 3D golf on a floating course, played with a gamepad, a keyboard or a thumb.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fairway One">
<title>Fairway One</title>
<style>
  :root {
    --panel: rgba(12, 24, 20, 0.74);
    --panel-soft: rgba(12, 24, 20, 0.5);
    --edge: rgba(255, 255, 255, 0.16);
    --accent: #ffd23f;
    --text: #f2f7f3;
    --muted: #9fb4a6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #7fb9dc;
    font-family: ui-rounded, "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 14px;
    padding: 9px 13px;
    backdrop-filter: blur(6px);
  }

  #hud {
    position: fixed; inset: 0;
    padding: calc(10px + env(safe-area-inset-top)) 14px 14px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; gap: 10px;
  }
  #left { display: flex; flex-direction: column; gap: 8px; }
  #right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

  .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--muted); }
  .big { font-size: clamp(20px, 4vw, 30px); font-weight: 700; line-height: 1.05; }
  .mid { font-size: clamp(13px, 2.3vw, 17px); font-weight: 600; }
  #dist { color: var(--accent); }

  .tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; pointer-events: auto; }
  .tools button {
    font: inherit; font-size: 11px; color: var(--text);
    background: var(--panel-soft); border: 1px solid var(--edge);
    border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap;
  }
  .tools button[hidden] { display: none; }
  #fullBtn { background: rgba(255, 210, 63, 0.18); border-color: rgba(255, 210, 63, 0.5); }

  /* the swing meter, up the left of the screen where it does not cover the shot */
  #meterWrap {
    position: fixed; left: 16px; bottom: 96px;
    width: 26px; height: 190px;
    border-radius: 14px; border: 1px solid var(--edge);
    background: var(--panel); overflow: hidden;
    display: none; pointer-events: none;
  }
  #meterWrap.show { display: block; }
  #meterFill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: #7fd66b; }
  #meterWrap::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0;
    height: 2px; background: var(--accent);
  }

  #msg {
    position: fixed; left: 50%; top: 18%; transform: translateX(-50%);
    font-size: clamp(15px, 3vw, 22px); font-weight: 700;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
    pointer-events: none; text-align: center;
  }
  #prompt {
    position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    font-size: clamp(11px, 2.2vw, 14px); color: var(--text);
    background: var(--panel-soft); border: 1px solid var(--edge);
    border-radius: 999px; padding: 7px 16px; white-space: nowrap;
    pointer-events: none;
  }

  /* thumb controls, for playing it on a phone */
  #touch {
    position: fixed; right: 14px; bottom: calc(56px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; align-items: center; pointer-events: auto;
  }
  #touch button {
    font: inherit; font-weight: 700; color: #0c1814;
    background: var(--accent); border: none; border-radius: 999px;
    padding: 14px 22px; font-size: 15px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
  }
  #touch .small {
    background: var(--panel); color: var(--text); border: 1px solid var(--edge);
    padding: 12px 14px; font-size: 13px; font-weight: 600;
  }

  #card {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(6, 14, 11, 0.55); backdrop-filter: blur(3px);
  }
  #card.show { display: flex; }
  #cardInner {
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 20px; padding: 26px 34px; text-align: center;
    max-width: 82vw;
  }
  #cardTitle { font-size: clamp(26px, 6vw, 42px); font-weight: 800; color: var(--accent); }
  #cardBody { margin-top: 10px; font-size: clamp(13px, 2.6vw, 17px); line-height: 1.6; }
  .soft { color: var(--muted); }

  @media (max-width: 560px) {
    #meterWrap { height: 150px; bottom: 120px; }
    #touch button { padding: 12px 18px; }
  }
</style>
</head>
<body>

<div id="stage"></div>

<div id="hud">
  <div id="left">
    <div class="panel">
      <div class="label">To the pin</div>
      <div class="big" id="dist">—</div>
      <div class="mid" id="lie">—</div>
    </div>
    <div class="panel">
      <div class="label">Wind</div>
      <div class="mid" id="wind">—</div>
    </div>
  </div>
  <div id="right">
    <div class="panel" style="text-align:right">
      <div class="label">Club</div>
      <div class="big" id="club">—</div>
      <div class="mid" id="shots">—</div>
    </div>
    <div class="tools">
      <button id="fullBtn" type="button" hidden>Full screen</button>
      <button id="resetBtn" type="button">New hole</button>
    </div>
  </div>
</div>

<div id="meterWrap"><div id="meterFill"></div></div>
<div id="msg"></div>
<div id="prompt"></div>

<div id="touch">
  <button class="small" id="clubDownBtn" type="button">&lt;</button>
  <button class="small" id="clubUpBtn" type="button">&gt;</button>
  <button class="small" id="cancelBtn" type="button">Back</button>
  <button id="hitBtn" type="button">Swing</button>
</div>

<div id="card"><div id="cardInner">
  <div id="cardTitle"></div>
  <div id="cardBody"></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ====================== FAIRWAY ONE CORE START ====================== */
/* One hole of golf: the ground, the ball and the rules. Nothing in here
   knows about three.js or the DOM, so it can be run and checked headlessly -
   which matters, because a golf ball's flight is the whole game and it is
   very easy to make one that looks plausible and carries 600 metres. */

/* ------------------------------------------------------------- the course */

/* Everything solid on this course is a box. Flat tops to run along, vertical
   faces to bounce off, tilted ones for ramps, and one that turns. That is the
   whole reason it is boxes and not a height field: a height field cannot have
   a wall in it, because a vertical face is an infinitely steep slope and a
   ball meeting one either climbs it or falls through. Mini golf is mostly
   walls. Everything else is thin air - miss the course and you are off it. */

var BALL_RADIUS = 0.21;
var VOID_Y = -22;          /* below this you have left the course */
var MAX_STEP = 0.14;       /* how far the ball may move between collision
                              checks, so that a drive at sixty metres a second
                              cannot step straight through a rail */
var REST_SPEED = 1.15;     /* slower than this into a floor and it settles
                              instead of bouncing */

function rotY(p, a) {
  var c = Math.cos(a), s = Math.sin(a);
  return { x: p.x * c + p.z * s, y: p.y, z: -p.x * s + p.z * c };
}
function rotZ(p, a) {
  var c = Math.cos(a), s = Math.sin(a);
  return { x: p.x * c - p.y * s, y: p.x * s + p.y * c, z: p.z };
}

/* A box. yaw turns it about the upright, tilt leans it - in that order, so a
   ramp can be pointed any way and then pitched up. */
function slab(x, y, z, w, h, d, opts) {
  opts = opts || {};
  var sl = {
    pos: { x: x, y: y, z: z },
    half: { x: w / 2, y: h / 2, z: d / 2 },
    yaw: opts.yaw || 0,
    tilt: opts.tilt || 0,
    kind: opts.kind || 'fairway',
    spin: opts.spin || 0,        /* radians a second, for the windmill */
    phase: opts.phase || 0
  };
  sl.bound = slabBounds(sl);
  return sl;
}

/* How far a slab reaches along each world axis, once it has been leaned and
   turned. Six comparisons against this throw out almost every slab on almost
   every step, which is what makes it cheap enough to play the whole shot
   through this same physics on every frame to draw the aiming line. */
function slabBounds(sl) {
  var h = sl.half;
  var ct = Math.abs(Math.cos(sl.tilt)), st = Math.abs(Math.sin(sl.tilt));
  var ex = h.x * ct + h.y * st;
  var ey = h.x * st + h.y * ct;
  var ez = h.z;
  if (sl.spin) {
    /* it turns, so it could be pointing anywhere */
    var r = Math.sqrt(ex * ex + ez * ez);
    return { x: r, y: ey, z: r };
  }
  var cy = Math.abs(Math.cos(sl.yaw)), sy = Math.abs(Math.sin(sl.yaw));
  return { x: ex * cy + ez * sy, y: ey, z: ex * sy + ez * cy };
}

/* true when a ball of radius r could not possibly be touching this slab */
function slabFar(sl, p, r) {
  var b = sl.bound;
  return Math.abs(p.x - sl.pos.x) > b.x + r ||
         Math.abs(p.y - sl.pos.y) > b.y + r ||
         Math.abs(p.z - sl.pos.z) > b.z + r;
}

/* A platform described by the surface you land on rather than its middle,
   which is how one actually thinks about a course. */
function deck(x, top, z, w, d, kind, opts) {
  opts = opts || {};
  var thick = opts.thick === undefined ? 4 : opts.thick;
  return slab(x, top - thick / 2, z, w, thick, d,
    { kind: kind || 'fairway', yaw: opts.yaw });
}

/* A ramp whose top face runs exactly from (x0,y0) to (x1,y1). Getting this
   wrong leaves a lip where the ramp meets the deck, and a lip stops a ball
   dead - which is the single most annoying thing a golf course can do. */
function ramp(x0, y0, x1, y1, z, d, kind, thick) {
  var t = thick === undefined ? 2.4 : thick;
  var dx = x1 - x0, dy = y1 - y0;
  var len = Math.sqrt(dx * dx + dy * dy);
  var tilt = Math.atan2(dy, dx);
  var st = Math.sin(tilt), ct = Math.cos(tilt);
  /* the centre sits half a thickness straight down the box's own upright */
  var mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  return slab(mx + (t / 2) * st, my - (t / 2) * ct, z, len, t, d,
    { tilt: tilt, kind: kind });
}

var TEE = { x: 0, y: 12, z: 0 };
var PIN = { x: 300, y: -4, z: 46 };
var PAR = 4;
var CUP_RADIUS = 0.5;
var GREEN_RADIUS = 17;     /* half the width of the green, which is square */

/* The hole: a high tee, a railed fairway shelf with two pillars and a sand
   trap cut into it, a ramp bridge down to a wide lower shelf, a turning
   windmill arm across the approach, and the green sunk flush into the shelf
   so a putt runs on to it rather than over a lip. */
function buildCourse() {
  var c = [];

  /* the tee, up on its own block */
  c.push(deck(2, 12, 0, 32, 28, 'tee'));
  /* a chute down to the fairway, so a topped shot still gets somewhere */
  c.push(ramp(18, 12, 44, 4, 0, 24, 'fairway'));

  /* the fairway shelf, in pieces so the sand trap can be a real hollow in it
     rather than a patch of differently coloured fairway */
  c.push(deck(90, 4, 0, 92, 60, 'fairway'));        /* x  44..136 */
  c.push(deck(167, 4, 0, 18, 60, 'fairway'));       /* x 158..176 */
  c.push(deck(147, 4, 16, 22, 28, 'fairway'));      /* z   2.. 30 */
  c.push(deck(147, 4, -25, 22, 10, 'fairway'));     /* z -30..-20 */
  c.push(deck(147, 3.1, -9, 22, 22, 'sand', { thick: 3.1 }));

  /* railed down both sides, so a ball that stays down can't fall off */
  c.push(slab(110, 5.6, -31, 132, 3.2, 2, { kind: 'rail' }));
  c.push(slab(110, 5.6, 31, 132, 3.2, 2, { kind: 'rail' }));
  /* two pillars to thread, or bounce off */
  c.push(slab(100, 7, -13, 5, 6, 5, { kind: 'stone' }));
  c.push(slab(100, 7, 13, 5, 6, 5, { kind: 'stone' }));

  /* the hill down, railed like the rest, and the only way across on the
     ground - everything either side of it is thin air */
  c.push(ramp(176, 4, 206, -4, 0, 60, 'fairway'));
  c.push(slab(191, 1.6, -31, 31.2, 3.2, 2, { kind: 'rail', tilt: -0.26062 }));
  c.push(slab(191, 1.6, 31, 31.2, 3.2, 2, { kind: 'rail', tilt: -0.26062 }));

  /* the lower shelf, cut around the green */
  c.push(deck(244.5, -4, 28, 77, 116, 'fairway'));  /* x 206..283 */
  c.push(deck(327.5, -4, 28, 21, 116, 'fairway'));  /* x 317..338 */
  c.push(deck(300, -4, -0.5, 34, 59, 'fairway'));   /* z -30.. 29 */
  c.push(deck(300, -4, 74.5, 34, 23, 'fairway'));   /* z  63.. 86 */
  c.push(deck(PIN.x, PIN.y, PIN.z, 34, 34, 'green'));

  c.push(slab(272, -2.4, -31, 132, 3.2, 2, { kind: 'rail' }));
  c.push(slab(272, -2.4, 87, 132, 3.2, 2, { kind: 'rail' }));
  c.push(slab(339, -2.4, 28, 2, 3.2, 116, { kind: 'rail' }));

  /* the windmill, turning straight across the run up to the green. Its arm
     clears the deck by a tenth of a metre, so a running ball is stopped and a
     pitched one sails over. */
  c.push(slab(272, -1, 36, 3.2, 6, 3.2, { kind: 'stone' }));
  c.push(slab(272, -2.7, 36, 20, 2.4, 2.4, { kind: 'wood', spin: 0.85 }));

  return c;
}

var COURSE = buildCourse();

/* how fast the grass is, how much it gives, how much it grabs at a ball
   skidding along it, and how much of your swing gets to the ball from it */
var SURFACES = {
  tee:     { name: 'Tee',      roll: 0.10, bounce: 0.32, skid: 0.35, grab: 1.00 },
  fairway: { name: 'Fairway',  roll: 0.09, bounce: 0.32, skid: 0.35, grab: 1.00 },
  green:   { name: 'Green',    roll: 0.05, bounce: 0.26, skid: 0.34, grab: 1.00 },
  sand:    { name: 'Bunker',   roll: 1.80, bounce: 0.04, skid: 0.05, grab: 0.42 },
  stone:   { name: 'Stone',    roll: 0.06, bounce: 0.45, skid: 0.80, grab: 0.70 },
  wood:    { name: 'Windmill', roll: 0.08, bounce: 0.50, skid: 0.85, grab: 0.70 },
  rail:    { name: 'Rail',     roll: 0.08, bounce: 0.55, skid: 0.86, grab: 0.70 },
  'void':  { name: 'Off the course', roll: 0.09, bounce: 0, skid: 0, grab: 1.00 }
};

/* --------------------------------------------------------- what is solid */

/* Where a world point sits in one slab's own frame, and back again. */
function slabYaw(sl, time) {
  return sl.yaw + (sl.spin ? sl.spin * (time || 0) + sl.phase : 0);
}
function toLocal(sl, p, time) {
  var d = { x: p.x - sl.pos.x, y: p.y - sl.pos.y, z: p.z - sl.pos.z };
  return rotZ(rotY(d, -slabYaw(sl, time)), -sl.tilt);
}
function toWorldDir(sl, n, time) {
  return rotY(rotZ(n, sl.tilt), slabYaw(sl, time));
}
function toWorld(sl, l, time) {
  var d = toWorldDir(sl, l, time);
  return { x: sl.pos.x + d.x, y: sl.pos.y + d.y, z: sl.pos.z + d.z };
}

/* The closest point on a slab to a ball, and how deep it is in. Null when
   they are not touching. The normal points out of the slab at the ball. */
function slabContact(sl, p, r, time) {
  if (slabFar(sl, p, r)) return null;
  var l = toLocal(sl, p, time);
  var h = sl.half;
  var cx = Math.max(-h.x, Math.min(h.x, l.x));
  var cy = Math.max(-h.y, Math.min(h.y, l.y));
  var cz = Math.max(-h.z, Math.min(h.z, l.z));
  var dx = l.x - cx, dy = l.y - cy, dz = l.z - cz;
  var d2 = dx * dx + dy * dy + dz * dz;
  if (d2 > r * r) return null;
  var n, depth;
  if (d2 > 1e-10) {
    var d = Math.sqrt(d2);
    n = { x: dx / d, y: dy / d, z: dz / d };
    depth = r - d;
  } else {
    /* the middle of the ball is inside it: push out through the nearest face */
    var ox = h.x - Math.abs(l.x), oy = h.y - Math.abs(l.y), oz = h.z - Math.abs(l.z);
    var sgn = function (v) { return v < 0 ? -1 : 1; };
    if (ox <= oy && ox <= oz) { n = { x: sgn(l.x), y: 0, z: 0 }; depth = r + ox; }
    else if (oy <= oz) { n = { x: 0, y: sgn(l.y), z: 0 }; depth = r + oy; }
    else { n = { x: 0, y: 0, z: sgn(l.z) }; depth = r + oz; }
  }
  return { n: toWorldDir(sl, n, time), depth: depth, slab: sl, local: l };
}

/* How fast the surface of a slab is moving at a point on it. Worked out by
   asking where that bit of the slab will be a moment later, rather than by
   hand, because getting a sign wrong here would fling the ball backwards. */
function surfaceVelocity(sl, p, time) {
  if (!sl.spin) return { x: 0, y: 0, z: 0 };
  var e = 0.001;
  var l = toLocal(sl, p, time);
  var later = toWorld(sl, l, (time || 0) + e);
  return { x: (later.x - p.x) / e, y: (later.y - p.y) / e, z: (later.z - p.z) / e };
}

/* Where the top face of one slab sits above or below a column, if the column
   passes through the slab at all. Solved directly, because for a tilted box
   the height of the top face is linear in the local across-slab distance. */
function slabTopAt(sl, x, z, time) {
  if (Math.abs(x - sl.pos.x) > sl.bound.x || Math.abs(z - sl.pos.z) > sl.bound.z) return null;
  var h = sl.half;
  var f = rotY({ x: x - sl.pos.x, y: 0, z: z - sl.pos.z }, -slabYaw(sl, time));
  var ct = Math.cos(sl.tilt), st = Math.sin(sl.tilt);
  /* local y is h.y on the top face, so the world height follows at once */
  var y = sl.pos.y + (h.y + f.x * st) / ct;
  var lx = f.x / ct + h.y * st / ct;
  if (Math.abs(lx) > h.x || Math.abs(f.z) > h.z) return null;
  return { y: y, kind: sl.kind, slab: sl,
           normal: toWorldDir(sl, { x: 0, y: 1, z: 0 }, time) };
}

/* The top of whatever you would be standing on at a spot, and what it is made
   of. Used for standing the golfer up, for the camera, and for telling you
   your lie. Rails and the windmill arm are not floors. Null over the void. */
function groundUnder(x, z, time) {
  var best = null;
  for (var i = 0; i < COURSE.length; i++) {
    var sl = COURSE[i];
    if (sl.kind === 'rail' || sl.kind === 'wood') continue;
    var top = slabTopAt(sl, x, z, time);
    if (top === null) continue;
    if (!best || top.y > best.y) best = top;
  }
  return best;
}

function surfaceAt(x, z, time) {
  var g = groundUnder(x, z, time);
  return g ? g.kind : 'void';
}
function heightAt(x, z, time) {
  var g = groundUnder(x, z, time);
  return g ? g.y : VOID_Y;
}
function normalAt(x, z, time) {
  var g = groundUnder(x, z, time);
  return g ? g.normal : { x: 0, y: 1, z: 0 };
}
/* where the middle of a ball sits when it is lying on the ground there */
function restHeight(x, z, time) { return heightAt(x, z, time) + BALL_RADIUS; }
/* Inside the circle the windmill arm sweeps. A ball is not allowed to settle
   in here: it waits, still, until the arm comes round and knocks it out,
   which is what you would see happen and so what has to happen. */
function inSweep(x, z) {
  for (var i = 0; i < COURSE.length; i++) {
    var sl = COURSE[i];
    if (!sl.spin) continue;
    var dx = x - sl.pos.x, dz = z - sl.pos.z;
    var reach = sl.half.x + BALL_RADIUS;
    if (dx * dx + dz * dz < reach * reach) return true;
  }
  return false;
}
function onCourse(x, z, time) { return groundUnder(x, z, time) !== null; }

/* ---------------------------------------------------------------- clubs */

/* Launch speed in metres per second and loft in degrees. The carries these
   give are checked in the tests, because a club table is the easiest thing in
   a golf game to get quietly and badly wrong. */
var CLUBS = [
  { id: 'driver', name: 'Driver',  speed: 56, loft: 11, curve: 1.00, spin: 1.00 },
  { id: 'wood',   name: '3 Wood',  speed: 49.3, loft: 14, curve: 0.85, spin: 1.15 },
  { id: 'iron5',  name: '5 Iron',  speed: 40.5, loft: 21, curve: 0.70, spin: 1.45 },
  { id: 'iron8',  name: '8 Iron',  speed: 34, loft: 30, curve: 0.55, spin: 1.80 },
  { id: 'wedge',  name: 'Wedge',   speed: 29.4, loft: 46, curve: 0.40, spin: 2.30 },
  { id: 'putter', name: 'Putter',  speed: 4.6, loft: 0, curve: 0.10, spin: 0 }
];
function clubById(id) {
  for (var i = 0; i < CLUBS.length; i++) if (CLUBS[i].id === id) return CLUBS[i];
  return CLUBS[0];
}

/* what a sensible player would reach for, given the distance left and the lie */
function suggestClub(distance, surface) {
  if (surface === 'green' && distance < GREEN_RADIUS) return 'putter';
  if (surface === 'sand') return distance > 90 ? 'iron8' : 'wedge';
  var reach = [
    ['wedge', 82], ['iron8', 128], ['iron5', 160], ['wood', 198], ['driver', 1e9]
  ];
  for (var i = 0; i < reach.length; i++) if (distance <= reach[i][1]) return reach[i][0];
  return 'driver';
}

/* ------------------------------------------------------------- the flight */

var GRAVITY = 9.81;
/* Quadratic drag, and a lift term standing in for backspin. The lift is what
   makes a golf ball a golf ball: without it a struck drive falls out of the
   sky at about 150 metres, and every club carries roughly the same distance
   because loft stops buying you anything. It has to act ACROSS the line of
   flight rather than straight up, or it is simply free energy and a 3 wood
   ends up out-driving the driver, which is what the first version did. */
var DRAG = 0.0026;
var LIFT = 0.0042;
var SPIN_DECAY = 0.11;     /* backspin bleeds off through the flight */
var BALL_STOP = 0.30;      /* below this it has stopped, in m/s */
var HOLE_SPEED = 1.9;      /* faster than this over the cup and it lips out */
var ROLL_SLOPE = 5 / 7;    /* a rolling sphere only gets this much of gravity */
var ROLL_DRAG = 0.010;     /* air, felt on the ground as well as in it */
/* One fixed step for everything. The aiming line is the shot played ahead
   of time, so it is only honest if it is played at exactly the same step as
   the real one - a ball rattling between two boxes will not land in the same
   place at 90 a second as it does at 240. */
var SIM_DT = 1 / 120;

/* What leaves the club face: how hard, how high, and how far off line. */
function launchVelocity(club, power, aimYaw, face) {
  var c = typeof club === 'string' ? clubById(club) : club;
  var speed = c.speed * power;
  var loft = c.loft * Math.PI / 180;
  /* a mishit starts the ball offline as well as bending it in the air */
  var yaw = aimYaw + face * 0.07 * c.curve;
  var flat = speed * Math.cos(loft);
  return {
    x: flat * Math.cos(yaw),
    y: speed * Math.sin(loft),
    z: flat * Math.sin(yaw)
  };
}

function Ball() {
  this.pos = { x: TEE.x, y: restHeight(TEE.x, TEE.z), z: TEE.z };
  this.vel = { x: 0, y: 0, z: 0 };
  this.bend = 0;          /* sideways bend left in the shot */
  this.backspin = 0;
  this.wind = { x: 0, z: 0 };
  this.grounded = false;
  this.gn = { x: 0, y: 1, z: 0 };
  this.gkind = 'tee';
  this.moving = false;
  this.holed = false;
  this.lost = false;      /* fell off the course */
  this.peak = 0;
  this.carry = 0;
  this.launchedFrom = { x: TEE.x, z: TEE.z };
}

Ball.prototype.strike = function (club, power, aimYaw, face, windX, windZ) {
  var c = typeof club === 'string' ? clubById(club) : club;
  this.vel = launchVelocity(c, power, aimYaw, face);
  this.bend = face * c.curve;
  this.backspin = c.spin;
  this.moving = true;
  this.holed = false;
  this.lost = false;
  this.peak = this.pos.y;
  this.carry = 0;
  this.launchedFrom = { x: this.pos.x, z: this.pos.z };
  this.wind = { x: windX || 0, z: windZ || 0 };
  this.grounded = c.loft === 0;
  this.pos.y = restHeight(this.pos.x, this.pos.z) + 0.005;
  return this;
};

/* Through the air: drag against the wind, lift across the line of flight,
   gravity, and whatever bend was put on it at impact. */
Ball.prototype.fly = function (dt) {
  var v = this.vel;
  var rx = v.x - this.wind.x, ry = v.y, rz = v.z - this.wind.z;
  var rel = Math.sqrt(rx * rx + ry * ry + rz * rz) || 1e-6;
  v.x -= DRAG * rel * rx * dt;
  v.y -= DRAG * rel * ry * dt;
  v.z -= DRAG * rel * rz * dt;

  /* Lift is perpendicular to the way the ball is actually travelling, in the
     vertical plane, which is what makes it hold its line on the way up and
     drop steeply on the way down instead of skating on forever. */
  var sp = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z) || 1e-6;
  var flat = Math.sqrt(v.x * v.x + v.z * v.z) || 1e-6;
  var mag = LIFT * this.backspin * sp * sp;
  v.x += mag * (-v.y * v.x / flat) / sp * dt;
  v.y += mag * (flat) / sp * dt;
  v.z += mag * (-v.y * v.z / flat) / sp * dt;
  this.backspin *= Math.exp(-SPIN_DECAY * dt);

  v.y -= GRAVITY * dt;

  /* and the shot bends the way it was struck, sideways across the flight */
  var bend = this.bend * 0.30 * dt;
  var nx = -v.z / flat, nz = v.x / flat;
  v.x += nx * bend * flat * 0.06;
  v.z += nz * bend * flat * 0.06;
};

/* On the ground: gravity split about whatever it is resting on, with only
   five sevenths of the slope reaching it because the rest goes into spinning
   it up, and then the surface dragging at it. */
Ball.prototype.rollForces = function (dt) {
  var v = this.vel, n = this.gn;
  var sfc = SURFACES[this.gkind] || SURFACES.fairway;
  var gn = -GRAVITY * n.y;                       /* gravity along the normal */
  var gtx = -gn * n.x, gty = -GRAVITY - gn * n.y, gtz = -gn * n.z;
  v.x += (gn * n.x + gtx * ROLL_SLOPE) * dt;
  v.y += (gn * n.y + gty * ROLL_SLOPE) * dt;
  v.z += (gn * n.z + gtz * ROLL_SLOPE) * dt;

  var vn = v.x * n.x + v.y * n.y + v.z * n.z;
  var tx = v.x - vn * n.x, ty = v.y - vn * n.y, tz = v.z - vn * n.z;
  var tsp = Math.sqrt(tx * tx + ty * ty + tz * tz);
  /* the grass, plus the air - a ball running along the ground at twenty
     metres a second is still pushing through air, and without that term a
     ball fired off a rail rolls the length of the hole and back */
  var drop = (sfc.roll * GRAVITY + ROLL_DRAG * tsp * tsp) * dt;
  var k = tsp <= drop ? 0 : (tsp - drop) / tsp;
  v.x = vn * n.x + tx * k;
  v.y = vn * n.y + ty * k;
  v.z = vn * n.z + tz * k;

  this.backspin *= Math.exp(-3 * dt);
  this.bend *= Math.exp(-6 * dt);
};

/* One contact: push the ball out, then decide whether it bounced or settled. */
Ball.prototype.respond = function (ct, time) {
  var p = this.pos, v = this.vel, n = ct.n;
  var sl = ct.slab;
  p.x += n.x * ct.depth;
  p.y += n.y * ct.depth;
  p.z += n.z * ct.depth;

  var sv = surfaceVelocity(sl, p, time);
  var rx = v.x - sv.x, ry = v.y - sv.y, rz = v.z - sv.z;
  var into = rx * n.x + ry * n.y + rz * n.z;
  if (into >= 0) return;

  if (!this.carry && n.y > 0.5) {
    this.carry = Math.sqrt(
      (p.x - this.launchedFrom.x) * (p.x - this.launchedFrom.x) +
      (p.z - this.launchedFrom.z) * (p.z - this.launchedFrom.z));
  }

  var sfc = SURFACES[sl.kind] || SURFACES.fairway;
  var settling = n.y > 0.55 && -into < REST_SPEED;
  var e = settling ? 0 : sfc.bounce;
  rx -= (1 + e) * into * n.x;
  ry -= (1 + e) * into * n.y;
  rz -= (1 + e) * into * n.z;

  if (!settling) {
    /* the turf grabs at whatever is skidding along it, and heavy backspin
       checks the ball up rather than letting it release */
    var vn = rx * n.x + ry * n.y + rz * n.z;
    var tx = rx - vn * n.x, ty = ry - vn * n.y, tz = rz - vn * n.z;
    var k = sfc.skid * (1 - Math.min(0.5, this.backspin * 0.12));
    rx = vn * n.x + tx * k;
    ry = vn * n.y + ty * k;
    rz = vn * n.z + tz * k;
    this.bend *= 0.35;
    this.backspin *= 0.4;
  }

  v.x = rx + sv.x; v.y = ry + sv.y; v.z = rz + sv.z;
};

/* Every slab the ball is in, dealt with. One slab needs one go; two or more
   are a corner, and those have to be worked over a few times or the ball
   rattles between them instead of settling into the join. */
Ball.prototype.resolve = function (time) {
  for (var pass = 0; pass < 3; pass++) {
    var hits = 0;
    for (var i = 0; i < COURSE.length; i++) {
      var ct = slabContact(COURSE[i], this.pos, BALL_RADIUS, time);
      if (!ct) continue;
      hits++;
      this.respond(ct, time);
    }
    if (hits < 2) return;
  }
};

/* A lower bound on how far the ball is from anything solid. If a slab is
   clear of the ball along any one axis then it is at least that far away, so
   the largest of the three gaps is a distance it cannot be nearer than. Used
   to skip the collision work altogether while the ball is up in the air,
   which is most of a drive. */
Ball.prototype.clearance = function () {
  var best = 1e9, p = this.pos;
  for (var i = 0; i < COURSE.length; i++) {
    var sl = COURSE[i], b = sl.bound;
    var d = Math.abs(p.x - sl.pos.x) - b.x;
    var dy = Math.abs(p.y - sl.pos.y) - b.y;
    if (dy > d) d = dy;
    var dz = Math.abs(p.z - sl.pos.z) - b.z;
    if (dz > d) d = dz;
    if (d < best) best = d;
  }
  return best;
};

/* Is it lying on something? Asked with a slightly fat ball, because a ball
   resting exactly on a floor is touching it by nothing at all, and a ball
   that keeps forgetting it is on the ground gets no rolling friction. */
Ball.prototype.probeGround = function (time) {
  this.grounded = false;
  var bestY = 0.55;
  for (var i = 0; i < COURSE.length; i++) {
    var ct = slabContact(COURSE[i], this.pos, BALL_RADIUS + 0.04, time);
    if (!ct || ct.n.y <= bestY) continue;
    bestY = ct.n.y;
    this.gn = ct.n;
    this.gkind = ct.slab.kind;
    this.grounded = true;
  }
};

Ball.prototype.step = function (dt, time) {
  if (!this.moving || this.holed) return this;
  var t = time === undefined ? 0 : time;
  var p = this.pos, v = this.vel;

  if (this.grounded) this.rollForces(dt);
  else this.fly(dt);

  var travel = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z) * dt;

  /* well clear of everything: one step, and nothing to collide with */
  if (this.clearance() - BALL_RADIUS > travel + 0.05) {
    p.x += v.x * dt; p.y += v.y * dt; p.z += v.z * dt;
    if (p.y > this.peak) this.peak = p.y;
    this.grounded = false;
    if (p.y < VOID_Y) {
      this.lost = true; this.moving = false;
      if (!this.carry) this.carry = Math.sqrt(
        (p.x - this.launchedFrom.x) * (p.x - this.launchedFrom.x) +
        (p.z - this.launchedFrom.z) * (p.z - this.launchedFrom.z));
    }
    return this;
  }

  var n = Math.max(1, Math.min(48, Math.ceil(travel / MAX_STEP)));
  var h = dt / n;
  for (var i = 0; i < n; i++) {
    p.x += v.x * h; p.y += v.y * h; p.z += v.z * h;
    if (p.y > this.peak) this.peak = p.y;
    this.resolve(t + h * (i + 1));
    if (this.cup(t)) return this;
    if (p.y < VOID_Y) {
      this.lost = true; this.moving = false;
      if (!this.carry) this.carry = Math.sqrt(
        (p.x - this.launchedFrom.x) * (p.x - this.launchedFrom.x) +
        (p.z - this.launchedFrom.z) * (p.z - this.launchedFrom.z));
      return this;
    }
  }
  this.probeGround(t + dt);

  if (this.grounded) {
    var sfc = SURFACES[this.gkind] || SURFACES.fairway;
    var slope = Math.sqrt(Math.max(0, 1 - this.gn.y * this.gn.y));
    var held = GRAVITY * slope * ROLL_SLOPE <= sfc.roll * GRAVITY;
    var sp = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
    if (held && sp < BALL_STOP && !inSweep(p.x, p.z)) {
      this.moving = false;
      v.x = 0; v.y = 0; v.z = 0;
      if (!this.carry) this.carry = Math.sqrt(
        (p.x - this.launchedFrom.x) * (p.x - this.launchedFrom.x) +
        (p.z - this.launchedFrom.z) * (p.z - this.launchedFrom.z));
    }
  }
  return this;
};

/* The cup. Too quick over it and it horseshoes out, which is golf. */
Ball.prototype.cup = function (time) {
  var p = this.pos, v = this.vel;
  if (!this.grounded && p.y > restHeight(PIN.x, PIN.z, time) + 0.5) return false;
  var dx = p.x - PIN.x, dz = p.z - PIN.z;
  var cd = Math.sqrt(dx * dx + dz * dz);
  if (cd >= CUP_RADIUS) return false;
  var sp = Math.sqrt(v.x * v.x + v.z * v.z);
  if (sp < HOLE_SPEED) {
    this.holed = true;
    this.moving = false;
    p.x = PIN.x; p.z = PIN.z;
    p.y = heightAt(PIN.x, PIN.z, time) - 0.12;
    v.x = 0; v.y = 0; v.z = 0;
    if (!this.carry) this.carry = Math.sqrt(
      (p.x - this.launchedFrom.x) * (p.x - this.launchedFrom.x) +
      (p.z - this.launchedFrom.z) * (p.z - this.launchedFrom.z));
    return true;
  }
  var away = Math.atan2(dz || 1e-6, dx || 1e-6);
  v.x = Math.cos(away) * sp * 0.5;
  v.z = Math.sin(away) * sp * 0.5;
  return false;
};

/* Where a shot would actually finish, run through the same physics that will
   run it for real. The aiming line is not a guess or a parabola drawn to look
   about right - it is the shot, played ahead of time. */
function predictShot(fromX, fromZ, clubId, power, aimYaw, face, wind, grab, time) {
  var ghost = new Ball();
  ghost.pos = { x: fromX, y: restHeight(fromX, fromZ), z: fromZ };
  ghost.strike(clubId, Math.max(0.05, power) * (grab === undefined ? 1 : grab),
    aimYaw, face, wind ? wind.x : 0, wind ? wind.z : 0);
  var path = [{ x: ghost.pos.x, y: ghost.pos.y, z: ghost.pos.z }];
  var dt = SIM_DT, t = time || 0, end = t + 40, land = null;
  while (ghost.moving && t < end) {
    ghost.step(dt, t); t += dt;
    if (!land && ghost.carry) land = { x: ghost.pos.x, y: ghost.pos.y, z: ghost.pos.z };
    if (path.length < 400) path.push({ x: ghost.pos.x, y: ghost.pos.y, z: ghost.pos.z });
  }
  return {
    path: path,
    land: land || { x: ghost.pos.x, y: ghost.pos.y, z: ghost.pos.z },
    rest: { x: ghost.pos.x, y: ghost.pos.y, z: ghost.pos.z },
    carry: ghost.carry,
    holed: ghost.holed,
    lost: ghost.lost,
    lie: ghost.lost ? 'void' : surfaceAt(ghost.pos.x, ghost.pos.z)
  };
}

/* --------------------------------------------------------------- the round */

function Hole(seed) {
  this.ball = new Ball();
  this.strokes = 0;
  this.penalties = 0;
  this.done = false;
  this.time = 0;
  this.history = [];
  var r = ((seed === undefined ? 7 : seed) * 9301 + 49297) % 233280 / 233280;
  var dir = r * Math.PI * 2;
  var strength = 1.5 + r * 4.5;
  this.wind = { x: Math.cos(dir) * strength, z: Math.sin(dir) * strength };
}

Hole.prototype.lie = function () {
  if (this.ball.lost) return 'void';
  return surfaceAt(this.ball.pos.x, this.ball.pos.z, this.time);
};

Hole.prototype.toPin = function () {
  var dx = this.ball.pos.x - PIN.x, dz = this.ball.pos.z - PIN.z;
  return Math.sqrt(dx * dx + dz * dz);
};

/* How much of the swing actually gets to the ball from where it is lying. */
Hole.prototype.grab = function () {
  var s = SURFACES[this.lie()];
  return s ? s.grab : 1;
};

Hole.prototype.swing = function (clubId, power, aimYaw, face) {
  if (this.done) return null;
  this.strokes++;
  var eff = Math.max(0.05, power) * this.grab();
  this.history.push({
    from: { x: this.ball.pos.x, z: this.ball.pos.z },
    club: clubId, power: power, lie: this.lie()
  });
  this.ball.strike(clubId, eff, aimYaw, face, this.wind.x, this.wind.z);
  return this.ball;
};

/* Run the ball until it comes to rest, and deal with what happened to it.
   Returns how long it took, so nothing can loop forever if a ball finds a
   corner of the course that never settles. */
Hole.prototype.settle = function (dt, maxSeconds) {
  var t = 0;
  var h = dt || SIM_DT;
  var limit = maxSeconds || 45;
  while (this.ball.moving && t < limit) {
    this.ball.step(h, this.time);
    this.time += h; t += h;
  }
  this.finishShot();
  return t;
};

Hole.prototype.finishShot = function () {
  var b = this.ball;
  b.moving = false;
  if (b.holed) { this.done = true; return 'holed'; }
  if (b.lost) {
    /* a stroke back, and dropped where it last had ground under it on the
       line it went out on - the same rule a real course plays */
    this.penalties++;
    var drop = this.dropPoint(b.launchedFrom, b.pos);
    b.pos.x = drop.x; b.pos.z = drop.z;
    b.pos.y = restHeight(drop.x, drop.z, this.time);
    b.vel = { x: 0, y: 0, z: 0 };
    b.lost = false;
    b.grounded = true;
    return 'lost';
  }
  b.pos.y = restHeight(b.pos.x, b.pos.z, this.time);
  return 'rest';
};

/* Walk out along the line the ball went out on until the ground runs out, and
   drop a couple of metres back from the edge. */
Hole.prototype.dropPoint = function (from, out) {
  var startsOn = onCourse(from.x, from.z, this.time);
  if (!startsOn) return { x: TEE.x, z: TEE.z };
  var steps = 400;
  var last = { x: from.x, z: from.z };
  for (var i = 1; i <= steps; i++) {
    var t = i / steps;
    var x = from.x + (out.x - from.x) * t;
    var z = from.z + (out.z - from.z) * t;
    if (!onCourse(x, z, this.time)) break;
    last = { x: x, z: z };
  }
  /* back off the lip so the drop is not balanced on the edge */
  var dx = last.x - from.x, dz = last.z - from.z;
  var len = Math.sqrt(dx * dx + dz * dz);
  if (len > 3) {
    last.x -= dx / len * 2.2;
    last.z -= dz / len * 2.2;
  }
  if (!onCourse(last.x, last.z, this.time)) return { x: from.x, z: from.z };
  return last;
};

Hole.prototype.score = function () {
  var total = this.strokes + this.penalties;
  var names = { '-3': 'Albatross', '-2': 'Eagle', '-1': 'Birdie', '0': 'Par',
                '1': 'Bogey', '2': 'Double bogey', '3': 'Triple bogey' };
  var rel = total - PAR;
  return {
    strokes: this.strokes, penalties: this.penalties, total: total,
    par: PAR, relative: rel,
    name: names[String(rel)] || (rel > 0 ? '+' + rel : String(rel))
  };
};

/* ---------------------------------------------------------- the swing meter */

/* The swing is one number for how hard and one for how square the face was,
   whichever way you happen to be playing it. The stick reads them straight
   off how far back you pulled and how far off line you were coming through;
   the keyboard runs the old three-press meter. Both land here. */
function SwingMeter() {
  this.reset();
}
SwingMeter.prototype.reset = function () {
  this.phase = 'ready';    /* ready -> backswing -> downswing -> struck */
  this.value = 0;
  this.dir = 1;
  this.power = 0;
  this.face = 0;
};
SwingMeter.prototype.tap = function () {
  if (this.phase === 'ready') { this.phase = 'backswing'; this.value = 0; this.dir = 1; }
  else if (this.phase === 'backswing') { this.power = this.value; this.phase = 'downswing'; this.dir = -1; }
  else if (this.phase === 'downswing') {
    /* struck at the bottom of the swing: how far past the mark you were is
       how open or shut the face was */
    this.face = Math.max(-1, Math.min(1, this.value * 2));
    this.phase = 'struck';
  }
  return this.phase;
};
SwingMeter.prototype.step = function (dt, rate) {
  var r = rate || 1.35;
  if (this.phase === 'backswing') {
    this.value += this.dir * r * dt;
    if (this.value >= 1) { this.value = 1; this.dir = -1; }
    else if (this.value <= 0 && this.dir < 0) { this.value = 0; this.dir = 1; }
  } else if (this.phase === 'downswing') {
    this.value -= r * dt;
    /* let it run past the bottom so a late press is a real miss */
    if (this.value < -0.5) { this.face = -1; this.phase = 'struck'; }
  }
  return this.phase;
};

/* The stick swing: pull back to load, push through to hit. Returns a struck
   swing when the stick crosses back through the middle, and nothing until
   then. */
var STICK_RATE = 1.35;     /* how fast the backswing winds up, per second -
                              the same rate the keyboard meter climbs at */
function StickSwing() {
  this.loaded = 0;
  this.armed = false;
  this.offset = 0;
}
StickSwing.prototype.reset = function () { this.loaded = 0; this.armed = false; this.offset = 0; };
StickSwing.prototype.update = function (sx, sy, dt) {
  /* sy is positive when the stick is pulled back toward the player. How far
     back the stick is only says how far back the swing is ALLOWED to be:
     it still has to wind up at its own pace, or flicking the stick down for
     a tenth of a second is a full swing, which is no swing at all. */
  var h = dt === undefined ? 1 : dt;
  if (sy > 0.25) {
    this.armed = true;
    var reach = Math.min(1, sy);
    var next = Math.min(reach, this.loaded + STICK_RATE * h);
    if (next > this.loaded) { this.loaded = next; this.offset = sx; }
    return null;
  }
  /* and it takes a real push forward to hit it, not the stick springing back
     through the middle on its own */
  if (this.armed && this.loaded > 0.2 && sy < -0.28) {
    var hit = {
      power: Math.min(1, this.loaded * 1.05),
      /* how far off line the stick was coming through, against how far back
         it went - a big backswing punishes a small wobble less */
      face: Math.max(-1, Math.min(1, (sx - this.offset) * 1.6))
    };
    this.reset();
    return hit;
  }
  return null;
};

  module.exports = {

    CUP_RADIUS: CUP_RADIUS, BALL_RADIUS: BALL_RADIUS, VOID_Y: VOID_Y,
    MAX_STEP: MAX_STEP, REST_SPEED: REST_SPEED,
    COURSE: COURSE, buildCourse: buildCourse, slab: slab, deck: deck, ramp: ramp,
    slabBounds: slabBounds, slabFar: slabFar,
    rotY: rotY, rotZ: rotZ, toLocal: toLocal, toWorld: toWorld,
    toWorldDir: toWorldDir, slabContact: slabContact, slabTopAt: slabTopAt,
    surfaceVelocity: surfaceVelocity, groundUnder: groundUnder,
    heightAt: heightAt, normalAt: normalAt, surfaceAt: surfaceAt,
    restHeight: restHeight, onCourse: onCourse, inSweep: inSweep,
    SURFACES: SURFACES, CLUBS: CLUBS, clubById: clubById, suggestClub: suggestClub,
    GRAVITY: GRAVITY, DRAG: DRAG, LIFT: LIFT, BALL_STOP: BALL_STOP,
    SPIN_DECAY: SPIN_DECAY, ROLL_SLOPE: ROLL_SLOPE, ROLL_DRAG: ROLL_DRAG,
    SIM_DT: SIM_DT,
    HOLE_SPEED: HOLE_SPEED, launchVelocity: launchVelocity, STICK_RATE: STICK_RATE,
    Ball: Ball, Hole: Hole, SwingMeter: SwingMeter, StickSwing: StickSwing,

}

</script>
<script>
/* The parts that need a screen: the course you can see, the golfer you walk
   about, the camera, and whatever you are holding to play it with. */

var scene, camera, renderer, sun;
var terrain, millGroup, flag, ballMesh, golfer, aimLine, landMark, treesGroup;
var hole, ui = {};
var phase = 'walk';        /* walk | aim | swing | flight | holed */
var clubIndex = 0;
var aimYaw = 0;
var camYaw = 0, camPitch = 0.22, camDist = 12;
var meter = null, stick = null;
var walkPhase = 0, swingAnim = 0, swingFace = 0;
var autoWalk = null, message = '', messageUntil = 0;
var lastTime = 0, predicted = null, predictDirty = true, simAccum = 0;
var padIndex = null, padWas = {};
var soundOn = true, audio = null;

var WALK_SPEED = 9;

/* The course floats, so half the places you might ask about have no ground at
   all. Everything that puts something on the ground goes through here and
   gets the last solid height it knew about instead of a plunge into the sky. */
function solidY(x, z, fallback) {
  var g = groundUnder(x, z, hole ? hole.time : 0);
  return g ? g.y : (fallback === undefined ? 0 : fallback);
}
function walkable(x, z) { return onCourse(x, z, hole ? hole.time : 0); }
var JOG_TIME = 2.2;        /* how long it takes to get to your ball, whatever the distance */

/* ------------------------------------------------------------- the ground */

/* The course is boxes, so it is drawn as boxes: one mesh per slab, grass on
   the top face and earth down the sides, flat shaded and hard edged. It is a
   floating island rather than a landscape, which is the point - you can see
   exactly where the ground stops, and everything past that is thin air. */
var SLAB_SKIN = {
  tee:     { top: 0x63b24a, side: 0x6d5236 },
  fairway: { top: 0x4f9c37, side: 0x6d5236 },
  green:   { top: 0x83d15c, side: 0x6d5236 },
  sand:    { top: 0xe3cf92, side: 0xc0a86c },
  stone:   { top: 0xa8a49a, side: 0x8f8b82 },
  wood:    { top: 0xb5793f, side: 0x8f5c2c },
  rail:    { top: 0xd8d2b6, side: 0xbdb694 }
};

var spinners = [];

function slabSkin(kind) {
  var c = SLAB_SKIN[kind] || SLAB_SKIN.fairway;
  var side = new THREE.MeshLambertMaterial({ color: c.side, flatShading: true });
  var top = new THREE.MeshLambertMaterial({ color: c.top, flatShading: true });
  /* box faces come in the order +x, -x, +y, -y, +z, -z */
  return [side, side, top, side, side, side];
}

/* The physics turns a slab about the upright and then leans it, in that
   order. Rather than trust a three-axis rotation to compose them the same way
   round, each slab gets a group that does the turning and a box inside it
   that does the leaning: nesting them can only compose one way. */
function buildCourseMeshes() {
  terrain = new THREE.Group();
  spinners = [];
  for (var i = 0; i < COURSE.length; i++) {
    var sl = COURSE[i];
    var pivot = new THREE.Group();
    pivot.position.set(sl.pos.x, sl.pos.y, sl.pos.z);
    pivot.rotation.y = sl.yaw;
    var m = new THREE.Mesh(
      new THREE.BoxGeometry(sl.half.x * 2, sl.half.y * 2, sl.half.z * 2),
      slabSkin(sl.kind));
    m.rotation.z = sl.tilt;
    m.receiveShadow = true;
    pivot.add(m);
    terrain.add(pivot);
    if (sl.spin) spinners.push({ pivot: pivot, mesh: m, slab: sl });
  }
  scene.add(terrain);
}

function spinCourse(time) {
  for (var i = 0; i < spinners.length; i++) {
    var s = spinners[i];
    s.pivot.rotation.y = s.slab.yaw + s.slab.spin * time + s.slab.phase;
  }
}

/* the mill the turning arm belongs to: a roof on the tower and a pair of
   sails above head height, so it reads as a windmill rather than a pole */
function buildMill() {
  var hub = null;
  for (var i = 0; i < COURSE.length; i++) if (COURSE[i].spin) hub = COURSE[i];
  if (!hub) return;
  var mill = new THREE.Group();
  var roof = new THREE.Mesh(
    new THREE.ConeGeometry(3.1, 2.4, 4),
    new THREE.MeshLambertMaterial({ color: 0xb03c33, flatShading: true }));
  roof.rotation.y = Math.PI / 4;
  roof.position.set(hub.pos.x, hub.pos.y + 3 + 1.2, hub.pos.z);
  mill.add(roof);
  var sails = new THREE.Group();
  for (var k = 0; k < 4; k++) {
    var blade = new THREE.Mesh(
      new THREE.BoxGeometry(0.3, 5.2, 1.1),
      new THREE.MeshLambertMaterial({ color: 0xf1e7cf, flatShading: true }));
    blade.position.set(0, 2.6, 0);
    var arm = new THREE.Group();
    arm.add(blade);
    arm.rotation.z = k * Math.PI / 2;
    sails.add(arm);
  }
  sails.position.set(hub.pos.x - 1.9, hub.pos.y + 2.2, hub.pos.z);
  mill.add(sails);
  mill.userData.sails = sails;
  mill.userData.hub = hub;
  scene.add(mill);
  millGroup = mill;
}

/* Chunks of the same world floating off in the distance, so the course does
   not sit alone in an empty sky. Decoration only - the ball never gets near
   them, and nothing in the physics knows they are there. */
function buildScenery() {
  treesGroup = new THREE.Group();
  var seed = 4;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  for (var i = 0; i < 34; i++) {
    var side = rnd() < 0.5 ? -1 : 1;
    var x = -120 + rnd() * 600;
    var z = side * (95 + rnd() * 240);
    var y = -30 - rnd() * 120;
    var w = 14 + rnd() * 46, d = 14 + rnd() * 46, h = 8 + rnd() * 30;
    var rock = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), slabSkin('fairway'));
    rock.position.set(x, y, z);
    rock.rotation.y = rnd() * 0.5 - 0.25;
    treesGroup.add(rock);
    if (rnd() < 0.5) {
      var tree = new THREE.Mesh(
        new THREE.ConeGeometry(3 + rnd() * 3, 10 + rnd() * 8, 5),
        new THREE.MeshLambertMaterial({ color: 0x2f6b32, flatShading: true }));
      tree.position.set(x + (rnd() - 0.5) * w * 0.5, y + h / 2 + 6,
        z + (rnd() - 0.5) * d * 0.5);
      treesGroup.add(tree);
    }
  }
  /* and a few slabs of cloud, well above everything */
  for (var j = 0; j < 16; j++) {
    var cloud = new THREE.Mesh(
      new THREE.BoxGeometry(30 + rnd() * 50, 5 + rnd() * 5, 20 + rnd() * 40),
      new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true,
        transparent: true, opacity: 0.85 }));
    cloud.position.set(-150 + rnd() * 700, 70 + rnd() * 70, -300 + rnd() * 700);
    treesGroup.add(cloud);
  }
  scene.add(treesGroup);
}

function buildFlag() {
  flag = new THREE.Group();
  var base = heightAt(PIN.x, PIN.z, 0);
  /* The hole is a hole: a dark disc laid flat on the green, exactly as wide
     as the ball has to be inside to drop. It used to be a black post standing
     seventeen centimetres proud of the green, which read as a bump to bounce
     off rather than somewhere to aim. */
  var cup = new THREE.Mesh(
    new THREE.CircleGeometry(CUP_RADIUS, 22),
    new THREE.MeshBasicMaterial({ color: 0x0a0e10, side: THREE.DoubleSide })
  );
  cup.rotation.x = -Math.PI / 2;
  cup.position.set(0, 0.014, 0);
  flag.add(cup);
  /* a pale rim, so you can pick it out from across the green */
  var rim = new THREE.Mesh(
    new THREE.CircleGeometry(CUP_RADIUS + 0.09, 24),
    new THREE.MeshBasicMaterial({ color: 0xeef6e8, side: THREE.DoubleSide })
  );
  rim.rotation.x = -Math.PI / 2;
  rim.position.set(0, 0.008, 0);
  flag.add(rim);
  var pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.035, 0.035, 2.6, 6),
    new THREE.MeshLambertMaterial({ color: 0xf4f4f0 })
  );
  pole.position.set(0, 1.3, 0);
  flag.add(pole);
  var cloth = new THREE.Mesh(
    new THREE.BoxGeometry(0.06, 0.45, 0.8),
    new THREE.MeshLambertMaterial({ color: 0xe8443a })
  );
  cloth.position.set(0, 2.25, 0.42);
  flag.add(cloth);
  flag.position.set(PIN.x, base, PIN.z);
  scene.add(flag);
}

/* A golf ball is 43mm across, which at two hundred metres is nothing at all.
   This one is drawn a little over life size and then grown with distance, so
   it is always at least a few pixels wide however far away it is - otherwise
   you simply lose the ball, which is realistic and no fun whatsoever. */
var BALL_R = BALL_RADIUS;
function buildBall() {
  ballMesh = new THREE.Mesh(
    new THREE.SphereGeometry(BALL_R, 14, 10),
    new THREE.MeshLambertMaterial({ color: 0xffffff })
  );
  ballMesh.castShadow = true;
  scene.add(ballMesh);
}

function sizeBall() {
  var d = camera.position.distanceTo(ballMesh.position);
  var want = Math.max(1, d * 0.0075 / BALL_R);
  ballMesh.scale.setScalar(Math.min(9, want));
}

/* A golfer, out of boxes. Enough of a person to tell which way you are
   facing and whether you are mid swing, which is all the character has to do. */
/* A golfer, out of boxes. Enough of a person to tell which way you are
   facing and whether you are mid swing, which is all the character has to do.
   The figure faces down its own x axis, the arms and legs hang off pivots at
   the shoulder and hip so they swing from the right end, and the whole thing
   is built standing on y = 0 so it can be set down on the ground rather than
   buried to the knees in it. */
var GOLFER_LIFT = 0.845;   /* how far the middle sits above the soles */

function buildGolfer() {
  golfer = new THREE.Group();
  function part(w, h, d, colour, x, y, z) {
    var m = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshLambertMaterial({ color: colour })
    );
    m.position.set(x, y, z);
    m.castShadow = true;
    return m;
  }
  function limb(x, y, z, mesh) {
    var pivot = new THREE.Group();
    pivot.position.set(x, y, z);
    pivot.add(mesh);
    return pivot;
  }
  golfer.hipL = limb(0, 0, -0.17, part(0.26, 0.85, 0.28, 0x2b3550, 0, -0.42, 0));
  golfer.hipR = limb(0, 0, 0.17, part(0.26, 0.85, 0.28, 0x2b3550, 0, -0.42, 0));
  golfer.body = new THREE.Group();
  golfer.torso = part(0.46, 0.75, 0.64, 0xe24d3f, 0, 0.38, 0);
  golfer.head = new THREE.Mesh(
    new THREE.SphereGeometry(0.21, 12, 10),
    new THREE.MeshLambertMaterial({ color: 0xf0c9a0 })
  );
  golfer.head.position.set(0, 0.92, 0);
  golfer.cap = part(0.34, 0.1, 0.36, 0x1d4e89, 0, 1.06, 0);
  golfer.peak = part(0.22, 0.06, 0.16, 0x1d4e89, 0.2, 1.02, 0);
  golfer.shoulderL = limb(0.06, 0.66, -0.38, part(0.18, 0.62, 0.18, 0xe24d3f, 0, -0.31, 0));
  golfer.shoulderR = limb(0.06, 0.66, 0.38, part(0.18, 0.62, 0.18, 0xe24d3f, 0, -0.31, 0));
  golfer.club = new THREE.Group();
  golfer.club.add(part(0.045, 1.15, 0.045, 0xd8d8d8, 0, -0.55, 0));
  golfer.club.add(part(0.16, 0.12, 0.3, 0x8f9499, 0.03, -1.12, 0.05));
  golfer.club.position.set(0.12, 0.5, 0.36);
  golfer.body.add(golfer.torso);
  golfer.body.add(golfer.head);
  golfer.body.add(golfer.cap);
  golfer.body.add(golfer.peak);
  golfer.body.add(golfer.shoulderL);
  golfer.body.add(golfer.shoulderR);
  golfer.body.add(golfer.club);
  golfer.add(golfer.hipL);
  golfer.add(golfer.hipR);
  golfer.add(golfer.body);
  golfer.userData.pos = { x: TEE.x - 2, z: TEE.z };
  scene.add(golfer);
}

/* the line the shot would take, drawn from the shot itself */
function buildAimLine() {
  var pos = new Float32Array(200 * 3);
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  aimLine = new THREE.Points(geo, new THREE.PointsMaterial({
    color: 0xfff1a8, size: 0.6, sizeAttenuation: true
  }));
  scene.add(aimLine);
  landMark = new THREE.Mesh(
    new THREE.CylinderGeometry(1.4, 1.4, 0.12, 18),
    new THREE.MeshBasicMaterial({ color: 0xfff1a8, transparent: true, opacity: 0.55 })
  );
  scene.add(landMark);
}

function refreshAim() {
  if (!predictDirty || !aimLine) return;
  predictDirty = false;
  var club = CLUBS[clubIndex];
  var b = hole.ball;
  predicted = predictShot(b.pos.x, b.pos.z, club.id, aimPower(), aimYaw, 0,
    hole.wind, hole.grab(), hole.time);
  var arr = aimLine.geometry.attributes.position.array;
  var n = Math.min(200, predicted.path.length);
  for (var i = 0; i < 200; i++) {
    var p = predicted.path[Math.min(predicted.path.length - 1, Math.floor(i * predicted.path.length / n))];
    arr[i * 3] = p.x; arr[i * 3 + 1] = p.y + 0.2; arr[i * 3 + 2] = p.z;
  }
  aimLine.geometry.attributes.position.needsUpdate = true;
  landMark.position.set(predicted.land.x, predicted.land.y + 0.12, predicted.land.z);
  landMark.visible = !predicted.lost;
}

/* the aiming line is drawn for a full swing, which is what the meter is
   measured against */
function aimPower() { return 1; }

/* ------------------------------------------------------------------ input */

var keys = {};
function bindKeys() {
  window.addEventListener('keydown', function (e) {
    if (keys[e.code]) return;
    keys[e.code] = true;
    onPress(e.code);
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.code) >= 0) e.preventDefault();
  });
  window.addEventListener('keyup', function (e) { keys[e.code] = false; });
}

function onPress(code) {
  if (code === 'Space' || code === 'Enter') return actionButton();
  if (code === 'Escape' || code === 'Backspace') return cancelButton();
  if (code === 'KeyQ') return changeClub(-1);
  if (code === 'KeyE') return changeClub(1);
  if (code === 'KeyR') return startHole();
  if (code === 'KeyM') { soundOn = !soundOn; flash(soundOn ? 'Sound on' : 'Sound off'); }
}

/* Gamepad, read fresh every frame. An Xbox pad comes through the standard
   mapping: sticks on axes 0-3, A and B first, then X and Y, then the
   shoulders. */
function readPad() {
  var pads = navigator.getGamepads ? navigator.getGamepads() : [];
  var pad = null;
  for (var i = 0; i < pads.length; i++) {
    if (pads[i] && pads[i].connected && pads[i].buttons.length >= 8) { pad = pads[i]; break; }
  }
  if (!pad) { if (padIndex !== null) { padIndex = null; refreshHints(); } return null; }
  if (padIndex === null) { padIndex = pad.index; refreshHints(); }

  function dead(v) { return Math.abs(v) < 0.22 ? 0 : (v - Math.sign(v) * 0.22) / 0.78; }
  var st = {
    lx: dead(pad.axes[0] || 0), ly: dead(pad.axes[1] || 0),
    rx: dead(pad.axes[2] || 0), ry: dead(pad.axes[3] || 0),
    a: !!(pad.buttons[0] && pad.buttons[0].pressed),
    b: !!(pad.buttons[1] && pad.buttons[1].pressed),
    x: !!(pad.buttons[2] && pad.buttons[2].pressed),
    y: !!(pad.buttons[3] && pad.buttons[3].pressed),
    lb: !!(pad.buttons[4] && pad.buttons[4].pressed),
    rb: !!(pad.buttons[5] && pad.buttons[5].pressed),
    start: !!(pad.buttons[9] && pad.buttons[9].pressed)
  };
  /* edges, so a held button does not fire every frame */
  st.pressed = {};
  ['a', 'b', 'x', 'y', 'lb', 'rb', 'start'].forEach(function (k) {
    st.pressed[k] = st[k] && !padWas[k];
    padWas[k] = st[k];
  });
  return st;
}

function actionButton() {
  if (phase === 'walk') {
    if (nearBall()) address();
    else flash('Walk to your ball');
  } else if (phase === 'aim') {
    beginSwing();
  } else if (phase === 'swing') {
    if (meter) {
      var st = meter.tap();
      if (st === 'struck') strike(meter.power, meter.face);
    }
  } else if (phase === 'holed') {
    startHole();
  }
}

function cancelButton() {
  if (phase === 'aim' || phase === 'swing') {
    phase = 'walk';
    meter = null;
    if (stick) stick.reset();
    hideAim();
  }
}

function changeClub(d) {
  if (phase !== 'aim') return;
  clubIndex = (clubIndex + d + CLUBS.length) % CLUBS.length;
  predictDirty = true;
  flash(CLUBS[clubIndex].name);
}

/* ------------------------------------------------------------ the states */

function nearBall() {
  var g = golfer.userData.pos, b = hole.ball.pos;
  return Math.hypot(g.x - b.x, g.z - b.z) < 4.5;
}

function address() {
  phase = 'aim';
  var b = hole.ball.pos;
  aimYaw = Math.atan2(PIN.z - b.z, PIN.x - b.x);
  clubIndex = 0;
  var want = suggestClub(hole.toPin(), hole.lie());
  for (var i = 0; i < CLUBS.length; i++) if (CLUBS[i].id === want) clubIndex = i;
  golfer.userData.pos.x = b.x - Math.cos(aimYaw) * 0.1 - Math.sin(aimYaw) * 0.9;
  golfer.userData.pos.z = b.z - Math.sin(aimYaw) * 0.1 + Math.cos(aimYaw) * 0.9;
  predictDirty = true;
  showAim();
}

function beginSwing() {
  phase = 'swing';
  swingAnim = 0;
  if (padIndex !== null) { stick = stick || new StickSwing(); stick.reset(); meter = null; }
  else { meter = new SwingMeter(); meter.tap(); stick = null; }
}

function strike(power, face) {
  swingFace = face;
  swingAnim = 0.001;
  phase = 'flight';
  hole.swing(CLUBS[clubIndex].id, power, aimYaw, face);
  hideAim();
  beep(180 + power * 240, 0.07);
  flash(CLUBS[clubIndex].name + '  ' + Math.round(power * 100) + '%');
}

function ballStopped() {
  var what = hole.finishShot();
  if (what === 'holed') {
    phase = 'holed';
    beep(660, 0.12); setTimeout(function () { beep(880, 0.18); }, 110);
    showCard();
    return;
  }
  if (what === 'lost') { flash('Off the course - one shot penalty'); beep(120, 0.25); }
  else {
    var msg = SURFACES[hole.lie()].name;
    if (hole.ball.carry > 5) msg += '  ·  ' + Math.round(hole.ball.carry) + 'm carry';
    flash(msg);
  }
  phase = 'walk';
  /* wander over to it, unless you would rather walk yourself */
  var tx = hole.ball.pos.x - Math.cos(aimYaw) * 1.6;
  var tz = hole.ball.pos.z - Math.sin(aimYaw) * 1.6;
  if (!walkable(tx, tz)) { tx = hole.ball.pos.x; tz = hole.ball.pos.z; }
  autoWalk = {
    from: { x: golfer.userData.pos.x, z: golfer.userData.pos.z },
    to: { x: tx, z: tz },
    t: 0
  };
}

function startHole() {
  hole = new Hole(Math.floor(Math.random() * 1000));
  hole.ball.pos = { x: TEE.x, y: restHeight(TEE.x, TEE.z), z: TEE.z };
  golfer.userData.pos = { x: TEE.x - 1.4, z: TEE.z + 0.6 };
  phase = 'walk';
  clubIndex = 0;
  aimYaw = Math.atan2(PIN.z - TEE.z, PIN.x - TEE.x);
  camYaw = aimYaw;
  autoWalk = null;
  meter = null;
  if (stick) stick.reset();
  hideAim();
  ui.card.classList.remove('show');
  flash('Par ' + PAR + '  ·  ' + Math.round(hole.toPin()) + 'm');
}

function showAim() { aimLine.visible = true; landMark.visible = true; predictDirty = true; }
function hideAim() { if (aimLine) { aimLine.visible = false; landMark.visible = false; } }

/* ------------------------------------------------------------------- loop */

function update(dt) {
  var pad = readPad();
  var mx = 0, my = 0;
  if (pad) { mx = pad.lx; my = pad.ly; }
  if (keys.KeyA || keys.ArrowLeft) mx -= 1;
  if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (keys.KeyW || keys.ArrowUp) my -= 1;
  if (keys.KeyS || keys.ArrowDown) my += 1;

  if (pad) {
    if (pad.pressed.a) actionButton();
    if (pad.pressed.b) cancelButton();
    if (pad.pressed.lb) changeClub(-1);
    if (pad.pressed.rb) changeClub(1);
    if (pad.pressed.start) startHole();
    if (pad.pressed.y) { soundOn = !soundOn; flash(soundOn ? 'Sound on' : 'Sound off'); }
    camYaw += pad.rx * 2.2 * dt;
    camPitch = Math.max(-0.15, Math.min(0.8, camPitch + pad.ry * 1.2 * dt));
  }

  if (phase === 'flight') updateFlight(dt);
  else {
    /* the windmill keeps turning whether or not a ball is in play */
    hole.time += dt;
    if (phase === 'walk') updateWalk(dt, mx, my);
    else if (phase === 'aim') updateAim(dt, mx, my);
    else if (phase === 'swing') updateSwing(dt, pad, mx, my);
  }

  if (swingAnim > 0) { swingAnim += dt * 2.6; if (swingAnim > 1.6) swingAnim = 0; }
  poseGolfer(dt);
  updateCamera(dt);
  updateHud();
}

function updateWalk(dt, mx, my) {
  var moving = Math.hypot(mx, my) > 0.05;
  if (moving) autoWalk = null;
  var g = golfer.userData.pos;
  if (autoWalk) {
    autoWalk.t = Math.min(1, autoWalk.t + dt / JOG_TIME);
    var e = autoWalk.t * autoWalk.t * (3 - 2 * autoWalk.t);
    g.x = autoWalk.from.x + (autoWalk.to.x - autoWalk.from.x) * e;
    g.z = autoWalk.from.z + (autoWalk.to.z - autoWalk.from.z) * e;
    walkPhase += dt * 11;
    golfer.userData.facing = Math.atan2(autoWalk.to.z - autoWalk.from.z, autoWalk.to.x - autoWalk.from.x);
    if (autoWalk.t >= 1) autoWalk = null;
  } else if (moving) {
    /* the stick pushes the golfer the way the camera is looking */
    var f = camYaw, s = camYaw + Math.PI / 2;
    var vx = (-my) * Math.cos(f) + mx * Math.cos(s);
    var vz = (-my) * Math.sin(f) + mx * Math.sin(s);
    var len = Math.hypot(vx, vz) || 1;
    var nx = g.x + vx / len * WALK_SPEED * dt;
    var nz = g.z + vz / len * WALK_SPEED * dt;
    /* you may walk to the very edge but not off it */
    if (walkable(nx, g.z)) g.x = nx;
    if (walkable(g.x, nz)) g.z = nz;
    golfer.userData.facing = Math.atan2(vz, vx);
    walkPhase += dt * 9;
  } else {
    walkPhase *= Math.pow(0.02, dt);
  }
}

function updateAim(dt, mx, my) {
  aimYaw += mx * 1.1 * dt;
  /* redrawn every frame, because the windmill has turned since the last one */
  predictDirty = true;
  var b = hole.ball.pos;
  var sx = b.x - Math.sin(aimYaw) * 0.9, sz = b.z + Math.cos(aimYaw) * 0.9;
  if (!walkable(sx, sz)) { sx = b.x + Math.sin(aimYaw) * 0.9; sz = b.z - Math.cos(aimYaw) * 0.9; }
  if (!walkable(sx, sz)) { sx = b.x; sz = b.z; }
  golfer.userData.pos.x = sx;
  golfer.userData.pos.z = sz;
  golfer.userData.facing = aimYaw;
  refreshAim();
}

function updateSwing(dt, pad, mx, my) {
  golfer.userData.facing = aimYaw;
  if (stick && pad) {
    /* pull the stick back to load it, push through to hit */
    var hit = stick.update(pad.lx, pad.ly, dt);
    if (hit) strike(hit.power, hit.face);
  } else if (meter) {
    meter.step(dt);
    if (meter.phase === 'struck') strike(meter.power, meter.face);
  }
}

function updateFlight(dt) {
  /* Stepped at exactly the rate the aiming line was drawn at, and in fixed
     steps, so the shot plays out the same however fast the screen is going.
     The only thing that can pull it away from the drawn line is the windmill,
     which has moved on a little between being shown the line and swinging. */
  simAccum = Math.min(0.4, simAccum + dt);
  var guard = 0;
  while (simAccum >= SIM_DT && guard++ < 16) {
    simAccum -= SIM_DT;
    hole.ball.step(SIM_DT, hole.time);
    hole.time += SIM_DT;
    if (!hole.ball.moving) break;
  }
  if (!hole.ball.moving) { simAccum = 0; ballStopped(); }
}

function poseGolfer(dt) {
  var g = golfer.userData.pos;
  /* set down on its soles, not sunk to the hips in the ground */
  golfer.position.set(g.x,
    solidY(g.x, g.z, golfer.position.y - GOLFER_LIFT) + GOLFER_LIFT, g.z);
  var face = golfer.userData.facing === undefined ? 0 : golfer.userData.facing;
  /* Walking, you face where you are going. Over the ball you stand side on to
     it, which is a quarter turn off the line you are aiming down - and which
     is why walking used to look like crabbing. */
  golfer.rotation.y = -face + (phase === 'walk' ? 0 : Math.PI / 2);

  /* arms and legs swing fore and aft, which for a figure facing down its own
     x axis is a turn about z */
  var sw = phase === 'walk' ? Math.sin(walkPhase) * 0.7 : 0;
  golfer.hipL.rotation.z = sw;
  golfer.hipR.rotation.z = -sw;
  golfer.shoulderL.rotation.z = -sw * 0.8;
  golfer.shoulderR.rotation.z = sw * 0.8;

  /* the swing itself: back, through, and a held finish */
  var t = swingAnim;
  var turn = 0;
  if (phase === 'swing' && meter) turn = -meter.value * 2.1;
  else if (phase === 'swing' && stick) turn = -stick.loaded * 2.1;
  else if (t > 0) turn = t < 0.25 ? -2.1 + t * 4 * 2.1 : Math.min(2.4, (t - 0.25) * 3.4);
  golfer.body.rotation.y = turn * 0.45;
  golfer.club.rotation.x = turn;
  golfer.shoulderL.rotation.x = turn * 0.35;
  golfer.shoulderR.rotation.x = turn * 0.35;
}

function updateCamera(dt) {
  var want = new THREE.Vector3(), look = new THREE.Vector3();
  var b = hole.ball.pos, g = golfer.userData.pos;
  if (phase === 'flight') {
    var lead = Math.min(40, Math.hypot(hole.ball.vel.x, hole.ball.vel.z) * 0.8);
    want.set(b.x - Math.cos(aimYaw) * (16 + lead), b.y + 7 + lead * 0.25,
      b.z - Math.sin(aimYaw) * (16 + lead));
    look.set(b.x + Math.cos(aimYaw) * 8, b.y + 1, b.z + Math.sin(aimYaw) * 8);
  } else if (phase === 'aim' || phase === 'swing') {
    var back = 7.5;
    var bh = solidY(b.x, b.z, b.y);
    want.set(b.x - Math.cos(aimYaw) * back, bh + 3.4, b.z - Math.sin(aimYaw) * back);
    var far = Math.min(hole.toPin(), 60);
    look.set(b.x + Math.cos(aimYaw) * far, bh + 1.4 + far * 0.03,
      b.z + Math.sin(aimYaw) * far);
  } else if (phase === 'holed') {
    want.set(PIN.x - 9, PIN.y + 6, PIN.z - 5);
    look.set(PIN.x, PIN.y + 1.2, PIN.z);
  } else {
    var gh = solidY(g.x, g.z, golfer.position.y);
    want.set(g.x - Math.cos(camYaw) * camDist, gh + 3 + camPitch * 9,
      g.z - Math.sin(camYaw) * camDist);
    look.set(g.x + Math.cos(camYaw) * 6, gh + 1.6, g.z + Math.sin(camYaw) * 6);
  }
  /* never let the camera sink into the course - but over the void there is
     nothing to sink into, and dropping away is the shot */
  var under = groundUnder(want.x, want.z, hole.time);
  if (under && want.y < under.y + 1.6) want.y = under.y + 1.6;
  var rate = 1 - Math.exp(-dt * (phase === 'flight' ? 6 : 4));
  camera.position.lerp(want, rate);
  if (!camera.userData.look) camera.userData.look = look.clone();
  camera.userData.look.lerp(look, rate);
  camera.lookAt(camera.userData.look);
}

/* -------------------------------------------------------------------- hud */

function flash(text) { message = text; messageUntil = performance.now() + 2400; }

function updateHud() {
  var left = hole.toPin();
  ui.dist.textContent = left < 1 ? 'In the hole' : Math.round(left) + ' m';
  ui.lie.textContent = SURFACES[hole.lie()].name;
  ui.club.textContent = CLUBS[clubIndex].name;
  ui.shots.textContent = (hole.strokes + hole.penalties) + ' / par ' + PAR;
  var wSpeed = Math.hypot(hole.wind.x, hole.wind.z);
  var wDir = Math.atan2(hole.wind.z, hole.wind.x) - aimYaw;
  ui.wind.textContent = wSpeed.toFixed(1) + ' m/s ' + windArrow(wDir);
  ui.msg.textContent = performance.now() < messageUntil ? message : '';

  var show = phase === 'swing';
  ui.meterWrap.classList.toggle('show', show);
  if (show) {
    var v = meter ? Math.max(0, meter.value) : (stick ? stick.loaded : 0);
    ui.meterFill.style.height = Math.round(Math.min(1, v) * 100) + '%';
    ui.meterFill.style.background = meter && meter.phase === 'downswing' ? '#ffd23f' : '#7fd66b';
  }
  ui.prompt.textContent = promptText();
}

function windArrow(rel) {
  var dirs = ['→', '↘', '↓', '↙', '←', '↖', '↑', '↗'];
  var i = Math.round(((rel % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) / (Math.PI / 4)) % 8;
  return dirs[i];
}

function promptText() {
  var pad = padIndex !== null;
  if (phase === 'walk') {
    if (nearBall()) return pad ? 'A  address the ball' : 'Space  address the ball';
    return pad ? 'Left stick  walk to your ball' : 'WASD  walk to your ball';
  }
  if (phase === 'aim') {
    return pad ? 'Left stick  aim   ·   LB / RB  club   ·   A  take your stance'
               : 'A / D  aim   ·   Q / E  club   ·   Space  take your stance';
  }
  if (phase === 'swing') {
    return pad ? 'Pull the left stick back, then push it through'
               : 'Space  set the power   ·   Space again at the bottom';
  }
  if (phase === 'holed') return pad ? 'A  play it again' : 'Space  play it again';
  return '';
}

function refreshHints() { flash(padIndex !== null ? 'Controller connected' : 'Controller disconnected'); }

function showCard() {
  var s = hole.score();
  ui.cardTitle.textContent = s.name;
  ui.cardBody.innerHTML =
    '<b>' + s.total + '</b> strokes on a par ' + s.par +
    (s.penalties ? '<br>including ' + s.penalties + ' penalty stroke' + (s.penalties > 1 ? 's' : '') : '') +
    '<br><span class="soft">' + (padIndex !== null ? 'A' : 'Space') + ' to play it again</span>';
  ui.card.classList.add('show');
}

/* ------------------------------------------------------------------ sound */

function beep(freq, len) {
  if (!soundOn) return;
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    var o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq;
    o.type = 'triangle';
    g.gain.setValueAtTime(0.16, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + len);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + len);
  } catch (e) { /* no audio here, never mind */ }
}

/* ------------------------------------------------------------------- boot */

function resize() {
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = camera.aspect >= 1.2 ? 58 : Math.min(72, 58 + (1.2 - camera.aspect) * 22);
  camera.updateProjectionMatrix();
}

function el(id) { return document.getElementById(id); }

function boot() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fc7e8);
  scene.fog = new THREE.Fog(0x9fd0ea, 320, 1400);
  camera = new THREE.PerspectiveCamera(58, 1, 0.5, 2200);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  el('stage').appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x3d5a2a, 0.85));
  sun = new THREE.DirectionalLight(0xfff4e0, 0.85);
  sun.position.set(-120, 180, 60);
  scene.add(sun);

  buildScenery();
  buildCourseMeshes();
  buildMill();
  buildFlag();
  buildBall();
  buildGolfer();
  buildAimLine();

  ['dist', 'lie', 'club', 'shots', 'wind', 'msg', 'prompt', 'meterWrap',
    'meterFill', 'card', 'cardTitle', 'cardBody'].forEach(function (k) { ui[k] = el(k); });

  bindKeys();
  ['hitBtn', 'cancelBtn', 'clubDownBtn', 'clubUpBtn', 'resetBtn', 'fullBtn'].forEach(function (id) {
    var b = el(id);
    if (!b) return;
    b.addEventListener('click', function () {
      if (id === 'hitBtn') actionButton();
      else if (id === 'cancelBtn') cancelButton();
      else if (id === 'clubDownBtn') changeClub(-1);
      else if (id === 'clubUpBtn') changeClub(1);
      else if (id === 'resetBtn') startHole();
      else if (id === 'fullBtn') toggleFullscreen();
    });
  });
  window.addEventListener('gamepadconnected', function () { readPad(); });
  window.addEventListener('resize', resize);
  resize();
  syncFullscreenButton();
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (ev) {
    document.addEventListener(ev, syncFullscreenButton);
  });

  startHole();
  camera.position.set(TEE.x - 14, TEE.y + 6, TEE.z - 6);
  lastTime = performance.now();
  requestAnimationFrame(frame);
}

function frame(now) {
  var dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  ballMesh.position.set(hole.ball.pos.x, hole.ball.pos.y, hole.ball.pos.z);
  ballMesh.visible = !hole.ball.holed;
  sizeBall();
  spinCourse(hole.time);
  /* the sails turn with the arm below them, so what you see is the timing
     you have to play */
  if (millGroup) millGroup.userData.sails.rotation.z =
    -millGroup.userData.hub.spin * hole.time;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------ full screen */

function fullscreenElement() {
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}
function canFullscreen() {
  var d = document.documentElement;
  return !!(d.requestFullscreen || d.webkitRequestFullscreen);
}
function toggleFullscreen() {
  var d = document.documentElement;
  if (fullscreenElement()) {
    var exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) exit.call(document);
    return;
  }
  var go = d.requestFullscreen || d.webkitRequestFullscreen;
  if (!go) return;
  var p = go.call(d);
  if (p && p.catch) p.catch(function () {});
}
function syncFullscreenButton() {
  var b = el('fullBtn');
  if (!b) return;
  if (!canFullscreen()) { b.hidden = true; return; }
  b.hidden = false;
  b.textContent = fullscreenElement() ? 'Exit full screen' : 'Full screen';
  resize();
  setTimeout(resize, 350);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
