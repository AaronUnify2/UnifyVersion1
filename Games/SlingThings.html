  scene.add(aimArrow);
}

/* --------------------------------------------------------------- particles */

var PART_MAX = 500;
var parts = { pos: null, col: null, vel: [], life: [], maxLife: [], geo: null, points: null, next: 0 };

function buildParticles() {
  parts.pos = new Float32Array(PART_MAX * 3);
  parts.col = new Float32Array(PART_MAX * 3);
  for (var i = 0; i < PART_MAX; i++) {
    parts.pos[i * 3 + 1] = -1000;
    parts.vel.push(new THREE.Vector3());
    parts.life.push(0);
    parts.maxLife.push(1);
  }
  parts.geo = new THREE.BufferGeometry();
  parts.geo.setAttribute('position', new THREE.BufferAttribute(parts.pos, 3));
  parts.geo.setAttribute('color', new THREE.BufferAttribute(parts.col, 3));
  parts.points = new THREE.Points(parts.geo, new THREE.PointsMaterial({
    size: 0.42, vertexColors: true, sizeAttenuation: true,
    transparent: true, opacity: 0.95, depthWrite: false
  }));
  parts.points.frustumCulled = false;
  scene.add(parts.points);
}

function burst(point, colorHex, count, speed, life) {
  var col = new THREE.Color(colorHex);
  for (var i = 0; i < count; i++) {
    var idx = parts.next;
    parts.next = (parts.next + 1) % PART_MAX;
    parts.pos[idx * 3] = point.x;
    parts.pos[idx * 3 + 1] = point.y;
    parts.pos[idx * 3 + 2] = point.z;
    var s = speed * (0.35 + Math.random() * 0.9);
    var theta = Math.random() * Math.PI * 2;
    var phi = Math.acos(2 * Math.random() - 1);
    parts.vel[idx].set(
      Math.sin(phi) * Math.cos(theta) * s,
      Math.abs(Math.cos(phi)) * s * 1.1 + 1.5,
      Math.sin(phi) * Math.sin(theta) * s
    );
    var shade = 0.75 + Math.random() * 0.45;
    parts.col[idx * 3] = Math.min(1, col.r * shade);
    parts.col[idx * 3 + 1] = Math.min(1, col.g * shade);
    parts.col[idx * 3 + 2] = Math.min(1, col.b * shade);
    parts.life[idx] = life * (0.6 + Math.random() * 0.7);
    parts.maxLife[idx] = parts.life[idx];
  }
}

function updateParticles(dt) {
  var moved = false;
  for (var i = 0; i < PART_MAX; i++) {
    if (parts.life[i] <= 0) continue;
    moved = true;
    parts.life[i] -= dt;
    if (parts.life[i] <= 0) {
      parts.pos[i * 3 + 1] = -1000;
      continue;
    }
    var v = parts.vel[i];
    v.y -= 26 * dt;
    parts.pos[i * 3] += v.x * dt;
    parts.pos[i * 3 + 1] += v.y * dt;
    parts.pos[i * 3 + 2] += v.z * dt;
    if (parts.pos[i * 3 + 1] < 0.08) {
      parts.pos[i * 3 + 1] = 0.08;
      v.set(v.x * 0.4, Math.abs(v.y) * 0.25, v.z * 0.4);
    }
    var f = parts.life[i] / parts.maxLife[i];
    var k = f < 0.4 ? f / 0.4 : 1;
    parts.col[i * 3] *= 1; /* colour kept, fade handled by shrinking life */
    if (k < 1) {
      parts.col[i * 3] = parts.col[i * 3] * 0.985 + 0.72 * 0.015;
      parts.col[i * 3 + 1] = parts.col[i * 3 + 1] * 0.985 + 0.84 * 0.015;
      parts.col[i * 3 + 2] = parts.col[i * 3 + 2] * 0.985 + 0.93 * 0.015;
    }
  }
  if (moved) {
    parts.geo.attributes.position.needsUpdate = true;
    parts.geo.attributes.color.needsUpdate = true;
  }
}

/* ------------------------------------------------------------------- sound */

var audio = null;
function initAudio() {
  if (audio) return;
  var Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  audio = new Ctx();
}
function tone(freq, dur, type, vol, slideTo) {
  if (!soundOn || !audio) return;
  var o = audio.createOscillator(), g = audio.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, audio.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), audio.currentTime + dur);
  g.gain.setValueAtTime(0.0001, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, audio.currentTime + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + dur + 0.02);
}
function noiseBurst(dur, vol, filterFreq) {
  if (!soundOn || !audio) return;
  var n = Math.floor(audio.sampleRate * dur);
  var buf = audio.createBuffer(1, n, audio.sampleRate);
  var data = buf.getChannelData(0);
  for (var i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
  var src = audio.createBufferSource();
  src.buffer = buf;
  var f = audio.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = filterFreq || 1200;
  var g = audio.createGain();
  g.gain.value = vol || 0.25;
  src.connect(f); f.connect(g); g.connect(audio.destination);
  src.start();
}
var sfx = {
  launch: function () { tone(680, 0.16, 'square', 0.12, 180); noiseBurst(0.12, 0.12, 2400); },
  thud: function (v) { tone(90, 0.16, 'sine', Math.min(0.32, 0.06 + v * 0.02), 45); noiseBurst(0.1, Math.min(0.2, 0.04 + v * 0.012), 500); },
  crack: function () { noiseBurst(0.22, 0.28, 3200); tone(240, 0.12, 'square', 0.1, 90); },
  glass: function () { noiseBurst(0.3, 0.22, 6000); tone(1400, 0.2, 'triangle', 0.1, 600); },
  boom: function () { noiseBurst(0.7, 0.45, 420); tone(70, 0.55, 'sine', 0.35, 28); },
  splat: function () { noiseBurst(0.22, 0.24, 900); tone(160, 0.14, 'sine', 0.14, 60); },
  pop: function () { tone(880, 0.1, 'triangle', 0.16, 1500); tone(1320, 0.08, 'sine', 0.1); },
  win: function () {
    [523, 659, 784, 1047].forEach(function (f, i) {
      setTimeout(function () { tone(f, 0.22, 'triangle', 0.16); }, i * 110);
    });
  },
  lose: function () {
    [392, 330, 262].forEach(function (f, i) {
      setTimeout(function () { tone(f, 0.28, 'sine', 0.16); }, i * 150);
    });
  }
};

/* ------------------------------------------------------------ level set-up */

function clearMeshes() {
  for (var i = 0; i < meshes.length; i++) scene.remove(meshes[i].mesh);
  meshes.length = 0;
  while (pilesGroup.children.length) pilesGroup.remove(pilesGroup.children[0]);
}

function attachMesh(body, mesh) {
  scene.add(mesh);
  meshes.push({ body: body, mesh: mesh });
  body.userData.mesh = mesh;
}

function startSet(set) {
  currentSet = set;
  setLevels = levelsInSet(set);
  setPos = 0;
  totalScore = 0;
  startLevel(setLevels[0]);
}

function startLevel(index) {
  levelIndex = index;
  setPos = setLevels.indexOf(index);
  if (setPos < 0) { currentSet = LEVELS[index].set; setLevels = levelsInSet(currentSet); setPos = setLevels.indexOf(index); }
  game = new Game(index);
  clearMeshes();
  var i;
  for (i = 0; i < game.state.scenery.length; i++) {
    attachMesh(game.state.scenery[i], sceneryMesh(game.state.scenery[i]));
  }
  for (i = 0; i < game.state.blocks.length; i++) {
    attachMesh(game.state.blocks[i], blockMesh(game.state.blocks[i]));
  }
  for (i = 0; i < game.state.targets.length; i++) {
    var t = game.state.targets[i];
    attachMesh(t, t.tag === 'skittle' ? skittleMesh() : gnomeMesh());
  }
  buildDecor();
  selectedAmmo = game.ammo.length ? game.ammo[0] : null;
  aimPitch = 28; aimYaw = 0; aimPower = 0;
  phase = 'aim';
  shake = 0;
  refreshPile();
  updateHud();
  setOverlay(null);
  syncMeshes();
}

var decorGroup = null;
function buildDecor() {
  if (!decorGroup) { decorGroup = new THREE.Group(); scene.add(decorGroup); }
  while (decorGroup.children.length) decorGroup.remove(decorGroup.children[0]);
  if (!game || game.mode !== 'distance') return;

  /* trees down both sides, so the run-out is not an empty green desert */
  for (var f = 70; f <= 400; f += 26) {
    var jitter = ((f * 37) % 11) - 5;
    decorGroup.add(makeTree(f + jitter, 15 + ((f * 13) % 9), 1.0 + ((f * 7) % 5) * 0.12));
    decorGroup.add(makeTree(f - jitter, -16 - ((f * 17) % 9), 1.0 + ((f * 11) % 5) * 0.12));
  }

  /* marker posts down the range, so the distance reads at a glance */
  var postMat = lambert({ color: 0xf2f2f2 });
  var flagMat = lambert({ color: 0xe8443a });
  for (var d = 50; d <= 350; d += 50) {
    var x = SLING.x + d;
    for (var side = -1; side <= 1; side += 2) {
      var post = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 4.2, 6), postMat);
      post.position.set(x, 2.1, side * 9);
      post.castShadow = true;
      decorGroup.add(post);
      var flag = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.9, 1.6), flagMat);
      flag.position.set(x, 3.7, side * 9.9);
      decorGroup.add(flag);
    }
  }
}

/* the heap of unused ammo sitting beside the sling */
function refreshPile() {
  while (pilesGroup.children.length) pilesGroup.remove(pilesGroup.children[0]);
  if (!game) return;
  var spots = [
    [-3.2, 0, -2.4], [-4.4, 0, -0.6], [-3.0, 0, 1.9], [-5.2, 0, 1.4],
    [-2.2, 0, 3.2], [-5.6, 0, -2.2], [-6.6, 0, 0.4]
  ];
  for (var i = 0; i < game.ammo.length && i < spots.length; i++) {
    var t = thingById(game.ammo[i]);
    var g = thingMesh(t);
    var lift = t.shape === 'sphere' ? t.radius : t.half.y;
    g.position.set(SLING.x + spots[i][0], lift, SLING.z + spots[i][2]);
    g.rotation.y = i * 1.3;
    if (i === game.ammo.indexOf(selectedAmmo)) {
      g.position.y += 0.35;                 /* the next one up hovers over the heap */
      g.userData.isNext = true;
    }
    g.userData.baseY = g.position.y;
    pilesGroup.add(g);
  }
}

/* --------------------------------------------------------------- the frame */

function syncMeshes() {
  for (var i = meshes.length - 1; i >= 0; i--) {
    var pair = meshes[i];
    if (pair.body.dead || game.world.bodies.indexOf(pair.body) < 0) {
      scene.remove(pair.mesh);
      meshes.splice(i, 1);
      continue;
    }
    var b = pair.body;
    pair.mesh.position.set(b.pos.x, b.pos.y, b.pos.z);
    pair.mesh.quaternion.set(b.quat.x, b.quat.y, b.quat.z, b.quat.w);
  }
}

function materialColour(body) {
  if (body.material) return body.material.color;
  return 0xcccccc;
}

function drainEvents() {
  var evs = game.events;
  for (var i = 0; i < evs.length; i++) {
    var e = evs[i];
    if (e.type === 'impact') {
      if (e.speed > 4) {
        var col = e.a.material ? e.a.material.color : (e.b.material ? e.b.material.color : 0xdac9a6);
        burst(e.point, col, Math.min(14, 3 + Math.round(e.speed / 2)), e.speed * 0.25, 0.5);
        sfx.thud(e.speed);
        shake = Math.min(1.4, shake + e.speed * 0.012);
      }
    } else if (e.type === 'break') {
      var mat = e.body.material;
      burst(e.point, mat ? mat.color : 0xc08b4a, 26, 7, 1.1);
      if (mat && mat.name === 'ice') sfx.glass(); else sfx.crack();
      shake = Math.min(1.6, shake + 0.3);
    } else if (e.type === 'explode') {
      burst(e.point, 0xffb03a, 90, 17, 1.3);
      burst(e.point, 0x555555, 40, 10, 1.6);
      sfx.boom();
      shake = 2.2;
    } else if (e.type === 'pop') {
      burst(e.point, 0xcf3b34, 24, 6, 0.9);
      burst(e.point, 0xf2f2f2, 14, 5, 0.9);
      sfx.pop();
    } else if (e.type === 'splat') {
      burst(e.point, 0xe2445c, 34, 7, 0.9);
      burst(e.point, 0x4e9b3a, 16, 6, 0.9);
      sfx.splat();
    } else if (e.type === 'shatter') {
      burst(e.point, 0xf2f2f2, 30, 8, 1.0);
      burst(e.point, 0x2f6fb5, 18, 7, 1.0);
      sfx.crack();
    } else if (e.type === 'quake') {
      burst(e.point, 0x8a6a45, 22, 5, 0.8);
      shake = Math.min(2.0, shake + 0.8);
      sfx.thud(14);
    } else if (e.type === 'boost') {
      burst(e.point, 0xffd23f, 10, 4, 0.4);
      tone(420, 0.09, 'square', 0.09, 900);
    } else if (e.type === 'retire') {
      burst(e.point, 0xdfe8ef, 12, 3, 0.55);
    } else if (e.type === 'launch') {
      sfx.launch();
    }
  }
  evs.length = 0;
}

/* Where the action is, and how much of the world the camera has to cover.
   Levels differ a lot in size - the toddler ones are short and close - so the
   camera works this out rather than sitting at a fixed distance. */
function playSpan() {
  var fallback = { centre: new THREE.Vector3(14, 4, 0), midX: 6, farX: 20, top: 10, need: 40 };
  if (!game) return fallback;
  if (!game.state.blocks.length) {
    var span = game.def.view || 46;
    return {
      centre: new THREE.Vector3(SLING.x + span * 0.45, 4, 0),
      midX: SLING.x + span / 2, farX: SLING.x + span, top: 8, need: span
    };
  }
  var sx = 0, sy = 0, n = 0, farX = -1e9, top = 0;
  for (var i = 0; i < game.state.blocks.length; i++) {
    var b = game.state.blocks[i];
    sx += b.startPos.x; sy += b.startPos.y; n++;
    farX = Math.max(farX, b.startPos.x + b.half.x);
    top = Math.max(top, b.startPos.y + b.half.y);
  }
  var centre = new THREE.Vector3(sx / n, sy / n + 1.5, 0);
  var need = Math.max((farX + 6) - SLING.x, top * 2.2, 26);
  if (game.def.view) need = game.def.view;
  /* look at the middle of the ground the shot has to cover, not at the tower,
     or a long treadmill level pushes its tower off the edge of the screen */
  var midX = SLING.x + need / 2;
  return { centre: centre, midX: midX, farX: farX, top: top, need: need };
}

function towerCentre() { return playSpan().centre; }

var camPos = null, camAim = null;
function updateCamera(dt) {
  if (!camPos) {
    camPos = camera.position.clone();
    camAim = new THREE.Vector3(SLING.x + 12, 5, 0);
  }
  var wantPos, wantAim;
  var span = playSpan();
  var centre = span.centre;
  var dist = span.need * 0.95;
  var high = 4 + span.need * 0.18;

  /* A tall phone screen has a much narrower horizontal field of view, which
     would shove the slingshot off the left edge - so back the camera off
     until the sling and the tower both fit again. */
  var fit = Math.max(1, Math.min(3.0, 1.6 / camera.aspect));

  if (game && game.flying && camMode !== 2) {
    var p = game.flying.pos;
    wantPos = new THREE.Vector3(p.x - 6, p.y + 5, p.z + dist * 0.56 * zoom * fit);
    wantAim = new THREE.Vector3(p.x + 4, p.y, p.z);
  } else if (camMode === 1) {
    /* over the shoulder of the slingshot */
    wantPos = new THREE.Vector3(SLING.x - 13 * fit, SLING.y + 7, SLING.z + 7 * zoom * fit);
    wantAim = new THREE.Vector3(centre.x, centre.y, 0);
  } else if (camMode === 2) {
    /* locked on the tower */
    wantPos = new THREE.Vector3(centre.x - 6, centre.y + 7, dist * 0.8 * zoom * fit);
    wantAim = centre;
  } else {
    var mid = span.midX;
    wantPos = new THREE.Vector3(mid - 6 / fit, high * Math.min(1.5, fit), dist * zoom * fit);
    wantAim = new THREE.Vector3(mid, 5, 0);
  }

  var rate = 1 - Math.exp(-dt * 3.2);
  camPos.lerp(wantPos, rate);
  camAim.lerp(wantAim, rate);

  camera.position.copy(camPos);
  if (shake > 0.01) {
    camera.position.x += (Math.random() - 0.5) * shake * 0.5;
    camera.position.y += (Math.random() - 0.5) * shake * 0.5;
    camera.position.z += (Math.random() - 0.5) * shake * 0.3;
    shake *= Math.pow(0.08, dt);
    if (shake < 0.01) shake = 0;
  }
  camera.lookAt(camAim);
}

function updateSling() {
  var dir = launchVelocity(1, aimPitch, aimYaw);
  var len = vLen(dir);
  var pull = 0.5 + aimPower * 2.4;
  var pouchPos = new THREE.Vector3(
    SLING.x - dir.x / len * pull,
    SLING.y - dir.y / len * pull,
    SLING.z - dir.z / len * pull
  );
  if (phase !== 'aim') {
    pouchPos.set(SLING.x, SLING.y, SLING.z);
  }
  pouch.position.copy(pouchPos);
  pouch.lookAt(new THREE.Vector3(SLING.x, SLING.y + 1, SLING.z));
  spanCylinder(bandLeft, forkTipL, pouchPos);
  spanCylinder(bandRight, forkTipR, pouchPos);

  var showAim = (phase === 'aim' && aiming);
  var i;
  if (showAim) {
    var v = launchVelocity(aimPower, aimPitch, aimYaw);
    var path = predictPath(vec(SLING.x, SLING.y, SLING.z), v, game.world.gravity,
      game.world.linearDamping, 1000, 1 / 60);
    var stride = Math.max(1, Math.floor(path.length / trailDots.length));
    for (i = 0; i < trailDots.length; i++) {
      var k = i * stride;
      if (k < path.length) {
        trailDots[i].visible = true;
        trailDots[i].position.set(path[k].x, path[k].y, path[k].z);
        trailDots[i].material.opacity = 0.9 - i / trailDots.length * 0.65;
        var sc = 1 - i / trailDots.length * 0.5;
        trailDots[i].scale.setScalar(sc);
      } else {
        trailDots[i].visible = false;
      }
    }
    aimArrow.visible = true;
    aimArrow.position.set(
      SLING.x + v.x / vLen(v) * 3.2,
      SLING.y + v.y / vLen(v) * 3.2,
      SLING.z + v.z / vLen(v) * 3.2
    );
    aimArrow.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      new THREE.Vector3(v.x, v.y, v.z).normalize()
    );
  } else {
    for (i = 0; i < trailDots.length; i++) trailDots[i].visible = false;
    aimArrow.visible = false;
  }
}

var settleTimer = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!running) return;
  var dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;

  if (game && phase !== 'title') {
    var steps = 0;
    accum += dt;
    while (accum >= FIXED_STEP && steps < 6) {
      game.step(FIXED_STEP);
      accum -= FIXED_STEP;
      steps++;
    }
    if (accum > 0.25) accum = 0;
    drainEvents();
    syncMeshes();

    if (phase === 'flying' || phase === 'settling') {
      if (!game.flying) phase = 'settling';
      if (game.isSettled()) finishShot();
    }
  }

  updateParticles(dt);
  spinNextAmmo(now);
  updateSling();
  updateCamera(dt);
  renderer.render(scene, camera);
}

/* slowly turn whichever thing is loaded next, so the choice reads at a glance */
function spinNextAmmo(now) {
  if (!pilesGroup) return;
  for (var i = 0; i < pilesGroup.children.length; i++) {
    var c = pilesGroup.children[i];
    if (c.userData && c.userData.isNext) {
      c.rotation.y = now / 1100;
      c.position.y = c.userData.baseY + Math.sin(now / 420) * 0.12;
    }
  }
}

function finishShot() {
  if (game.isWon()) {
    phase = 'won';
    var sc = game.score();
    totalScore += sc.total;
    sfx.win();
    showResult(true, sc);
  } else if (game.ammo.length === 0) {
    phase = 'lost';
    sfx.lose();
    showResult(false, game.score());
  } else {
    phase = 'aim';
    if (game.ammo.indexOf(selectedAmmo) < 0) selectedAmmo = game.ammo[0];
    refreshPile();
  }
  updateHud();
}

/* ------------------------------------------------------------------- input */

function pointerXY(e) {
  if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

function beginDrag(e) {
  if (phase !== 'aim' || !selectedAmmo) return;
  initAudio();
  aiming = true;
  dragStart = pointerXY(e);
  dragNow = dragStart;
  updateAim();
}
function moveDrag(e) {
  if (!aiming) return;
  dragNow = pointerXY(e);
  updateAim();
  e.preventDefault();
}
function endDrag() {
  if (!aiming) return;
  aiming = false;
  if (aimPower > 0.06) {
    game.fire(selectedAmmo, aimPower, aimPitch, aimYaw);
    var body = game.flying;
    if (body) attachMesh(body, thingMesh(thingById(selectedAmmo)));
    phase = 'flying';
    aimPower = 0;
    refreshPile();
    updateHud();
  }
}
function updateAim() {
  var dx = dragStart.x - dragNow.x;      /* pulled backwards = positive */
  var dy = dragStart.y - dragNow.y;      /* pulled upwards   = positive */
  var len = Math.sqrt(dx * dx + dy * dy);
  aimPower = Math.max(0, Math.min(1, len / MAX_DRAG));
  var lift = Math.max(-1, Math.min(1, -dy / MAX_DRAG));
  aimPitch = Math.max(3, Math.min(80, 26 + lift * 46));
  updateReadout();
}

function bindInput() {
  var cv = renderer.domElement;
  cv.addEventListener('mousedown', beginDrag);
  window.addEventListener('mousemove', moveDrag);
  window.addEventListener('mouseup', endDrag);
  cv.addEventListener('touchstart', function (e) { beginDrag(e); e.preventDefault(); }, { passive: false });
  window.addEventListener('touchmove', moveDrag, { passive: false });
  window.addEventListener('touchend', endDrag);
  cv.addEventListener('wheel', function (e) {
    zoom = Math.max(0.5, Math.min(2.2, zoom + (e.deltaY > 0 ? 0.08 : -0.08)));
    e.preventDefault();
  }, { passive: false });

  window.addEventListener('keydown', function (e) {
    if (e.key >= '1' && e.key <= '9') {
      var i = parseInt(e.key, 10) - 1;
      if (game && game.ammo[i]) { selectedAmmo = game.ammo[i]; refreshPile(); updateHud(); }
    }
    if (e.key === 'ArrowLeft' || e.key === 'a') { aimYaw = Math.max(-26, aimYaw - 2); updateReadout(); }
    if (e.key === 'ArrowRight' || e.key === 'd') { aimYaw = Math.min(26, aimYaw + 2); updateReadout(); }
    if (e.key === 'ArrowUp' || e.key === 'w') { aimPitch = Math.min(80, aimPitch + 2); updateReadout(); }
    if (e.key === 'ArrowDown' || e.key === 's') { aimPitch = Math.max(3, aimPitch - 2); updateReadout(); }
    if (e.key === 'c' || e.key === 'C') cycleCamera();
    if (e.key === 'r' || e.key === 'R') startLevel(levelIndex);
    if (e.key === ' ' && phase === 'aim' && selectedAmmo) {
      aimPower = 1;
      game.fire(selectedAmmo, 1, aimPitch, aimYaw);
      if (game.flying) attachMesh(game.flying, thingMesh(thingById(selectedAmmo)));
      phase = 'flying'; aimPower = 0; refreshPile(); updateHud();
      e.preventDefault();
    }
  });

  window.addEventListener('resize', resize);
}

function cycleCamera() {
  camMode = (camMode + 1) % 3;
  ui.camBtn.textContent = ['Camera: wide', 'Camera: sling', 'Camera: tower'][camMode];
}

function resize() {
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

/* ---------------------------------------------------------------------- UI */

function el(id) { return document.getElementById(id); }

function cacheUi() {
  ui.hudLevel = el('hudLevel');
  ui.hudScore = el('hudScore');
  ui.hudGnomes = el('hudGnomes');
  ui.hudHint = el('hudHint');
  ui.ammoRail = el('ammoRail');
  ui.power = el('powerFill');
  ui.readout = el('readout');
  ui.overlay = el('overlay');
  ui.overlayBody = el('overlayBody');
  ui.camBtn = el('camBtn');
  ui.soundBtn = el('soundBtn');
  ui.yaw = el('yawSlider');
}

function updateHud() {
  if (!game) return;
  var label = (currentSet === 'tots') ? 'Little Slinger ' : 'Level ';
  ui.hudLevel.textContent = label + (setPos + 1) + '/' + setLevels.length + ' — ' + game.def.name;
  var sc = game.score();
  ui.hudScore.textContent = (totalScore + sc.total).toLocaleString();
  if (game.mode === 'distance') {
    var target = game.def.targetDistance || 0;
    ui.hudGnomes.textContent = 'Best drive ' + game.bestDistance.toFixed(0) + ' m' +
      (target ? '  ·  beat ' + target + ' m' : '');
  } else {
    /* one mark per target, so a mixed level reads honestly */
    var dots = '';
    for (var i = 0; i < game.state.targets.length; i++) {
      var t = game.state.targets[i];
      dots += targetIsDown(t) ? '💥' : (t.tag === 'skittle' ? '🎳' : '🧙');
    }
    ui.hudGnomes.textContent = dots;
  }
  ui.hudHint.textContent = game.def.hint;

  updateReadout();
  renderAmmoRail();
}

/* cheap enough to run on every pointer move */
function updateReadout() {
  ui.power.style.width = Math.round(aimPower * 100) + '%';
  ui.readout.textContent = 'power ' + Math.round(aimPower * 100) + '%  ·  angle ' +
    Math.round(aimPitch) + '°  ·  aim ' + (aimYaw > 0 ? '+' : '') + Math.round(aimYaw) + '°';
  if (ui.yaw && parseFloat(ui.yaw.value) !== aimYaw) ui.yaw.value = aimYaw;
}

function renderAmmoRail() {
  var html = '';
  for (var i = 0; i < game.ammo.length; i++) {
    var t = thingById(game.ammo[i]);
    var sel = (game.ammo[i] === selectedAmmo && game.ammo.indexOf(selectedAmmo) === i) ? ' sel' : '';
    var foot = game.def.endless ? '∞' : (t.mass + ' kg');
    html += '<button class="ammo' + sel + '" data-i="' + i + '" title="' + t.blurb + '">' +
      '<span class="ai">' + t.icon + '</span><span class="an">' + t.name + '</span>' +
      '<span class="am">' + foot + '</span></button>';
  }
  if (!game.ammo.length) html = '<div class="empty">Out of things to sling</div>';
  ui.ammoRail.innerHTML = html;
  var btns = ui.ammoRail.querySelectorAll('.ammo');
  for (var k = 0; k < btns.length; k++) {
    btns[k].addEventListener('click', function () {
      selectedAmmo = game.ammo[parseInt(this.getAttribute('data-i'), 10)];
      refreshPile();
      updateHud();
    });
  }
}

function setOverlay(html) {
  if (!html) { ui.overlay.classList.remove('show'); return; }
  ui.overlayBody.innerHTML = html;
  ui.overlay.classList.add('show');
}

function starRow(n) {
  var s = '';
  for (var i = 0; i < 3; i++) s += '<span class="star' + (i < n ? ' on' : '') + '">★</span>';
  return s;
}

function showResult(won, sc) {
  var last = setPos === setLevels.length - 1;
  var tots = currentSet === 'tots';
  var range = game.mode === 'distance';
  var title = won
    ? (last ? (tots ? 'You knocked them ALL down!' : 'That is the lot!')
            : (range ? 'What a drive!' : (tots ? 'Crash! All gone!' : 'Tower down!')))
    : (range ? 'Out of balls' : 'Out of ammo');
  var pins = 0, gnomes = 0;
  for (var ti = 0; ti < game.state.targets.length; ti++) {
    if (game.state.targets[ti].tag === 'skittle') pins++; else gnomes++;
  }
  var targetWord = (pins && gnomes) ? 'Targets cleared'
    : (pins ? 'Pins knocked down' : 'Gnomes toppled');
  var tallyLines = range
    ? 'Best drive: <b>' + sc.distance.toFixed(1) + ' m</b><br>' +
      (game.def.targetDistance ? 'To beat: <b>' + game.def.targetDistance + ' m</b><br>' : '')
    : targetWord + ': <b>' + sc.popped + '/' + game.state.targets.length + '</b><br>' +
      'Blocks knocked over: <b>' + sc.toppled + '</b><br>';
  var body = '<h2>' + title + '</h2>' + '<div class="stars">' + starRow(sc.stars) + '</div>' +
    '<p class="tally">' + tallyLines +
    (sc.ammoBonus ? 'Ammo left over: <b>+' + sc.ammoBonus.toLocaleString() + '</b><br>' : '') +
    'Level score: <b>' + sc.total.toLocaleString() + '</b></p>';

  if (won && !last) {
    body += '<button class="big" id="nextBtn">' + (tots ? 'More blocks →' : 'Next level →') + '</button>' +
      '<button class="ghost" id="againBtn">Replay this one</button>';
  } else if (won && last) {
    body += '<p class="tally">Final score: <b>' + totalScore.toLocaleString() + '</b></p>' +
      '<button class="big" id="restartBtn">' + (tots ? 'Play them again' : 'Play again from level 1') + '</button>' +
      '<button class="ghost" id="swapBtn">' +
      (tots ? 'Try the big levels' : 'Try the Little Slinger levels') + '</button>';
  } else {
    body += '<button class="big" id="againBtn">Try again</button>' +
      '<button class="ghost" id="swapBtn">Little Slinger levels</button>';
  }
  setOverlay(body);

  var nb = el('nextBtn'), ab = el('againBtn'), rb = el('restartBtn');
  if (nb) nb.addEventListener('click', function () { startLevel(setLevels[setPos + 1]); });
  if (ab) ab.addEventListener('click', function () {
    if (phase === 'won') totalScore -= game.score().total;
    startLevel(levelIndex);
  });
  if (rb) rb.addEventListener('click', function () { startSet(currentSet); });
  var sb = el('swapBtn');
  if (sb) sb.addEventListener('click', function () {
    startSet(currentSet === 'tots' ? 'main' : 'tots');
  });
}

function showTitle() {
  setOverlay(
    '<h2>Sling Things</h2>' +
    '<p class="blurb">Load the slingshot, drag back, and let fly. Three towers of ' +
    'garden gnomes to flatten, then a driving range and a bowling alley.</p>' +
    '<ul class="keys">' +
    '<li><b>Drag</b> on the scene to pull the sling — back for power, down for a higher lob</li>' +
    '<li><b>Aim slider</b> (or ← →) swings the shot left and right</li>' +
    '<li><b>1–9</b> pick what to sling · <b>C</b> camera · <b>R</b> restart · <b>Space</b> full-power shot</li>' +
    '</ul>' +
    '<button class="big" id="startBtn">Start slinging</button>' +
    '<button class="big soft" id="totsBtn">Little Slinger</button>' +
    '<p class="blurb small">Little Slinger is for very small people: huge painted ' +
    'blocks, close to the sling, and the ammo never runs out.</p>'
  );
  el('startBtn').addEventListener('click', function () { initAudio(); startSet('main'); });
  el('totsBtn').addEventListener('click', function () { initAudio(); startSet('tots'); });
}

/* ------------------------------------------------------------------- boot */

var lastFrame = 0, accum = 0;

function boot() {
  cacheUi();
  if (typeof THREE === 'undefined') {
    setOverlay('<h2>Could not load three.js</h2><p class="blurb">' +
      'This page pulls three.js from a CDN. Check your connection and reload.</p>');
    return;
  }
  renderer = new THREE.WebGLRenderer({ antialias: !isSmallScreen() });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  el('stage').appendChild(renderer.domElement);

  buildScene();
  resize();
  bindInput();

  ui.camBtn.addEventListener('click', cycleCamera);
  ui.soundBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    ui.soundBtn.textContent = soundOn ? 'Sound: on' : 'Sound: off';
  });
  el('restartLevelBtn').addEventListener('click', function () { startLevel(levelIndex); });
  ui.yaw.addEventListener('input', function () {
    aimYaw = parseFloat(this.value);
    updateReadout();
  });

  /* a quiet demo level behind the title card */
  setLevels = levelsInSet('main');
  setPos = 0;
  game = new Game(0);
  for (var i = 0; i < game.state.blocks.length; i++) attachMesh(game.state.blocks[i], blockMesh(game.state.blocks[i]));
  for (i = 0; i < game.state.targets.length; i++) attachMesh(game.state.targets[i], gnomeMesh());
  selectedAmmo = game.ammo[0];
  refreshPile();
  updateHud();
  syncMeshes();
  phase = 'title';
  showTitle();

  running = true;
  lastFrame = performance.now();
  requestAnimationFrame(frame);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
</body>
</html>
