<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Farmer &amp; The Good Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#12160e;font-family:'Karla',system-ui,sans-serif;}

  #app{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 36%,#1d2415,#0e120b 78%);
    user-select:none;
  }

  #stage{
    position:relative;width:100%;max-width:780px;
    display:flex;flex-direction:column;align-items:center;padding:0 12px;
  }
  canvas{
    width:100%;height:auto;display:block;border-radius:8px;
    box-shadow:0 12px 48px rgba(0,0,0,0.62);background:#0e120b;
  }

  /* ---------- story text ---------- */
  #textwrap{
    width:100%;max-width:660px;padding:22px 20px 8px;min-height:132px;
    display:flex;align-items:flex-start;justify-content:center;
  }
  #text{
    font-size:clamp(16px,4.3vw,21px);line-height:1.62;color:#ece7d5;
    text-align:center;transition:opacity .16s ease;
    text-shadow:0 1px 10px rgba(0,0,0,0.5);
  }

  /* the three hens keep their colours in the words */
  #text .o{color:#e2793a;font-weight:700;text-shadow:0 0 12px rgba(226,121,58,0.32);}
  #text .y{color:#f0d271;font-weight:700;text-shadow:0 0 12px rgba(240,210,113,0.30);}
  #text .k{color:#93a5c8;font-weight:700;text-shadow:0 0 12px rgba(147,165,200,0.30);}
  /* the farmer's voice, and his spluttering */
  #text .fm{color:#f3c26a;font-style:italic;}
  #text .num{font-family:'Fraunces',serif;font-weight:800;font-size:1.14em;color:#fff3d2;}
  #text em{font-style:italic;}

  /* ---------- chrome ---------- */
  #counter{
    position:fixed;top:14px;left:0;right:0;text-align:center;
    font-size:11px;letter-spacing:0.20em;text-transform:uppercase;
    color:rgba(236,231,213,0.34);transition:opacity .3s ease;
  }
  #progress{
    display:flex;gap:6px;margin-top:14px;justify-content:center;flex-wrap:wrap;
    max-width:320px;transition:opacity .3s ease;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:rgba(236,231,213,0.20);transition:background .3s ease;}
  .dot.on{background:#f3c26a;}

  #fsBtn{
    position:fixed;top:10px;right:14px;z-index:11;
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;
    background:rgba(18,22,14,0.55);border:1px solid rgba(236,231,213,0.20);
    border-radius:7px;color:rgba(236,231,213,0.55);cursor:pointer;
    transition:color .2s,border-color .2s;padding:0;
  }
  #fsBtn:hover{color:#f3c26a;border-color:rgba(243,194,106,0.5);}
  #fsBtn svg{width:16px;height:16px;display:block;}
  :fullscreen #counter{padding-right:54px;}
  :-webkit-full-screen #counter{padding-right:54px;}

  #hint{
    position:fixed;bottom:16px;left:0;right:0;text-align:center;
    font-size:11px;letter-spacing:0.16em;text-transform:uppercase;
    color:rgba(236,231,213,0.26);
  }

  /* ---------- title / end ---------- */
  .screen{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:32px;
    background:radial-gradient(ellipse at 50% 44%,#26301a,#0d110a 76%);
    z-index:10;transition:opacity .5s ease;
  }
  .screen.hidden{opacity:0;pointer-events:none;}
  .screen h1{
    font-family:'Fraunces',serif;font-weight:800;
    font-size:clamp(34px,10vw,64px);line-height:1.0;color:#f6efd9;
    letter-spacing:-0.02em;font-variation-settings:'SOFT' 40,'WONK' 1;
  }
  .screen h1 em{font-style:italic;font-weight:400;color:#f3c26a;}
  .screen .sub{
    margin-top:18px;font-size:15px;letter-spacing:0.06em;
    color:rgba(246,239,217,0.62);max-width:30ch;
  }
  .screen .tap{
    margin-top:38px;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;
    color:rgba(243,194,106,0.72);animation:pulse 2.4s ease-in-out infinite;
  }
  .screen .tapback{
    position:absolute;bottom:26px;left:0;right:0;
    font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;
    color:rgba(246,239,217,0.40);
  }
  .sunmark{font-size:44px;margin-bottom:10px;}
  @keyframes pulse{0%,100%{opacity:0.45;}50%{opacity:1;}}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
  }
</style>
</head>
<body>

<button id="fsBtn" aria-label="Toggle fullscreen" title="Fullscreen">
  <svg id="fsIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
  </svg>
</button>

<div id="app">
  <div id="counter">1 / 1</div>
  <div id="stage">
    <canvas id="c" width="1000" height="640"></canvas>
    <div id="textwrap"><div id="text"></div></div>
    <div id="progress"></div>
  </div>
  <div id="hint">tap right to turn · tap left to go back</div>
</div>

<div class="screen" id="titleScreen">
  <div class="sunmark">&#9728;&#65039;</div>
  <h1>The Farmer<br>&amp; <em>The Good Light</em></h1>
  <div class="sub">a tale for anyone with too much to do</div>
  <div class="tap">tap to begin</div>
</div>

<div class="screen hidden" id="endScreen">
  <h1>The End</h1>
  <div class="sub">count it in the good light</div>
  <div class="tap">tap to read again</div>
  <div class="tapback">or tap left to turn back</div>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   1 · COLOUR + LIGHT MODEL
   A colour is multiplied by the light, washed toward the haze,
   then exposed. Every hue in the book runs through this.
   ============================================================ */
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function rgb2css(c){return 'rgb('+Math.max(0,Math.min(255,Math.round(c[0])))+','+Math.max(0,Math.min(255,Math.round(c[1])))+','+Math.max(0,Math.min(255,Math.round(c[2])))+')';}
function mixc(a,b,t){return [a[0]*(1-t)+b[0]*t, a[1]*(1-t)+b[1]*t, a[2]*(1-t)+b[2]*t];}

function lit(hex,L,extra){
  var c=hex2rgb(hex), k=hex2rgb(L.key);
  c=[c[0]*k[0]/255, c[1]*k[1]/255, c[2]*k[2]/255];
  c=mixc(c,hex2rgb(L.amb),L.wash);
  var e=L.exp*(extra===undefined?1:extra);
  return [c[0]*e,c[1]*e,c[2]*e];
}
function litCss(hex,L,extra){return rgb2css(lit(hex,L,extra));}

var HEN_BASE={orange:'#cc5a22', yellow:'#edd160', black:'#1e2130'};

/* how solid a hen stays on the day she is meant to disappear */
var HIDE_ALPHA=0.20;

var LIGHTS={
  morning:{
    key:'#fff8ea', amb:'#d8e6f0', wash:0.13, exp:1.03, hides:null,
    sky:['#4a86bd','#8dbfe0','#cde5f0'],
    ground:'#6f9438', groundDeep:'#3c5525', hedge:'#3d6b2c',
    sunX:0.19, sunY:0.11, sun:0.62
  },
  /* thin gold light on pale straw: the yellow hens become the morning */
  sunrise:{
    key:'#ffeec2', amb:'#efdca8', wash:0.26, exp:1.05, hides:'yellow',
    sky:['#8fb0c6','#e4d4a8','#f7e6ae'],
    ground:'#f2d96b', groundDeep:'#9c8640', hedge:'#6d6a4a',
    sunX:0.79, sunY:0.378, sun:0.42
  },
  /* high sun, no glare, no shadows: every hen exactly the colour she is */
  noon:{
    key:'#fffdf6', amb:'#cfe3f0', wash:0.10, exp:1.02, hides:null,
    sky:['#4e8fc4','#8fc2e2','#cfe6f2'],
    ground:'#7b9e4a', groundDeep:'#3f5a26', hedge:'#3d6b2c',
    sunX:0.50, sunY:0.09, sun:0.58
  },
  /* lamplight in a dark coop: the black hens are only more of the night */
  night:{
    key:'#ffb45a', amb:'#0e1119', wash:0.30, exp:0.55, hides:'black',
    sky:['#090b11','#0d1017','#131011'],
    ground:'#131011', groundDeep:'#08090c', hedge:'#171310',
    sunX:0.5, sunY:0.5, sun:0
  },
  /* the ground colour here is the lit orange hen, nudged — which is
     precisely why the orange hens stop existing */
  sunset:{
    key:'#ff8c3a', amb:'#c86a28', wash:0.22, exp:1.00, hides:'orange',
    sky:['#2b1f42','#8e3b28','#ff9a3e'],
    ground:'#db350c', groundDeep:'#93280b', hedge:'#3a2018',
    sunX:0.30, sunY:0.385, sun:0.88
  }
};

/* ============================================================
   2 · THE HEN
   facing right, feet at origin, about 40 units wide
   ============================================================ */
function drawHen(g,L,colourName,mode,t,seed,flip,opts){
  opts = opts || {};
  var A      = opts.alpha===undefined ? 1 : opts.alpha;
  var hidden = !!opts.hidden;

  var base=HEN_BASE[colourName];
  var baseLit = lit(base,L);
  var body   = litCss(base,L);
  var shade  = litCss(base,L,0.76);
  var high   = litCss(base,L,1.20);

  /* comb, beak and legs are the giveaways — pulled toward her body when hiding */
  var combRGB = lit('#c0392b',L, colourName==='black'?1.15:1.0);
  var beakRGB = lit('#e0a53c',L);
  var legRGB  = lit('#c9a06a',L,0.9);
  if(hidden){
    combRGB = mixc(combRGB, baseLit, 0.74);
    beakRGB = mixc(beakRGB, baseLit, 0.74);
    legRGB  = mixc(legRGB,  baseLit, 0.62);
  }
  var comb=rgb2css(combRGB), beak=rgb2css(beakRGB), leg=rgb2css(legRGB);

  var T=t*0.001+seed*6.3;
  var bob=Math.sin(T*2.1)*0.9;
  var peck = mode==='peck' ? Math.max(0,Math.sin(T*1.7)) : 0;
  var headDrop = peck*15;
  var headFwd  = peck*4;
  var step = mode==='walk' ? Math.sin(T*3.4)*3 : 0;
  var roost = mode==='roost';

  g.save();
  g.globalAlpha=A;
  if(flip){g.scale(-1,1);}

  var lift = roost ? -6 : 0;
  var by = -20+bob+lift;

  /* legs */
  if(!roost){
    g.strokeStyle=leg; g.lineWidth=2.2; g.lineCap='round';
    g.beginPath(); g.moveTo(-3,by+11); g.lineTo(-4+step,-1); g.stroke();
    g.beginPath(); g.moveTo(3,by+11);  g.lineTo(4-step,-1);  g.stroke();
    g.lineWidth=1.6;
    g.beginPath(); g.moveTo(-4+step,-1); g.lineTo(-8+step,0); g.moveTo(-4+step,-1); g.lineTo(0+step,0); g.stroke();
    g.beginPath(); g.moveTo(4-step,-1);  g.lineTo(0-step,0);  g.moveTo(4-step,-1);  g.lineTo(8-step,0);  g.stroke();
  }else{
    g.strokeStyle=leg; g.lineWidth=1.8; g.lineCap='round';
    g.beginPath(); g.moveTo(-4,by+11); g.lineTo(-5,1); g.moveTo(-5,1); g.lineTo(-8,3); g.moveTo(-5,1); g.lineTo(-2,3); g.stroke();
    g.beginPath(); g.moveTo(4,by+11);  g.lineTo(4,1);  g.moveTo(4,1);  g.lineTo(1,3);  g.moveTo(4,1);  g.lineTo(7,3);  g.stroke();
  }

  /* tail */
  g.fillStyle=shade;
  var tw = roost?0:Math.sin(T*1.3)*1.6;
  [[0,20,-6],[1,26,-13],[2,22,-21]].forEach(function(f){
    g.beginPath();
    g.moveTo(-13,by+2);
    g.quadraticCurveTo(-22-f[1]*0.30, by+f[2]*0.5+tw, -14-f[1]*0.55, by+f[2]-4+tw);
    g.quadraticCurveTo(-16-f[1]*0.22, by+f[2]*0.42+tw, -11,by+7);
    g.closePath(); g.fill();
  });

  /* body */
  g.fillStyle=body;
  g.beginPath(); g.ellipse(0,by,17,13.2,-0.13,0,Math.PI*2); g.fill();

  /* breast */
  g.fillStyle=high;
  g.beginPath(); g.ellipse(7,by+2.5,8.5,8,-0.2,0,Math.PI*2); g.fill();

  /* wing */
  g.fillStyle=shade;
  g.beginPath(); g.ellipse(-2.5,by-0.5,10.5,7,-0.16,0,Math.PI*2); g.fill();
  g.strokeStyle=litCss(base,L,0.6); g.lineWidth=0.9;
  g.beginPath(); g.ellipse(-2.5,by-0.5,10.5,7,-0.16,0,Math.PI*2); g.stroke();

  /* neck + head */
  var hx=13.5+headFwd, hy=by-15+headDrop;
  g.fillStyle=body;
  g.beginPath();
  g.moveTo(6,by-7);
  g.quadraticCurveTo(11,by-13, hx-4.5, hy+3);
  g.lineTo(hx+3, hy+5.5);
  g.quadraticCurveTo(13,by-6, 11,by+3);
  g.closePath(); g.fill();
  g.beginPath(); g.arc(hx,hy,6.3,0,Math.PI*2); g.fill();

  /* comb */
  g.fillStyle=comb;
  g.beginPath();
  g.moveTo(hx-4.5,hy-4.6);
  g.quadraticCurveTo(hx-4.0,hy-9.6, hx-1.4,hy-6.0);
  g.quadraticCurveTo(hx-0.4,hy-10.6, hx+1.8,hy-6.2);
  g.quadraticCurveTo(hx+3.2,hy-10.0, hx+4.6,hy-4.4);
  g.closePath(); g.fill();
  g.beginPath(); g.ellipse(hx+4.0,hy+5.2,2.0,3.1,0,0,Math.PI*2); g.fill();

  /* beak */
  g.fillStyle=beak;
  g.beginPath();
  g.moveTo(hx+5.4,hy+0.4); g.lineTo(hx+11.4,hy+2.1); g.lineTo(hx+5.4,hy+3.8);
  g.closePath(); g.fill();

  /* eye */
  if(hidden){
    g.fillStyle=rgb2css(mixc([14,12,10], baseLit, 0.55));
    g.beginPath(); g.arc(hx+2.0,hy-0.9,1.6,0,Math.PI*2); g.fill();
  }else{
    g.fillStyle='rgba(14,12,10,0.95)';
    g.beginPath(); g.arc(hx+2.0,hy-0.9,1.85,0,Math.PI*2); g.fill();
    g.fillStyle= L.exp<0.7 ? 'rgba(255,205,120,0.92)' : 'rgba(255,255,255,0.85)';
    g.beginPath(); g.arc(hx+2.7,hy-1.6,0.72,0,Math.PI*2); g.fill();
  }

  g.restore();
}

/* ============================================================
   2b · THE HEN, FRONT ON
   Same bird, turned to face you. Used when the flock stops
   wandering and stands there looking at him.
   ============================================================ */
function drawHenFront(g,L,colourName,t,seed,opts){
  /* opts.look: 'up' tilts the head back, 'down' drops it */
  opts = opts || {};
  var A      = opts.alpha===undefined ? 1 : opts.alpha;
  var hidden = !!opts.hidden;

  var base=HEN_BASE[colourName];
  var baseLit = lit(base,L);
  var body   = litCss(base,L);
  var shade  = litCss(base,L,0.76);
  var high   = litCss(base,L,1.20);

  var combRGB = lit('#c0392b',L, colourName==='black'?1.15:1.0);
  var beakRGB = lit('#e0a53c',L);
  var legRGB  = lit('#c9a06a',L,0.9);
  if(hidden){
    combRGB = mixc(combRGB, baseLit, 0.74);
    beakRGB = mixc(beakRGB, baseLit, 0.74);
    legRGB  = mixc(legRGB,  baseLit, 0.62);
  }
  var comb=rgb2css(combRGB), beak=rgb2css(beakRGB), leg=rgb2css(legRGB);

  var T=t*0.001+seed*6.3;
  var sway=Math.sin(T*1.7)*1.5;           /* a small unimpressed shuffle */
  var bob =Math.sin(T*2.3)*0.8;
  var tilt=Math.sin(T*0.6+seed)*0.05;

  g.save();
  g.globalAlpha=A;
  g.translate(sway*0.4,0);
  g.rotate(tilt*0.25);

  var by=-20+bob;

  /* legs */
  g.strokeStyle=leg; g.lineWidth=2.2; g.lineCap='round';
  g.beginPath(); g.moveTo(-5,by+11); g.lineTo(-6,-1); g.stroke();
  g.beginPath(); g.moveTo(5,by+11);  g.lineTo(6,-1);  g.stroke();
  g.lineWidth=1.6;
  [-6,6].forEach(function(fx){
    g.beginPath();
    g.moveTo(fx,-1); g.lineTo(fx-4,0);
    g.moveTo(fx,-1); g.lineTo(fx,0.6);
    g.moveTo(fx,-1); g.lineTo(fx+4,0);
    g.stroke();
  });

  /* tail just showing behind the shoulders */
  g.fillStyle=shade;
  g.beginPath(); g.ellipse(0,by-6,17,8,0,Math.PI,Math.PI*2); g.fill();

  /* body */
  g.fillStyle=body;
  g.beginPath(); g.ellipse(0,by,15,14,0,0,Math.PI*2); g.fill();

  /* wings tucked at the sides */
  g.fillStyle=shade;
  g.save(); g.translate(-12.5,by+1); g.rotate(-0.16+sway*0.02);
  g.beginPath(); g.ellipse(0,0,5.4,9.6,0,0,Math.PI*2); g.fill(); g.restore();
  g.save(); g.translate(12.5,by+1); g.rotate(0.16-sway*0.02);
  g.beginPath(); g.ellipse(0,0,5.4,9.6,0,0,Math.PI*2); g.fill(); g.restore();

  /* breast */
  g.fillStyle=high;
  g.beginPath(); g.ellipse(0,by+3,8.6,9,0,0,Math.PI*2); g.fill();

  /* neck + head — craned up at him, or dropped over an empty trough */
  var lookUp   = opts.look==='up'   ? 1 : 0;
  var lookDown = opts.look==='down' ? 1 : 0;
  var hy=by-19+sway*0.15 - lookUp*5 + lookDown*7;
  g.fillStyle=body;
  var nw = 4.4 + lookUp*0.6;
  g.beginPath();
  g.moveTo(-5,by-8); g.lineTo(-nw,hy+3); g.lineTo(nw,hy+3); g.lineTo(5,by-8);
  g.closePath(); g.fill();
  g.beginPath(); g.arc(0,hy,7,0,Math.PI*2); g.fill();

  /* comb */
  g.fillStyle=comb;
  g.beginPath();
  g.moveTo(-5,-5.2+hy);
  g.quadraticCurveTo(-4.4,-10.4+hy, -1.6,-6.8+hy);
  g.quadraticCurveTo(-0.4,-11.6+hy, 1.8,-7.0+hy);
  g.quadraticCurveTo(3.6,-10.8+hy, 5,-5.0+hy);
  g.closePath(); g.fill();
  /* wattles, one either side */
  g.beginPath(); g.ellipse(-3.2,hy+6.4,2.0,3.0,0,0,Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(3.2,hy+6.4,2.0,3.0,0,0,Math.PI*2); g.fill();

  /* beak — level, tipped up at him, or pointed at the empty trough */
  g.fillStyle=beak;
  g.beginPath();
  if(lookUp){
    g.moveTo(-3.2,hy-1.0); g.lineTo(3.2,hy-1.0); g.lineTo(0,hy-7.4);
  }else if(lookDown){
    g.moveTo(-3.0,hy+2.6); g.lineTo(3.0,hy+2.6); g.lineTo(0,hy+9.4);
  }else{
    g.moveTo(-3.2,hy+1.4); g.lineTo(3.2,hy+1.4); g.lineTo(0,hy+7.2);
  }
  g.closePath(); g.fill();

  /* both eyes — this is the whole point of the pose */
  if(hidden){
    g.fillStyle=rgb2css(mixc([14,12,10], baseLit, 0.55));
    g.beginPath(); g.arc(-3.4,hy-1.4,1.5,0,Math.PI*2); g.fill();
    g.beginPath(); g.arc(3.4,hy-1.4,1.5,0,Math.PI*2);  g.fill();
  }else{
    g.fillStyle='rgba(14,12,10,0.95)';
    g.beginPath(); g.arc(-3.4,hy-1.4,1.85,0,Math.PI*2); g.fill();
    g.beginPath(); g.arc(3.4,hy-1.4,1.85,0,Math.PI*2);  g.fill();
    g.fillStyle= L.exp<0.7 ? 'rgba(255,205,120,0.92)' : 'rgba(255,255,255,0.85)';
    g.beginPath(); g.arc(-4.0,hy-2.1,0.7,0,Math.PI*2); g.fill();
    g.beginPath(); g.arc(2.8,hy-2.1,0.7,0,Math.PI*2);  g.fill();
  }

  g.restore();
}

/* ============================================================
   3 · THE FARMER
   feet at origin, about 104 tall
   ============================================================ */
function drawFarmer(g,L,pose,t){
  var boot  = litCss('#4a3524',L);
  var trous = litCss('#3d5670',L);
  var shirt = litCss('#b8483a',L);
  var skin  = litCss('#c88f5f',L);
  var straw = litCss('#d9b45e',L);
  var slate = litCss('#2b2f33',L);
  var chalk = litCss('#e8e6d8',L);
  var wood  = litCss('#7a5c3a',L);

  var T=t*0.001;
  var breathe=Math.sin(T*1.6)*0.9;
  var lean = pose==='hurry' ? -0.16 : (pose==='laden' ? -0.11 : 0);
  var sit  = pose==='sit';
  var hipY = sit ? -40 : -52;

  g.save();
  if(lean){g.translate(0,-52);g.rotate(lean);g.translate(0,52);}

  /* legs */
  g.strokeStyle=trous; g.lineWidth=9; g.lineCap='round';
  if(sit){
    /* thigh along the rail, knee, shin hanging, ending exactly at the boot */
    g.beginPath(); g.moveTo(0,hipY); g.lineTo(19,hipY+1); g.lineTo(22,-13); g.stroke();
    g.beginPath(); g.moveTo(0,hipY); g.lineTo(13,hipY-2); g.lineTo(12,-13); g.stroke();
  }else if(pose==='hurry'||pose==='laden'){
    var st=Math.sin(T*3.2)*9;
    g.beginPath(); g.moveTo(0,hipY); g.lineTo(-3+st,-22); g.lineTo(-5+st*1.3,-4); g.stroke();
    g.beginPath(); g.moveTo(0,hipY); g.lineTo(4-st,-22);  g.lineTo(7-st*1.3,-4);  g.stroke();
  }else{
    g.beginPath(); g.moveTo(0,hipY); g.lineTo(-5,-26); g.lineTo(-6,-4); g.stroke();
    g.beginPath(); g.moveTo(0,hipY); g.lineTo(5,-26);  g.lineTo(6,-4);  g.stroke();
  }

  /* boots */
  g.fillStyle=boot;
  if(sit){
    /* boots hang from the shin ends: shin ends at y-13, boot tops reach it */
    g.beginPath(); g.ellipse(23,-9,7,5,0.10,0,Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(12,-9,7,5,0.06,0,Math.PI*2); g.fill();
  }else if(pose==='hurry'||pose==='laden'){
    var st2=Math.sin(T*3.2)*9;
    g.beginPath(); g.ellipse(-5+st2*1.3,-2,8,4.5,0,0,Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(7-st2*1.3,-2,8,4.5,0,0,Math.PI*2);  g.fill();
  }else{
    g.beginPath(); g.ellipse(-6,-2,8,4.5,0,0,Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(6,-2,8,4.5,0,0,Math.PI*2);  g.fill();
  }

  /* torso */
  var shY=hipY-30+breathe;
  g.fillStyle=shirt;
  g.beginPath();
  g.moveTo(-11,hipY+3);
  g.quadraticCurveTo(-13,shY+9, -9,shY);
  g.quadraticCurveTo(0,shY-4, 9,shY);
  g.quadraticCurveTo(13,shY+9, 11,hipY+3);
  g.quadraticCurveTo(0,hipY+7, -11,hipY+3);
  g.closePath(); g.fill();

  /* head */
  var hy=shY-13;
  g.fillStyle=skin;
  g.beginPath(); g.arc(0,hy,8.6,0,Math.PI*2); g.fill();
  g.fillStyle=litCss('#8d7a63',L);
  g.beginPath(); g.arc(0,hy+2.4,8.0,0.25,Math.PI-0.25); g.fill();
  g.fillStyle='rgba(20,16,12,0.9)';
  if(pose==='squint'){
    g.strokeStyle='rgba(20,16,12,0.9)'; g.lineWidth=1.5; g.lineCap='round';
    g.beginPath(); g.moveTo(-5,hy-2); g.lineTo(-1.5,hy-2); g.stroke();
    g.beginPath(); g.moveTo(1.5,hy-2); g.lineTo(5,hy-2);   g.stroke();
  }else{
    g.beginPath(); g.arc(-3.2,hy-2,1.5,0,Math.PI*2); g.fill();
    g.beginPath(); g.arc(3.2,hy-2,1.5,0,Math.PI*2);  g.fill();
  }
  if(pose==='silent'){
    /* the mouth, open, with nothing coming out of it */
    g.fillStyle='rgba(48,26,18,0.92)';
    g.beginPath(); g.ellipse(0,hy+4.6,2.6,3.4,0,0,Math.PI*2); g.fill();
  }

  /* straw hat */
  g.fillStyle=straw;
  g.beginPath(); g.ellipse(0,hy-6.5,19,4.6,0,0,Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(0,hy-11,9.4,7.2,0,Math.PI,Math.PI*2); g.fill();
  g.fillStyle=litCss('#a8823a',L);
  g.fillRect(-9.4,hy-8.4,18.8,2.2);

  /* arms + props */
  g.strokeStyle=shirt; g.lineWidth=6.4; g.lineCap='round';
  var aY=shY+6;

  if(pose==='hurry'){
    g.beginPath(); g.moveTo(-8,aY); g.lineTo(-19,aY+15); g.stroke();
    g.beginPath(); g.moveTo(8,aY);  g.lineTo(16,aY-9);   g.stroke();
    g.strokeStyle=wood; g.lineWidth=3.4;
    g.beginPath(); g.moveTo(24,aY-24); g.lineTo(-6,aY+12); g.stroke();
    g.strokeStyle=litCss('#8b9099',L); g.lineWidth=4.4;
    g.beginPath(); g.moveTo(24,aY-24); g.lineTo(31,aY-20); g.stroke();
  }
  else if(pose==='squint'){
    g.beginPath(); g.moveTo(-8,aY); g.lineTo(-15,aY+3); g.lineTo(-13,aY+16); g.stroke();
    g.beginPath(); g.moveTo(8,aY);  g.lineTo(14,aY-9);  g.lineTo(4,hy-9);    g.stroke();
    g.save(); g.translate(-15,aY+20); g.rotate(-0.16);
    g.fillStyle=slate; g.fillRect(-8,-6,16,13);
    g.strokeStyle=chalk; g.lineWidth=1.2; g.lineCap='round';
    g.beginPath(); g.moveTo(-4.5,-2); g.lineTo(-4.5,3); g.moveTo(-1.5,-2); g.lineTo(-1.5,3);
    g.moveTo(1.5,-2); g.lineTo(1.5,3); g.moveTo(-6,3.5); g.lineTo(3.5,-2.5); g.stroke();
    g.restore();
  }
  else if(pose==='sit'){
    g.beginPath(); g.moveTo(-8,aY); g.lineTo(-13,aY+13); g.lineTo(2,aY+21); g.stroke();
    g.beginPath(); g.moveTo(8,aY);  g.lineTo(15,aY+12);  g.lineTo(11,aY+22); g.stroke();
    g.save(); g.translate(13,aY+26); g.rotate(0.12);
    g.fillStyle=slate; g.fillRect(-9,-7,18,14);
    g.strokeStyle=chalk; g.lineWidth=1.3; g.lineCap='round';
    g.beginPath(); g.moveTo(-5,-2.5); g.lineTo(-5,3); g.moveTo(-2,-2.5); g.lineTo(-2,3);
    g.moveTo(1,-2.5); g.lineTo(1,3); g.moveTo(4,-2.5); g.lineTo(4,3); g.stroke();
    g.restore();
  }
  else if(pose==='laden'){
    /* bucket swinging in the near hand */
    var swing=Math.sin(T*3.2)*7;
    g.beginPath(); g.moveTo(-8,aY); g.lineTo(-17,aY+13); g.lineTo(-15+swing*0.3,aY+26); g.stroke();
    /* far arm clamped down over the tucked hen */
    g.beginPath(); g.moveTo(8,aY);  g.lineTo(18,aY+6);  g.lineTo(21,aY+19); g.stroke();

    /* the bucket */
    g.save(); g.translate(-15+swing*0.3, aY+30);
    g.fillStyle=litCss('#8b9099',L);
    g.beginPath();
    g.moveTo(-9,0); g.lineTo(-7,-15); g.lineTo(7,-15); g.lineTo(9,0); g.closePath(); g.fill();
    g.strokeStyle=litCss('#5d646d',L); g.lineWidth=1.6;
    g.beginPath(); g.arc(0,-15,7.4,Math.PI,0); g.stroke();
    g.restore();

    /* the hoe, over the shoulder, forgotten */
    g.strokeStyle=wood; g.lineWidth=3.6;
    g.beginPath(); g.moveTo(30,aY-30); g.lineTo(-2,aY+10); g.stroke();
    g.strokeStyle=litCss('#8b9099',L); g.lineWidth=4.6;
    g.beginPath(); g.moveTo(30,aY-30); g.lineTo(38,aY-26); g.stroke();
  }
  else{ /* stand — one hand resting on the gate, surveying */
    g.beginPath(); g.moveTo(-8,aY); g.lineTo(-14,aY+10); g.lineTo(-16,aY+20); g.stroke();
    g.beginPath(); g.moveTo(8,aY);  g.lineTo(15,aY+9);   g.lineTo(19,aY+18);  g.stroke();
  }

  g.restore();
}

/* ============================================================
   4 · SHARED SCENERY
   ============================================================ */
/* Soft focus without a per-frame blur filter, which is far too slow on a
   phone. Draw the scene into a small buffer and scale it up: the smoothing
   does the blurring, and it costs almost nothing. */
var _softBuf=null;
function softDraw(g,W,H,factor,drawFn){
  if(!_softBuf) _softBuf=document.createElement('canvas');
  var sw=Math.max(2,Math.round(W/factor)), sh=Math.max(2,Math.round(H/factor));
  if(_softBuf.width!==sw || _softBuf.height!==sh){ _softBuf.width=sw; _softBuf.height=sh; }
  var sg=_softBuf.getContext('2d');
  sg.setTransform(1,0,0,1,0,0);
  sg.clearRect(0,0,sw,sh);
  sg.save();
  sg.scale(1/factor,1/factor);
  drawFn(sg);
  sg.restore();

  g.save();
  g.imageSmoothingEnabled=true;
  if('imageSmoothingQuality' in g) g.imageSmoothingQuality='high';
  g.drawImage(_softBuf,0,0,sw,sh,0,0,W,H);
  g.restore();
}

function grain(g,W,H,a){
  g.save(); g.globalAlpha=a;
  for(var i=0;i<220;i++){
    var x=(i*137.51)%W, y=(i*311.7)%H;
    g.fillStyle= i%2 ? 'rgba(255,255,255,0.5)':'rgba(0,0,0,0.5)';
    g.fillRect(x,y,1.4,1.4);
  }
  g.restore();
}

function vignette(g,W,H,s){
  var vg=g.createRadialGradient(W/2,H/2,H*0.36,W/2,H/2,H*1.02);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,'+s+')');
  g.fillStyle=vg; g.fillRect(0,0,W,H);
}

function skyAndSun(g,W,H,L,hz,t){
  var sky=g.createLinearGradient(0,0,0,hz);
  sky.addColorStop(0,L.sky[0]); sky.addColorStop(0.62,L.sky[1]); sky.addColorStop(1,L.sky[2]);
  g.fillStyle=sky; g.fillRect(0,0,W,hz+2);

  if(L.sun>0){
    var sx=W*L.sunX, sy=H*L.sunY;
    var sg=g.createRadialGradient(sx,sy,2,sx,sy,H*0.62);
    sg.addColorStop(0,'rgba(255,247,214,'+(0.80*L.sun)+')');
    sg.addColorStop(0.20,'rgba(255,215,140,'+(0.34*L.sun)+')');
    sg.addColorStop(1,'rgba(255,200,120,0)');
    g.fillStyle=sg; g.fillRect(0,0,W,hz+50);
    g.fillStyle='rgba(255,252,232,'+(0.92*L.sun)+')';
    g.beginPath(); g.arc(sx,sy,H*0.042,0,Math.PI*2); g.fill();
  }
}

function clouds(g,W,H,t,list){
  g.fillStyle='rgba(255,255,255,0.76)';
  list.forEach(function(c,i){
    var drift=(t*0.0042*(0.5+i*0.28))%(W+300)-150;
    var cx=W*c[0]+drift, cy=H*c[1], r=c[2];
    g.beginPath();
    g.arc(cx,cy,r*0.60,0,Math.PI*2);
    g.arc(cx+r*0.58,cy+5,r*0.46,0,Math.PI*2);
    g.arc(cx-r*0.56,cy+6,r*0.40,0,Math.PI*2);
    g.arc(cx+r*0.10,cy-r*0.28,r*0.44,0,Math.PI*2);
    g.fill();
  });
}

function hedgerow(g,W,H,L,hz){
  /* two hill layers then the hedge */
  g.fillStyle=litCss('#7fa86a',L,0.92);
  g.beginPath(); g.moveTo(0,hz+2);
  g.quadraticCurveTo(W*0.22,hz-38, W*0.46,hz-6);
  g.quadraticCurveTo(W*0.70,hz-30, W,hz-4);
  g.lineTo(W,hz+14); g.lineTo(0,hz+14); g.closePath(); g.fill();

  g.fillStyle=L.hedge;
  g.beginPath(); g.moveTo(0,hz+4);
  for(var x=0;x<=W;x+=36){
    g.quadraticCurveTo(x+18,hz-13-((x*7)%15), x+36,hz+3);
  }
  g.lineTo(W,hz+20); g.lineTo(0,hz+20); g.closePath(); g.fill();
}

function ground(g,W,H,L,hz){
  var gr=g.createLinearGradient(0,hz,0,H);
  gr.addColorStop(0,L.ground); gr.addColorStop(0.72,L.ground); gr.addColorStop(1,L.groundDeep);
  g.fillStyle=gr; g.fillRect(0,hz,W,H-hz);

  g.strokeStyle=rgb2css(mixc(hex2rgb(L.ground),hex2rgb(L.groundDeep),0.42));
  g.lineWidth=2;
  for(var i=0;i<150;i++){
    var gx=(i*97.3)%W, gy=hz+16+((i*53.1)%(H-hz-20));
    var hgt=3+((i*29)%7);
    g.beginPath(); g.moveTo(gx,gy); g.lineTo(gx+2,gy-hgt); g.stroke();
  }
}

function fenceLine(g,W,H,L,fy,gapFrom,gapTo,gap2From,gap2To){
  g.strokeStyle=litCss('#6b4f33',L); g.lineCap='round';
  var g2a = gap2From===undefined ? 2 : gap2From;
  var g2b = gap2To===undefined ? 2 : gap2To;
  function seg(off,a,b){
    if(b<=a) return;
    g.beginPath(); g.moveTo(W*a,fy-off-a); g.lineTo(W*b,fy-off-b); g.stroke();
  }
  function rail(off){
    g.lineWidth=3.2;
    var stops=[[0,Math.min(gapFrom,g2a)],
               [Math.min(gapTo,g2b),Math.max(gapFrom,g2a)],
               [Math.max(gapTo,g2b),1]];
    stops.forEach(function(sg){ seg(off,Math.max(0,sg[0]),Math.min(1,sg[1])); });
  }
  rail(15); rail(7);
  g.lineWidth=4.6;
  for(var p=0;p<=W;p+=112){
    var q=p/W;
    if(q>gapFrom-0.02 && q<gapTo+0.02) continue;
    if(q>g2a-0.02 && q<g2b+0.02) continue;
    g.beginPath(); g.moveTo(p,fy-25); g.lineTo(p,fy+6); g.stroke();
  }
  /* the gate, standing open */
  g.lineWidth=4.6;
  g.beginPath(); g.moveTo(W*gapFrom,fy-26); g.lineTo(W*gapFrom,fy+6); g.stroke();
  g.beginPath(); g.moveTo(W*gapTo,fy-26);   g.lineTo(W*gapTo,fy+6);   g.stroke();
  g.save();
  g.translate(W*gapTo,fy+4); g.rotate(-0.42);
  g.lineWidth=2.6;
  g.beginPath(); g.moveTo(0,0); g.lineTo(0,-30); g.stroke();
  g.beginPath(); g.moveTo(0,-8);  g.lineTo(30,-8);  g.stroke();
  g.beginPath(); g.moveTo(0,-20); g.lineTo(30,-20); g.stroke();
  g.beginPath(); g.moveTo(0,-2);  g.lineTo(30,-26); g.stroke();
  g.beginPath(); g.moveTo(30,-2); g.lineTo(30,-28); g.stroke();
  g.restore();
}

function farmhouse(g,W,H,L,x,y,s,t,unfinished,litWindows){
  g.save(); g.translate(x,y); g.scale(s,s);

  /* barn behind, left */
  g.fillStyle=litCss('#9c4a34',L,0.86);
  g.fillRect(-96,-46,58,46);
  g.beginPath(); g.moveTo(-100,-46); g.lineTo(-67,-70); g.lineTo(-34,-46); g.closePath(); g.fill();
  g.fillStyle=litCss('#3a2a1e',L);
  g.fillRect(-80,-26,26,26);

  /* house */
  g.fillStyle=litCss('#e6dcc2',L);
  g.fillRect(-34,-52,74,52);

  if(unfinished){
    /* only the left half of the roof is on; bare rafters on the right */
    g.fillStyle=litCss('#6d4a34',L);
    g.beginPath(); g.moveTo(-40,-52); g.lineTo(3,-84); g.lineTo(3,-52); g.closePath(); g.fill();
    g.strokeStyle=litCss('#8a6a44',L); g.lineWidth=2.6; g.lineCap='round';
    for(var rf=0;rf<5;rf++){
      var rx=8+rf*9;
      g.beginPath(); g.moveTo(rx,-52); g.lineTo(3+ (rx-3)*0.06, -84 + (rx-3)*0.74); g.stroke();
    }
    g.beginPath(); g.moveTo(3,-84); g.lineTo(46,-52); g.stroke();
    /* ladder, leaning where he left it */
    g.save(); g.translate(52,0); g.rotate(0.30);
    g.strokeStyle=litCss('#a8823a',L); g.lineWidth=2.6;
    g.beginPath(); g.moveTo(-5,0); g.lineTo(-5,-62); g.stroke();
    g.beginPath(); g.moveTo(5,0);  g.lineTo(5,-62);  g.stroke();
    g.lineWidth=2;
    for(var rr=1;rr<7;rr++){ g.beginPath(); g.moveTo(-5,-rr*9); g.lineTo(5,-rr*9); g.stroke(); }
    g.restore();
  }else{
    g.fillStyle=litCss('#6d4a34',L);
    g.beginPath(); g.moveTo(-40,-52); g.lineTo(3,-84); g.lineTo(46,-52); g.closePath(); g.fill();
  }

  /* door + windows */
  g.fillStyle=litCss('#4a3524',L);
  g.fillRect(-6,-24,18,24);
  if(litWindows){
    g.fillStyle=litCss('#ffd98a',L,1.5);
    g.fillRect(-26,-42,16,14);
    g.fillRect(20,-42,16,14);
    g.save(); g.globalAlpha=0.30; g.fillStyle='#ffce7a';
    g.beginPath(); g.arc(-18,-35,20,0,Math.PI*2); g.fill();
    g.beginPath(); g.arc(28,-35,20,0,Math.PI*2); g.fill();
    g.restore();
  }else{
    g.fillStyle=litCss('#8fc4dd',L);
    g.fillRect(-26,-42,16,14);
    g.fillRect(20,-42,16,14);
  }
  g.strokeStyle=litCss('#4a3524',L); g.lineWidth=1.4;
  g.strokeRect(-26,-42,16,14); g.strokeRect(20,-42,16,14);

  /* chimney + a thread of smoke (on the finished side of the roof) */
  {
    var cx = unfinished ? -20 : 22;
    g.fillStyle=litCss('#9c8878',L);
    g.fillRect(cx,-80,11,20);
    g.strokeStyle='rgba(240,240,235,'+(litWindows?0.55:0.42)+')';
    g.lineWidth=3; g.lineCap='round';
    g.beginPath(); g.moveTo(cx+5,-82);
    for(var i=1;i<=4;i++){
      g.lineTo(cx+5+Math.sin(t*0.0011+i*0.9)*7*i*0.5, -82-i*13);
    }
    g.stroke();
  }

  g.restore();
}

function feeder(g,W,H,L,x,y,s,full){
  /* a galvanised hanging feeder: steel cylinder, cone lid, round tray,
     wire carry handle — the kind he'd actually have. base sits at (0,0). */
  g.save(); g.translate(x,y); g.scale(s,s);

  var steel  = litCss('#b4bac2',L);
  var steelD = litCss('#868e99',L);
  var steelB = litCss('#e2e8ee',L);
  var wire   = litCss('#9aa2ac',L);

  g.fillStyle='rgba(0,0,0,0.18)';
  g.beginPath(); g.ellipse(0,2,34,7,0,0,Math.PI*2); g.fill();

  /* wire carry handle, arcing over the top */
  g.strokeStyle=wire; g.lineWidth=2.6; g.lineCap='round';
  g.beginPath();
  g.moveTo(-19,-52);
  g.quadraticCurveTo(-24,-88, 0,-92);
  g.quadraticCurveTo(24,-88, 19,-52);
  g.stroke();

  /* the tray: a shallow round pan with a lip */
  g.fillStyle=steelD;
  g.beginPath(); g.ellipse(0,-3,31,9,0,0,Math.PI*2); g.fill();
  g.fillStyle=steel;
  g.beginPath(); g.ellipse(0,-6,31,9,0,0,Math.PI*2); g.fill();
  g.fillStyle=steelD;
  g.beginPath(); g.ellipse(0,-6,26,7,0,0,Math.PI*2); g.fill();

  /* grain in the tray, when there is any */
  if(full){
    g.fillStyle=litCss('#e8c877',L);
    g.beginPath(); g.ellipse(0,-6.5,24,6,0,0,Math.PI*2); g.fill();
    g.fillStyle=litCss('#c9a44f',L);
    [[-16,-6,2.2],[-7,-4.5,2.0],[3,-7,2.2],[12,-5,1.9],[18,-7,1.7]].forEach(function(k){
      g.beginPath(); g.ellipse(k[0],k[1],k[2],k[2]*0.7,0,0,Math.PI*2); g.fill();
    });
  }

  /* the cylinder body */
  g.fillStyle=steel;
  g.fillRect(-17,-56,34,49);
  /* rounded shading: dark edges, bright vertical highlight */
  var grad=g.createLinearGradient(-17,0,17,0);
  grad.addColorStop(0, litCss('#7e8791',L));
  grad.addColorStop(0.30, litCss('#c8ced6',L));
  grad.addColorStop(0.45, steelB);
  grad.addColorStop(0.62, litCss('#aab0ba',L));
  grad.addColorStop(1, litCss('#767f8a',L));
  g.fillStyle=grad;
  g.fillRect(-17,-56,34,49);
  /* base rim of the cylinder */
  g.fillStyle=steelD;
  g.beginPath(); g.ellipse(0,-8,17,4.5,0,0,Math.PI*2); g.fill();

  /* the conical lid, overhanging */
  g.fillStyle=litCss('#c2c8d0',L);
  g.beginPath();
  g.moveTo(-23,-56); g.lineTo(0,-76); g.lineTo(23,-56);
  g.quadraticCurveTo(0,-61, -23,-56);
  g.closePath(); g.fill();
  g.fillStyle=litCss('#98a0aa',L);
  g.beginPath();
  g.moveTo(2,-74.5); g.lineTo(23,-56);
  g.quadraticCurveTo(10,-58.6, 0,-59.4);
  g.closePath(); g.fill();
  /* the little wire loop on the peak */
  g.strokeStyle=wire; g.lineWidth=2.2;
  g.beginPath();
  g.moveTo(-4,-76); g.quadraticCurveTo(0,-86, 4,-76);
  g.stroke();

  g.restore();
}

function grainSack(g,W,H,L,x,y,s,t,fullness){
  var f = fullness===undefined ? 1 : fullness;
  g.save(); g.translate(x,y); g.scale(s,s);

  var hgt = 62*(0.34+0.66*f);          /* a near-empty sack slumps */
  var wid = 32*(0.62+0.38*f);
  var neck = -hgt-4;

  g.fillStyle='rgba(0,0,0,0.20)';
  g.beginPath(); g.ellipse(2,2,wid*1.22,8,0,0,Math.PI*2); g.fill();

  /* body of the sack */
  g.fillStyle=litCss('#c8ac7c',L);
  g.beginPath();
  g.moveTo(-wid,0);
  g.bezierCurveTo(-wid*1.24,-hgt*0.48, -wid*0.94,-hgt*0.90, -wid*0.38,neck+4);
  g.bezierCurveTo(-wid*0.19,neck-4, wid*0.19,neck-4, wid*0.38,neck+4);
  g.bezierCurveTo(wid*0.94,-hgt*0.90, wid*1.24,-hgt*0.48, wid,0);
  g.closePath(); g.fill();

  /* shading down one side */
  g.fillStyle=litCss('#a98d61',L);
  g.beginPath();
  g.moveTo(wid*0.38,neck+4);
  g.bezierCurveTo(wid*0.94,-hgt*0.90, wid*1.24,-hgt*0.48, wid,0);
  g.lineTo(wid*0.44,0);
  g.bezierCurveTo(wid*0.62,-hgt*0.45, wid*0.50,-hgt*0.76, wid*0.19,neck+6);
  g.closePath(); g.fill();

  /* slack folds, only when it's going empty */
  if(f<0.55){
    g.strokeStyle=litCss('#a98d61',L); g.lineWidth=1.6; g.lineCap='round';
    g.beginPath(); g.moveTo(-wid*0.72,-hgt*0.30); g.quadraticCurveTo(0,-hgt*0.44, wid*0.66,-hgt*0.26); g.stroke();
    g.beginPath(); g.moveTo(-wid*0.60,-hgt*0.56); g.quadraticCurveTo(0,-hgt*0.68, wid*0.54,-hgt*0.52); g.stroke();
  }

  /* tied neck, flopping over when there's nothing to hold it up */
  g.strokeStyle=litCss('#7a5c3a',L); g.lineWidth=3.2; g.lineCap='round';
  g.beginPath(); g.moveTo(-wid*0.42,neck+3); g.lineTo(wid*0.42,neck+3); g.stroke();
  g.fillStyle=litCss('#d8c096',L);
  g.save();
  if(f<0.55){ g.translate(0,neck+2); g.rotate(-0.55); g.translate(0,-(neck+2)); }
  g.beginPath();
  g.moveTo(-wid*0.38,neck+2); g.lineTo(-wid*0.52,neck-14); g.lineTo(0,neck-8);
  g.lineTo(wid*0.52,neck-14); g.lineTo(wid*0.38,neck+2);
  g.closePath(); g.fill();
  g.restore();

  /* a last few grains spilled at the foot */
  g.fillStyle=litCss('#e8c877',L);
  [[-wid-6,-2,3.6],[-wid-13,1,2.8],[wid+6,0,3.0],[wid+13,2,2.3],[-wid+3,3,2.2]].forEach(function(k){
    g.beginPath(); g.ellipse(k[0],k[1],k[2],k[2]*0.6,0,0,Math.PI*2); g.fill();
  });

  g.restore();
}

/* A chalk slate. Everything is laid out from the board's own bottom edge
   so the label, the underline, the number and the tallies can't collide.
   `ghosts` are earlier answers, rubbed out but never quite gone. */
function chalkBoard(g,L,x,y,s,label,value,opts){
  opts = opts || {};
  var w = opts.w || 80, h = opts.h || 60;
  g.save(); g.translate(x,y); g.scale(s,s);

  g.fillStyle=litCss('#2b2f33',L);
  g.fillRect(-w/2,-h,w,h);
  g.strokeStyle=litCss('#7a5c3a',L); g.lineWidth=3.6;
  g.strokeRect(-w/2,-h,w,h);

  var chalk=litCss('#e8e6d8',L);
  g.textAlign='center';
  g.textBaseline='alphabetic';

  var labelBase = -h + 16;
  var ruleY     = -h + 21;
  var numBase   = opts.tallies ? -h*0.34 : -h*0.13;

  /* rubbed-out earlier answers, ghosting behind the current one */
  if(opts.ghosts && opts.ghosts.length){
    g.save();
    g.globalAlpha=0.20;
    g.fillStyle=chalk;
    g.font='800 '+(opts.numSize||34)+'px "Fraunces", Georgia, serif';
    opts.ghosts.forEach(function(gh,i){
      var off=(i-(opts.ghosts.length-1)/2)*20;
      g.save(); g.translate(off,0); g.rotate((i%2?1:-1)*0.13);
      g.fillText(String(gh),0,numBase);
      g.restore();
    });
    g.globalAlpha=0.12;
    g.strokeStyle=chalk; g.lineWidth=7; g.lineCap='round';
    g.beginPath();
    g.moveTo(-w*0.36,numBase-9); g.quadraticCurveTo(0,numBase-16, w*0.36,numBase-6);
    g.stroke();
    g.restore();
  }

  g.fillStyle=chalk;
  g.font='700 '+(opts.labelSize||11.5)+'px "Karla", system-ui, sans-serif';
  g.fillText(label, 0, labelBase);

  g.font='800 '+(opts.numSize||34)+'px "Fraunces", Georgia, serif';
  g.fillText(String(value), 0, numBase);

  /* wobbly chalk underline, tucked under the label and clear of the number */
  g.strokeStyle=chalk; g.lineWidth=1.5; g.lineCap='round';
  g.beginPath();
  g.moveTo(-w*0.32, ruleY);
  g.quadraticCurveTo(0, ruleY-2.5, w*0.32, ruleY+0.5);
  g.stroke();

  /* days as strokes as well, so it reads before he can read */
  if(opts.tallies){
    var total=opts.tallies.total, struck=opts.tallies.struck;
    var gap=15, y0=-h*0.14;
    g.lineCap='round';
    for(var i=0;i<total;i++){
      var sx=-((total-1)/2)*gap + i*gap;
      g.globalAlpha = i<struck ? 0.28 : 1;
      g.lineWidth=2.6;
      g.beginPath(); g.moveTo(sx,y0-11); g.lineTo(sx,y0); g.stroke();
      if(i<struck){
        g.globalAlpha=0.52; g.lineWidth=2.2;
        g.beginPath(); g.moveTo(sx-6,y0-1); g.lineTo(sx+6,y0-10); g.stroke();
      }
    }
    g.globalAlpha=1;
  }

  g.restore();
}

/* the post by the feeder: what he owes the chickens, and how long he has */
function signPost(g,L,x,y,s,chickens,days,ghosts){
  g.save(); g.translate(x,y); g.scale(s,s);

  g.fillStyle='rgba(0,0,0,0.18)';
  g.beginPath(); g.ellipse(0,1,15,4,0,0,Math.PI*2); g.fill();
  g.strokeStyle=litCss('#6b4f33',L); g.lineWidth=6.4; g.lineCap='round';
  g.beginPath(); g.moveTo(0,0); g.lineTo(0,-74); g.stroke();

  g.save(); g.rotate(-0.045);
  chalkBoard(g,L,0,-140,1,'CHICKENS',chickens,{w:80,h:60,ghosts:ghosts});
  g.restore();

  g.save(); g.rotate(0.055);
  chalkBoard(g,L,0,-66,1,'DAYS LEFT',days,{
    w:76, h:66, numSize:26, labelSize:10.5,
    tallies:{total:3, struck:3-days}
  });
  g.restore();

  g.restore();
}

/* A cow who has been waiting to be milked for some time.
   Big head, small body — cartoon proportions, not livestock ones. */
function drawCow(g,L,t,lying){
  var hide  = litCss('#f0e9dc',L);
  var hideS = litCss('#d3c9b8',L);
  var patch = litCss('#3a332c',L);
  var pink  = litCss('#e0a8a4',L);
  var hoof  = litCss('#2e2620',L);
  var horn  = litCss('#d8c49a',L);

  var T=t*0.001;
  var chew=Math.sin(T*3.1)*1.6;
  var tail=Math.sin(T*1.5)*11;
  var ear =Math.sin(T*2.2)*0.10;
  var blink = Math.sin(T*0.62)>0.975;

  if(lying) g.translate(0,28);

  /* --- far pair of legs, slightly darker --- */
  if(!lying){
  g.strokeStyle=hideS; g.lineWidth=9; g.lineCap='round';
  g.beginPath(); g.moveTo(-14,-46); g.lineTo(-16,-4); g.stroke();
  g.beginPath(); g.moveTo(30,-42);  g.lineTo(33,-4);  g.stroke();
  g.strokeStyle=hoof; g.lineWidth=9.4;
  g.beginPath(); g.moveTo(-16,-7); g.lineTo(-16,-2); g.stroke();
  g.beginPath(); g.moveTo(33,-7);  g.lineTo(33,-2);  g.stroke();

  }

  /* --- tail --- */
  g.strokeStyle=hide; g.lineWidth=4.4;
  g.beginPath(); g.moveTo(40,-62); g.quadraticCurveTo(52,-44, 46+tail*0.4,-20); g.stroke();
  g.fillStyle=patch;
  g.beginPath(); g.ellipse(46+tail*0.4,-16,4.6,7,tail*0.02,0,Math.PI*2); g.fill();

  /* --- body: short and round --- */
  g.fillStyle=hide;
  g.beginPath(); g.ellipse(12,-58,36,25,0,0,Math.PI*2); g.fill();

  /* patches */
  g.fillStyle=patch;
  g.beginPath(); g.ellipse(24,-66,14,10.5,-0.28,0,Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(0,-50,9.5,7,0.34,0,Math.PI*2); g.fill();

  /* udder */
  g.fillStyle=pink;
  g.beginPath(); g.ellipse(14,-36,12,8.5,0,0,Math.PI*2); g.fill();

  /* --- near pair of legs, or folded under her --- */
  if(lying){
    g.fillStyle=hide;
    g.beginPath(); g.ellipse(-2,-32,20,9,-0.06,0,Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(26,-32,15,8,0.05,0,Math.PI*2); g.fill();
    g.fillStyle=hoof;
    g.beginPath(); g.ellipse(-17,-31,5.4,4,0,0,Math.PI*2); g.fill();
  }else{
    g.strokeStyle=hide; g.lineWidth=9.6; g.lineCap='round';
    g.beginPath(); g.moveTo(-4,-38); g.lineTo(-6,-4); g.stroke();
    g.beginPath(); g.moveTo(22,-38); g.lineTo(24,-4); g.stroke();
    g.strokeStyle=hoof; g.lineWidth=10;
    g.beginPath(); g.moveTo(-6,-7); g.lineTo(-6,-2); g.stroke();
    g.beginPath(); g.moveTo(24,-7); g.lineTo(24,-2); g.stroke();
  }

  /* --- neck: short and thick, head sits low and forward --- */
  var hcx=-37, hcy=-60+chew;
  g.fillStyle=hide;
  g.beginPath();
  g.moveTo(-14,-76);
  g.quadraticCurveTo(-34,-78, hcx+4,hcy-14);
  g.lineTo(hcx+8,hcy+16);
  g.quadraticCurveTo(-26,-44, -12,-46);
  g.closePath(); g.fill();

  /* --- ears, out to the sides --- */
  g.fillStyle=hideS;
  g.save(); g.translate(hcx-16,hcy-16); g.rotate(-0.75+ear);
  g.beginPath(); g.ellipse(0,0,13,6.4,0,0,Math.PI*2); g.fill();
  g.restore();
  g.save(); g.translate(hcx+19,hcy-17); g.rotate(0.62-ear);
  g.beginPath(); g.ellipse(0,0,12,6,0,0,Math.PI*2); g.fill();
  g.restore();

  /* --- horns --- */
  g.strokeStyle=horn; g.lineWidth=4.4; g.lineCap='round';
  g.beginPath(); g.moveTo(hcx-8,hcy-19); g.quadraticCurveTo(-12+hcx,hcy-27, hcx-6,hcy-30); g.stroke();
  g.beginPath(); g.moveTo(hcx+9,hcy-19); g.quadraticCurveTo(13+hcx,hcy-27, hcx+7,hcy-30); g.stroke();

  /* --- head: big --- */
  g.fillStyle=hide;
  g.beginPath(); g.ellipse(hcx,hcy,21,19.5,0,0,Math.PI*2); g.fill();

  /* a patch over one eye, because it's funnier */
  g.fillStyle=patch;
  g.beginPath(); g.ellipse(hcx+9,hcy-7,9,7.5,-0.25,0,Math.PI*2); g.fill();

  /* muzzle */
  g.fillStyle=pink;
  g.beginPath(); g.ellipse(hcx-6,hcy+11,15,11,-0.06,0,Math.PI*2); g.fill();
  g.fillStyle=litCss('#b8807c',L);
  g.beginPath(); g.ellipse(hcx-11,hcy+9,2.4,3.2,-0.2,0,Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(hcx-1,hcy+11,2.4,3.2,-0.2,0,Math.PI*2); g.fill();
  /* a slow chewing mouth */
  g.strokeStyle=litCss('#b8807c',L); g.lineWidth=1.8; g.lineCap='round';
  g.beginPath(); g.moveTo(hcx-9,hcy+18+chew*0.5); g.lineTo(hcx+1,hcy+18-chew*0.5); g.stroke();

  /* --- eyes: large, patient, faintly accusing --- */
  [[hcx-8,hcy-6],[hcx+8,hcy-8]].forEach(function(e,i){
    g.fillStyle='#f6f2e8';
    g.beginPath(); g.ellipse(e[0],e[1],5.6,blink?1.1:5.9,0,0,Math.PI*2); g.fill();
    if(!blink){
      g.fillStyle='rgba(20,16,12,0.94)';
      g.beginPath(); g.arc(e[0]-1.4,e[1]+0.6,3.1,0,Math.PI*2); g.fill();
      g.fillStyle='rgba(255,255,255,0.9)';
      g.beginPath(); g.arc(e[0]-2.4,e[1]-0.9,1.15,0,Math.PI*2); g.fill();
    }
    /* lashes on the far eye only, so it doesn't get busy */
    if(i===0 && !blink){
      g.strokeStyle='rgba(20,16,12,0.75)'; g.lineWidth=1.3;
      g.beginPath(); g.moveTo(e[0]-6,e[1]-4.6); g.lineTo(e[0]-8.4,e[1]-7); g.stroke();
      g.beginPath(); g.moveTo(e[0]-2.6,e[1]-6); g.lineTo(e[0]-3.4,e[1]-9); g.stroke();
    }
  });
}

/* a section of fence that has given up */
function brokenFence(g,L,x,y,s){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.strokeStyle=litCss('#6b4f33',L); g.lineCap='round';

  /* one post still standing, one leaning, one flat */
  g.lineWidth=5;
  g.beginPath(); g.moveTo(-52,6); g.lineTo(-52,-34); g.stroke();
  g.save(); g.translate(6,6); g.rotate(0.42);
  g.beginPath(); g.moveTo(0,0); g.lineTo(0,-34); g.stroke();
  g.restore();

  /* rails, one snapped and hanging */
  g.lineWidth=3.4;
  g.beginPath(); g.moveTo(-78,-26); g.lineTo(-46,-27); g.stroke();
  g.beginPath(); g.moveTo(-78,-14); g.lineTo(-40,-15); g.stroke();
  g.beginPath(); g.moveTo(-46,-27); g.lineTo(4,-8); g.stroke();

  /* a rail lying in the grass */
  g.lineWidth=3.6;
  g.beginPath(); g.moveTo(14,2); g.lineTo(72,-4); g.stroke();
  g.lineWidth=2.6;
  g.beginPath(); g.moveTo(20,7); g.lineTo(66,9); g.stroke();
  g.restore();
}

/* The tractor. state: 'dead' (won't start, bonnet up), 'parts' (wheel off,
   pieces everywhere), 'run' (going at last, hauling the grain home). */
function drawTractor(g,L,x,y,s,state,t){
  g.save(); g.translate(x,y); g.scale(s,s);
  var T=t*0.001;
  var body=litCss('#4a7a3c',L), bodyD=litCss('#33582a',L);
  var tyre=litCss('#2e2b28',L), hub=litCss('#d9b45e',L);
  var metal=litCss('#8b9099',L);

  g.fillStyle='rgba(0,0,0,0.18)';
  g.beginPath(); g.ellipse(4,2,58,8,0,0,Math.PI*2); g.fill();

  /* rear wheel (big, right) */
  function wheel(wx,wy,r){
    g.fillStyle=tyre;
    g.beginPath(); g.arc(wx,wy,r,0,Math.PI*2); g.fill();
    g.fillStyle=hub;
    g.beginPath(); g.arc(wx,wy,r*0.44,0,Math.PI*2); g.fill();
    g.fillStyle=bodyD;
    g.beginPath(); g.arc(wx,wy,r*0.14,0,Math.PI*2); g.fill();
  }
  wheel(26,-24,24);
  if(state==='parts'){
    /* front wheel is off, leaning against the body */
    g.save(); g.translate(-46,-13); g.rotate(0.5); wheel(0,0,13); g.restore();
  }else{
    wheel(-28,-13,13);
  }

  /* body + nose */
  g.fillStyle=body;
  g.beginPath();
  g.moveTo(-40,-24); g.lineTo(6,-24); g.lineTo(6,-46); g.lineTo(-12,-46);
  g.lineTo(-40,-38); g.closePath(); g.fill();
  g.fillStyle=bodyD;
  g.fillRect(-40,-28,46,4);

  /* seat + wheel arch + steering */
  g.fillStyle=bodyD;
  g.beginPath(); g.arc(26,-24,27,Math.PI*1.05,Math.PI*1.95); g.lineTo(26,-24); g.closePath(); g.fill();
  g.fillStyle=body;
  g.beginPath(); g.moveTo(10,-50); g.lineTo(20,-50); g.lineTo(22,-42); g.lineTo(8,-42); g.closePath(); g.fill();
  g.strokeStyle=metal; g.lineWidth=2.4; g.lineCap='round';
  g.beginPath(); g.moveTo(4,-46); g.lineTo(-2,-56); g.stroke();
  g.fillStyle=tyre;
  g.beginPath(); g.ellipse(-3,-57,5,2.2,-0.5,0,Math.PI*2); g.fill();

  /* exhaust stack */
  g.strokeStyle=metal; g.lineWidth=3.6;
  g.beginPath(); g.moveTo(-22,-46); g.lineTo(-22,-64); g.stroke();

  if(state==='dead' || state==='parts'){
    /* bonnet propped open */
    g.fillStyle=body;
    g.save(); g.translate(-40,-38); g.rotate(-0.85);
    g.fillRect(0,-4,26,5);
    g.restore();
    g.strokeStyle=metal; g.lineWidth=2;
    g.beginPath(); g.moveTo(-38,-40); g.lineTo(-33,-52); g.stroke();
    /* one sad grey putt from the stack */
    var ph=(T*0.30)%1;
    g.globalAlpha=(1-ph)*0.25;
    g.fillStyle='#c8c8c4';
    g.beginPath(); g.arc(-22,-68-ph*8,4+ph*4,0,Math.PI*2); g.fill();
    g.globalAlpha=1;
  }
  if(state==='parts'){
    /* pieces laid out in the grass */
    g.fillStyle=metal;
    g.fillRect(-72,-6,14,4);
    g.beginPath(); g.arc(-84,-4,4.5,0,Math.PI*2); g.fill();
    g.strokeStyle=metal; g.lineWidth=3;
    g.beginPath(); g.moveTo(-60,-14); g.lineTo(-50,-8); g.stroke();
    g.strokeStyle=litCss('#7a5c3a',L); g.lineWidth=3;
    g.beginPath(); g.moveTo(-92,-2); g.lineTo(-78,-12); g.stroke();
  }
  if(state==='run'){
    /* alive: proper puffs, and the grain coming home behind it */
    for(var d=0;d<3;d++){
      var ph2=(T*0.7+d*0.33)%1;
      g.globalAlpha=(1-ph2)*0.4;
      g.fillStyle='#eceae2';
      g.beginPath(); g.arc(-22-ph2*8,-68-ph2*22,4+ph2*8,0,Math.PI*2); g.fill();
    }
    g.globalAlpha=1;
    /* the cart, hitched, with two full sacks */
    g.strokeStyle=litCss('#5d4530',L); g.lineWidth=3;
    g.beginPath(); g.moveTo(48,-22); g.lineTo(62,-22); g.stroke();
    g.fillStyle=litCss('#8a6a44',L);
    g.fillRect(62,-38,54,18);
    wheel(89,-16,10);
    g.fillStyle=litCss('#c8ac7c',L);
    g.beginPath(); g.ellipse(78,-42,10,9,0,0,Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(99,-42,10,9,0,0,Math.PI*2); g.fill();
  }
  g.restore();
}

/* what's left in the store: n full sacks, leaning together.
   three on day one, two on day two, one on day three, none after. */
function sackRow(g,L,x,y,n,t){
  for(var i=0;i<n;i++){
    var ox=(i-(n-1)/2)*58;
    grainSack(g,0,0,L, x+ox, y-(i%2)*5, 1.7, t, 1);
  }
}

}

/* a wheelbarrow he tipped over and left */
function wheelbarrow(g,L,x,y,s){

  g.fillStyle=litCss('#8b9099',L);
  g.beginPath(); g.arc(24,-26,3.4,0,Math.PI*2); g.fill();

  /* what was in it, now on the grass */

  [[-30,-2,7],[-19,1,5.4],[-38,2,4.4],[-9,2,4]].forEach(function(k){
    g.beginPath(); g.ellipse(k[0],k[1],k[2],k[2]*0.62,0,0,Math.PI*2); g.fill();
  });
  g.restore();
}

/* washing he put out and never brought in */
function washingLine(g,L,x0,x1,y,t){
  var T=t*0.001;
  g.save();
  g.strokeStyle=litCss('#6b4f33',L); g.lineWidth=4; g.lineCap='round';
  g.beginPath(); g.moveTo(x0,y+6);  g.lineTo(x0,y-52); g.stroke();
  g.beginPath(); g.moveTo(x1,y+6);  g.lineTo(x1,y-52); g.stroke();

  var sag=10;
  g.strokeStyle=litCss('#cfc7ae',L); g.lineWidth=1.6;
  g.beginPath();
  g.moveTo(x0,y-50);
  g.quadraticCurveTo((x0+x1)/2, y-50+sag*2, x1, y-50);
  g.stroke();

  var items=[
    {p:0.24, w:20, h:26, c:'#b8483a'},
    {p:0.50, w:24, h:22, c:'#cfc7ae'},
    {p:0.76, w:18, h:28, c:'#3d5670'}
  ];
  items.forEach(function(it,i){
    var px=x0+(x1-x0)*it.p;
    var py=y-50+sag*2*(1-Math.pow(2*it.p-1,2));
    var swing=Math.sin(T*1.1+i*1.6)*0.10;
    g.save(); g.translate(px,py); g.rotate(swing);
    g.fillStyle=litCss(it.c,L);
    g.beginPath();
    g.moveTo(-it.w/2,0);
    g.lineTo(it.w/2,0);
    g.lineTo(it.w/2+2, it.h);
    g.lineTo(-it.w/2-2, it.h);
    g.closePath(); g.fill();
    g.restore();
  });
  g.restore();
}

/* ============================================================
   5 · THE FLOCK — fourteen orange, eleven yellow, twelve black
   Deterministic scatter, so the field is the same every read
   and a patient child can genuinely count thirty-seven.
   ============================================================ */
function makeRng(seed){
  return function(){ seed=(seed*1664525+1013904223)%4294967296; return seed/4294967296; };
}

var FLOCK=(function(){
  var colours=[];
  for(var i=0;i<14;i++) colours.push('orange');
  for(var j=0;j<11;j++) colours.push('yellow');
  for(var k=0;k<12;k++) colours.push('black');

  var r=makeRng(20260807);
  /* shuffle so the colours interleave across the field */
  for(var s=colours.length-1;s>0;s--){
    var n=Math.floor(r()*(s+1));
    var tmp=colours[s]; colours[s]=colours[n]; colours[n]=tmp;
  }

  /* jittered grid: 7 columns x 6 rows = 42 slots, take 37 */
  var slots=[];
  for(var row=0;row<6;row++){
    for(var col=0;col<7;col++){
      slots.push({
        x: 0.055 + (col+ (row%2?0.5:0)) * 0.135,
        y: 0.10  + row * 0.175
      });
    }
  }
  for(var s2=slots.length-1;s2>0;s2--){
    var n2=Math.floor(r()*(s2+1));
    var tp=slots[s2]; slots[s2]=slots[n2]; slots[n2]=tp;
  }
  slots=slots.slice(0,37);

  var modes=['peck','stand','walk','stand','peck'];
  var arr=slots.map(function(p,i){
    return {
      c: colours[i],
      x: Math.max(0.03, Math.min(0.97, p.x + (r()-0.5)*0.055)),
      y: Math.max(0.06, Math.min(0.99, p.y + (r()-0.5)*0.07)),
      m: modes[Math.floor(r()*modes.length)],
      s: r()*4,
      f: r()>0.55
    };
  });

  /* props stand where they stand — hens get moved out from under them.
     zones are in flock space: x across the canvas, y from horizon to bottom. */
  var KEEPOUT=[
    {x:0.935, y:0.300, rx:0.078, ry:0.175},  /* the feeder   */
    {x:0.062, y:0.690, rx:0.070, ry:0.200},  /* the signpost */
    {x:0.720, y:0.450, rx:0.085, ry:0.190},  /* the cow      */
    {x:0.345, y:0.095, rx:0.062, ry:0.150}   /* the tractor  */
  ];
  /* push off the props, then ease apart, then push off again — the two
     rules fight each other, so they have to be run together, not in turn */
  for(var round=0;round<8;round++){
    arr.forEach(function(h){
      KEEPOUT.forEach(function(z){
        var dx=(h.x-z.x)/z.rx, dy=(h.y-z.y)/z.ry;
        var d2=dx*dx+dy*dy;
        if(d2 < 1){
          var d=Math.sqrt(d2)||0.0001;
          /* shove straight out along the ellipse normal, clear of the edge */
          h.x = z.x + (dx/d)*z.rx*1.10;
          h.y = z.y + (dy/d)*z.ry*1.10;
          h.x = Math.max(0.03, Math.min(0.97, h.x));
          h.y = Math.max(0.06, Math.min(0.99, h.y));
        }
      });
    });
    for(var pass=0;pass<6;pass++){
      for(var a=0;a<arr.length;a++){
        for(var b=a+1;b<arr.length;b++){
          var ddx=arr[b].x-arr[a].x, ddy=arr[b].y-arr[a].y;
          var dist=Math.sqrt(ddx*ddx+ddy*ddy);
          if(dist>0.001 && dist<0.048){
            var push=(0.048-dist)*0.5;
            arr[a].x-=ddx/dist*push; arr[a].y-=ddy/dist*push;
            arr[b].x+=ddx/dist*push; arr[b].y+=ddy/dist*push;
          }
        }
      }
    }
  }
  arr.forEach(function(h){
    h.x=Math.max(0.03,Math.min(0.97,h.x));
    h.y=Math.max(0.06,Math.min(0.99,h.y));
  });

  return arr;
})();

function drawFlock(g,W,H,L,t,hz){
  var sorted=FLOCK.slice().sort(function(a,b){return a.y-b.y;});
  sorted.forEach(function(h){
    var isHidden = (L.hides===h.c);
    var a = isHidden ? HIDE_ALPHA : 1;
    var scale=(0.40+h.y*0.62)*(H/640);
    var px=W*h.x, py=hz+(H-hz)*h.y;
    g.save(); g.translate(px,py); g.scale(scale,scale);
    g.fillStyle='rgba(0,0,0,'+((L.exp<0.7?0.10:0.19)*(isHidden?a*0.45:1))+')';
    g.beginPath(); g.ellipse(0,1,16,4,0,0,Math.PI*2); g.fill();
    drawHen(g,L,h.c,h.m,t,h.s,h.f,{alpha:a,hidden:isHidden});
    g.restore();
  });
}

/* ============================================================
   6 · THE WIDE PASTURE — pages 1 and 5
   The same field from the same spot, so the reader can hold
   page 1 in their head and see what the sunset takes away.
   ============================================================ */
function pastureWide(g,W,H,t,opts){
  var L=LIGHTS[opts.light];
  var hz=H*0.40;

  skyAndSun(g,W,H,L,hz,t);
  if(opts.light==='morning'){
    clouds(g,W,H,t,[[0.42,0.12,54],[0.70,0.08,40],[0.90,0.19,32]]);
  }else if(opts.light==='sunrise'){
    /* first light: thin, pale, barely there */
    g.save(); g.globalAlpha=0.30;
    clouds(g,W,H,t,[[0.34,0.11,44],[0.66,0.08,34]]);
    g.restore();
  }else{
    /* at sunset the clouds catch the fire and go to embers */
    g.save(); g.globalAlpha=0.42;
    clouds(g,W,H,t,[[0.42,0.13,50],[0.72,0.09,38]]);
    g.restore();
  }
  hedgerow(g,W,H,L,hz);
  ground(g,W,H,L,hz);

  /* a band of glare lying along the horizon, where he'll be looking */
  if(opts.glare){
    var gl=g.createLinearGradient(0,hz-6,0,hz+H*0.20);
    gl.addColorStop(0,'rgba(255,196,110,0.44)');
    gl.addColorStop(1,'rgba(255,150,70,0)');
    g.fillStyle=gl; g.fillRect(0,hz-6,W,H*0.22);
  }

  /* the tractor, parked by the house: dead for most of the book,
     mended by noon on the last day, hauling grain by the end */
  drawTractor(g,L,W*0.345,hz+40,0.42, opts.tractor||'dead', t);

  if(opts.dew){
    var mist=g.createLinearGradient(0,hz-4,0,hz+H*0.17);
    mist.addColorStop(0,'rgba(246,238,214,0.62)');
    mist.addColorStop(1,'rgba(246,238,214,0)');
    g.fillStyle=mist; g.fillRect(0,hz-4,W,H*0.19);
  }

  farmhouse(g,W,H,L,W*0.20,hz+6,0.92,t,!opts.roofDone,opts.lamps);
  if(opts.fenceBroken){
    fenceLine(g,W,H,L,hz+18,0.80,0.88, 0.475,0.555);
    brokenFence(g,L,W*0.52,hz+22,0.54);
  }else{
    fenceLine(g,W,H,L,hz+18,0.80,0.88);
    mendedFence(g,L,W*0.52,hz+20,0.54);
  }

  if(opts.tractor) drawTractor(g,L,W*0.36,hz+30,0.44,opts.tractor,t);
  feeder(g,W,H,L,W*0.935,H*0.60,0.80,!!opts.feederFull);
  if(!opts.noSign) signPost(g,L,W*0.062,H*0.905,0.60,opts.chickens,opts.days,opts.ghosts);

  drawFlock(g,W,H,L,t,hz);

  /* the cow, out in the field, keeping her own counsel */
  g.save();
  g.translate(W*0.72,hz+(H-hz)*0.52); g.scale(0.62*(H/640),0.62*(H/640));
  g.fillStyle='rgba(0,0,0,'+(L.exp<0.7?0.28:0.18)+')';
  g.beginPath(); g.ellipse(-4,0,52,7,0,0,Math.PI*2); g.fill();
  drawCow(g,L,t);
  g.restore();

  /* the farmer, small, at his gate */
  g.save();
  g.translate(W*0.842,hz+30); g.scale(0.62*(H/640),0.62*(H/640));
  g.fillStyle='rgba(0,0,0,'+(opts.light==='sunset'?0.30:0.19)+')';
  g.beginPath(); g.ellipse(0,0,20,5,0,0,Math.PI*2); g.fill();
  drawFarmer(g,L,opts.pose,t);
  g.restore();

  vignette(g,W,H, opts.light==='sunset' ? 0.44 : 0.34);
  grain(g,W,H,0.05);
}

function page1(g,W,H,t){
  pastureWide(g,W,H,t,{light:'morning', pose:'stand', chickens:'?', days:3, fenceBroken:true});
}

}

  vignette(g,W,H,0.30);
  grain(g,W,H,0.05);
}

/* ============================================================
   6c · THE FARMYARD — pages 3 and 4
   One frame, drawn twice. Page 3 has him in it, mid-sentence.
   Page 4 is the same frame a moment later, with him gone.
   ============================================================ */
function farmyard(g,W,H,t,opts){
  var L=LIGHTS.morning;
  var hz=H*0.43;
  var T=t*0.001;
  var clutter=opts.clutter||1;   /* each telling, the farm gets worse */

  skyAndSun(g,W,H,L,hz,t);
  clouds(g,W,H,t,[[0.36,0.10,46],[0.82,0.15,34]]);
  hedgerow(g,W,H,L,hz);
  ground(g,W,H,L,hz);

  /* the roof: rafters until he fixes it on day two */
  farmhouse(g,W,H,L,W*0.235,hz+10,0.86,t,clutter<3);

  /* the clock, on its post by the gate */
  signPost(g,L,W*0.055,hz+52,0.52,opts.chickens,opts.days,opts.ghosts);

  /* the washing he put out and forgot — arrives on the second telling */
  if(clutter>=2) washingLine(g,L,W*0.340,W*0.470,hz+26,t);

  /* the fence: a real line across the yard, with the damaged stretch in it.
     broken on day one, mended (in newer, lighter wood) ever after. */
  fenceLine(g,W,H,L,hz+36,0.478,0.607);
  if(clutter<=1) brokenFence(g,L,W*0.545,hz+43.4,0.86);
  else           mendedFence(g,L,W*0.545,hz+43.4,0.86);

  /* the tractor: dead on day one, in pieces by day three */
  drawTractor(g,L,W*0.300,hz+78,0.66,clutter>=3?'parts':'dead',t);

  /* the cow. by the second telling she has given up and lain down */
  g.save();
  g.translate(W*0.845,H*0.735); g.scale(0.86*(H/640),0.86*(H/640));
  g.fillStyle='rgba(0,0,0,0.19)';
  g.beginPath(); g.ellipse(-4,0,48,7,0,0,Math.PI*2); g.fill();
  drawCow(g,L,t,clutter>=2);
  g.restore();

  /* the barrow he tipped over and stepped around */
  if(clutter>=2) wheelbarrow(g,L,W*0.300,H*0.870,0.90);

  if(clutter>=3){
    /* a hen roosting on the lying cow, who has stopped objecting to anything */
    g.save();
    g.translate(W*0.853,H*0.735-46); g.scale(0.72,0.72);
    drawHen(g,L,'black','stand',t,2.8,true,{});
    g.restore();

    /* the washing has come off the line */
    [[0.365,'#b8483a',22,-0.3],[0.428,'#3d5670',19,0.5]].forEach(function(w){
      g.save();
      g.translate(W*w[0],hz+40); g.rotate(w[3]);
      g.fillStyle=litCss(w[1],L);
      g.beginPath();
      g.moveTo(-w[2]/2,0); g.lineTo(w[2]/2,-3);
      g.lineTo(w[2]/2+4,10); g.lineTo(-w[2]/2-3,12);
      g.closePath(); g.fill();
      g.restore();
    });
  }

  /* his stool, set out and abandoned */
  g.save(); g.translate(W*0.735,H*0.80); g.scale(0.8,0.8);
  g.fillStyle=litCss('#8a6a44',L);
  g.fillRect(-13,-12,26,4);
  g.fillRect(-11,-8,3.4,9); g.fillRect(8,-8,3.4,9);
  g.restore();

  /* all thirty-seven, underfoot, wandering, because of course they are */
  YARD.forEach(function(h){
    var a=T*h.sp+h.ph;
    var x=h.x+Math.sin(a)*h.rx, y=h.y+Math.sin(a*0.6+h.ph)*h.ry;
    var scale=(0.50+y*0.70)*(H/640);
    g.save(); g.translate(W*x, hz+(H-hz)*y); g.scale(scale,scale);
    g.fillStyle='rgba(0,0,0,0.19)';
    g.beginPath(); g.ellipse(0,1,16,4,0,0,Math.PI*2); g.fill();
    drawHen(g,L,h.c,Math.abs(Math.cos(a))>0.42?'walk':'peck',t,h.s,Math.cos(a)<0,{});
    g.restore();
  });

  if(opts.farmer){
    /* mid-stride, mid-sentence */
    var fs=1.42*(H/640);
    g.save();
    g.translate(W*0.635,H*0.965); g.scale(fs,fs);
    g.fillStyle='rgba(0,0,0,0.20)';
    g.beginPath(); g.ellipse(0,0,24,6,0,0,Math.PI*2); g.fill();
    drawFarmer(g,L,'laden',t);

    /* the hen tucked under his arm, entirely unbothered */
    g.save();
    g.translate(20,-62+Math.sin(T*1.6)*0.9);
    g.rotate(0.30); g.scale(0.62,0.62);
    drawHen(g,L,'orange','stand',t,1.9,false,{});
    g.restore();

    /* by the second telling there is one on his hat as well */
    if(clutter>=2){
      g.save();
      g.translate(-1,-124+Math.sin(T*1.6)*0.9);
      g.rotate(-0.06); g.scale(0.52,0.52);
      drawHen(g,L,'yellow','stand',t,3.4,true,{});
      g.restore();
    }
    /* and by the third, one riding the end of the hoe */
    if(clutter>=3){
      g.save();
      g.translate(31,-104+Math.sin(T*1.6)*1.1);
      g.rotate(0.12); g.scale(0.46,0.46);
      drawHen(g,L,'black','stand',t,0.6,true,{});
      g.restore();
    }
    g.restore();
  }

  if(opts.gone){
    var as=1.42*(H/640);

    /* the bucket, dropped where he was standing */
    g.save();
    g.translate(W*0.588,H*0.975); g.scale(as*0.92,as*0.92);
    g.fillStyle='rgba(0,0,0,0.18)';
    g.beginPath(); g.ellipse(0,0,17,4.5,0,0,Math.PI*2); g.fill();
    /* the puddle it emptied */
    g.fillStyle='rgba(210,228,238,0.42)';
    g.beginPath(); g.ellipse(-19,0,17,5,0,0,Math.PI*2); g.fill();
    g.save(); g.rotate(-1.42);
    g.fillStyle=litCss('#8b9099',L);
    g.beginPath();
    g.moveTo(-9,0); g.lineTo(-7,-15); g.lineTo(7,-15); g.lineTo(9,0); g.closePath(); g.fill();
    g.strokeStyle=litCss('#5d646d',L); g.lineWidth=1.6;
    g.beginPath(); g.arc(0,-15,7.4,Math.PI,0); g.stroke();
    g.restore();
    g.restore();

    /* the hen he was carrying, set down and quite unbothered */
    g.save();
    g.translate(W*0.672,H*0.955); g.scale(as*0.98,as*0.98);
    g.fillStyle='rgba(0,0,0,0.20)';
    g.beginPath(); g.ellipse(0,1,16,4,0,0,Math.PI*2); g.fill();
    drawHen(g,L,'orange','stand',t,1.9,false,{});
    g.restore();

    if(clutter>=2){
      /* the one off his hat, and the hoe he finally dropped too */
      g.save();
      g.translate(W*0.760,H*0.930); g.scale(as*0.84,as*0.84);
      g.fillStyle='rgba(0,0,0,0.20)';
      g.beginPath(); g.ellipse(0,1,16,4,0,0,Math.PI*2); g.fill();
      drawHen(g,L,'yellow','peck',t,3.4,true,{});
      g.restore();

      g.save();
      g.translate(W*0.470,H*0.980); g.rotate(0.10); g.scale(as*0.9,as*0.9);
      g.strokeStyle=litCss('#7a5c3a',L); g.lineWidth=3.6; g.lineCap='round';
      g.beginPath(); g.moveTo(-40,0); g.lineTo(30,-6); g.stroke();
      g.strokeStyle=litCss('#8b9099',L); g.lineWidth=4.6;
      g.beginPath(); g.moveTo(30,-6); g.lineTo(41,-8); g.stroke();
      g.restore();
    }

    /* the dust of a man already somewhere else */
    for(var d=0;d<3;d++){
      var ph=(T*0.55+d*0.33)%1;
      g.globalAlpha=(1-ph)*0.30;
      g.fillStyle='#e6dfcc';
      var px=W*(0.905+d*0.028)+ph*26, py=H*(0.925-d*0.018)-ph*10;
      g.beginPath(); g.arc(px,py,7+ph*13,0,Math.PI*2); g.fill();
    }
    g.globalAlpha=1;
  }

  vignette(g,W,H,0.34);
  grain(g,W,H,0.05);
}

function tallyMarks(g,x,y,total,gap,hgt,colour,lw,maxW){
  g.save(); g.translate(x,y);
  g.strokeStyle=colour; g.lineWidth=lw; g.lineCap='round';

  var groups=Math.ceil(total/5);
  var groupW=gap*3+14;
  var pitch=groupW+gap*1.1;
  maxW = maxW || 440;

  /* wrap onto a second row rather than run off the slate */
  var perRow=Math.max(1,Math.floor((maxW+gap*1.1)/pitch));
  var rows=Math.ceil(groups/perRow);
  if(rows>1) perRow=Math.ceil(groups/rows);          /* balance the rows */
  var rowGap=hgt+13;
  var y0=-((rows-1)*rowGap)/2;

  var drawn=0;
  for(var r=0;r<rows;r++){
    var inRow=Math.min(perRow, groups-r*perRow);
    var startX=-((inRow-1)*pitch)/2;
    var ry=y0+r*rowGap;
    for(var gi=0; gi<inRow; gi++){
      var inThis=Math.min(5,total-drawn);
      if(inThis<=0) break;
      var gx=startX+gi*pitch;
      var uprights=Math.min(inThis,4);
      for(var k=0;k<uprights;k++){
        var sx=gx+k*gap;
        g.beginPath();
        g.moveTo(sx-1.5,ry-hgt/2); g.lineTo(sx+1.5,ry+hgt/2);
        g.stroke();
      }
      if(inThis===5){
        g.beginPath();
        g.moveTo(gx-8,ry+hgt/2-3); g.lineTo(gx+gap*3+8,ry-hgt/2+3);
        g.stroke();
      }
      drawn+=inThis;
    }
  }
  g.restore();
  return drawn;
}

function slatePage(g,W,H,t,opts){
  var L=LIGHTS[opts.light];
  var hz=H*0.40;
  var T=t*0.001;

  /* the field behind, thrown out of focus. whichever hens the light is
     taking today are taken here too — even out of focus, even ignored. */
  softDraw(g,W,H,7,function(sg){
    skyAndSun(sg,W,H,L,hz,t);
    hedgerow(sg,W,H,L,hz);
    ground(sg,W,H,L,hz);
    [[0.12,0.42,'yellow'],[0.28,0.72,'black'],[0.76,0.50,'orange'],[0.90,0.80,'black']]
      .forEach(function(h,i){
        var a=T*0.5+i*1.7;
        var hid = (L.hides===h[2]);
        sg.save();
        sg.translate(W*(h[0]+Math.sin(a)*0.02), hz+(H-hz)*h[1]);
        var sc=(0.8+h[1]*0.7)*(H/640);
        sg.scale(sc,sc);
        drawHen(sg,L,h[2],'peck',t,i*1.3,Math.cos(a)<0,
                {alpha:hid?HIDE_ALPHA:1, hidden:hid});
        sg.restore();
      });
  });

  /* haze between us and the field */
  g.fillStyle=opts.haze;
  g.fillRect(0,0,W,H);

  /* ---- the slate, held up ---- */
  var cx=W*0.50, cy=H*0.475, hw=248, hh=146;
  g.save();
  g.translate(cx,cy); g.rotate(-0.035);

  /* it blocks the sun, so it throws a shadow toward us */
  g.fillStyle='rgba(58,14,4,0.32)';
  g.fillRect(-hw+14,-hh+18,hw*2,hh*2);

  /* wooden frame */
  g.fillStyle=litCss('#7a5c3a',L);
  g.fillRect(-hw,-hh,hw*2,hh*2);
  g.fillStyle=litCss('#5d4530',L);
  g.fillRect(-hw+8,-hh+8,hw*2-16,9);

  /* the slate itself */
  g.fillStyle=litCss('#2b2f33',L);
  g.fillRect(-hw+16,-hh+16,hw*2-32,hh*2-32);

  /* old chalk, wiped but not gone */
  g.save();
  g.globalAlpha=0.10;
  g.strokeStyle=litCss('#e8e6d8',L); g.lineWidth=9; g.lineCap='round';
  g.beginPath(); g.moveTo(-hw+40,-38); g.quadraticCurveTo(0,-62, hw-46,-28); g.stroke();
  g.beginPath(); g.moveTo(-hw+52,28);  g.quadraticCurveTo(10,6,   hw-40,36); g.stroke();
  g.restore();

  var chalk=litCss('#e8e6d8',L);

  /* the answer he rubbed out, still faintly there behind this one */
  if(opts.ghosts && opts.ghosts.length){
    g.save();
    g.textAlign='center'; g.textBaseline='alphabetic';
    g.globalAlpha=0.17;
    g.fillStyle=chalk;
    g.font='800 104px "Fraunces", Georgia, serif';
    opts.ghosts.forEach(function(gh,i){
      g.save(); g.translate(-26+i*54, 6); g.rotate(-0.11);
      g.fillText(String(gh),0,84);
      g.restore();
    });
    /* the sweep of a sleeve that never quite clears it */
    g.globalAlpha=0.11;
    g.strokeStyle=chalk; g.lineWidth=30; g.lineCap='round';
    g.beginPath();
    g.moveTo(-168,54); g.quadraticCurveTo(0,18, 172,60);
    g.stroke();
    g.restore();
  }

  /* his working, in fives — tightened up as the numbers get bigger */
  var gap = opts.count>24 ? 13 : 15;
  var counted=tallyMarks(g,0,opts.count>30?-70:-74,opts.count,gap,
                         opts.count>30?32:40,chalk,3.4,430);

  /* the line he draws under it */
  g.strokeStyle=chalk; g.lineWidth=2.6; g.lineCap='round';
  g.beginPath();
  g.moveTo(-146,-22); g.quadraticCurveTo(0,-29, 146,-19);
  g.stroke();

  /* and the answer */
  g.fillStyle=chalk;
  g.textAlign='center'; g.textBaseline='alphabetic';
  g.font='800 104px "Fraunces", Georgia, serif';
  g.fillText(String(counted), 0, 84);

  /* chalk dust along the tray */
  g.globalAlpha=0.32;
  for(var d=0;d<26;d++){
    var dx=-hw+30+((d*97)%(hw*2-60));
    g.fillRect(dx, hh-24+((d*31)%7), 2.2, 2.2);
  }
  g.globalAlpha=1;

  /* a rim of sunset along the top edge */
  g.strokeStyle='rgba(255,190,110,0.55)'; g.lineWidth=3;
  g.beginPath(); g.moveTo(-hw,-hh+1.5); g.lineTo(hw,-hh+1.5); g.stroke();

  /* ---- his hand, gripping the bottom edge ---- */
  var skin=litCss('#c88f5f',L), skinS=litCss('#a8734a',L);
  g.fillStyle=skin;
  g.beginPath();
  g.ellipse(-98,hh+30,72,32,0.06,0,Math.PI*2);
  g.fill();
  [-156,-118,-80,-42].forEach(function(fx,i){
    g.fillStyle = i%2 ? skinS : skin;
    g.beginPath();
    g.moveTo(fx,hh+16);
    g.quadraticCurveTo(fx+7,hh-14, fx+16,hh-1);
    g.quadraticCurveTo(fx+21,hh+20, fx+14,hh+32);
    g.closePath(); g.fill();
  });
  /* the sleeve */
  g.fillStyle=litCss('#b8483a',L);
  g.beginPath();
  g.ellipse(-190,hh+56,50,30,0.22,0,Math.PI*2);
  g.fill();

  g.restore();

  vignette(g,W,H,0.46);
  grain(g,W,H,0.05);
}

/* ============================================================
   6h · PAGE 14 — the coop at night
   All thirty-seven on the roosts at last, holding perfectly
   still — and the lamplight takes the black ones anyway.
   ============================================================ */
var ROOSTS=(function(){
  var beams=[
    'oykoykoykoyko',   /* 13: 5o 4y 4k */
    'koykoykoykoy',    /* 12: 4k 4o 4y */
    'okyokyokokyo'     /* 12: 5o 3y 4k */
  ];
  var map={o:'orange',y:'yellow',k:'black'};
  var out=[];
  beams.forEach(function(row,b){
    var n=row.length;
    for(var i=0;i<n;i++){
      out.push({
        c: map[row[i]],
        b: b,
        x: 0.075 + i*(0.855/(n-1)),
        s: ((i*2.7+b*1.3)%4),
        f: (i+b)%2===0
      });
    }
  });
  return out;
})();

function page14(g,W,H,t){
  var L=LIGHTS.night;

  /* the inside of the henhouse */
  var bg=g.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a0c12'); bg.addColorStop(0.55,'#121017'); bg.addColorStop(1,'#08090c');
  g.fillStyle=bg; g.fillRect(0,0,W,H);

  /* plank wall */
  g.strokeStyle='rgba(120,95,65,0.13)'; g.lineWidth=2;
  for(var x=0;x<W;x+=64){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke(); }

  /* the lamp, hung by the door */
  var lx=W*0.115, ly=H*0.135;
  var flick=0.5+Math.sin(t*0.008)*0.22+Math.sin(t*0.021)*0.13;
  var lg=g.createRadialGradient(lx,ly,4,lx,ly,H*0.95);
  lg.addColorStop(0,'rgba(255,214,140,'+(0.58+flick*0.16)+')');
  lg.addColorStop(0.30,'rgba(255,175,85,0.20)');
  lg.addColorStop(1,'rgba(255,160,70,0)');
  g.fillStyle=lg; g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(30,22,14,0.9)'; g.lineWidth=2.5;
  g.beginPath(); g.moveTo(lx,0); g.lineTo(lx,ly-16); g.stroke();
  g.strokeRect(lx-11,ly-16,22,30);
  g.fillStyle='rgba(255,248,224,'+(0.86+flick*0.14)+')';
  g.beginPath(); g.arc(lx,ly,7.5,0,Math.PI*2); g.fill();

  /* three roost beams */
  var beamY=[H*0.40,H*0.62,H*0.845];
  beamY.forEach(function(by,i){
    g.fillStyle=litCss('#6b4f33',L,0.85);
    g.fillRect(0,by,W,12+i*1.5);
    g.fillStyle='rgba(0,0,0,0.34)';
    g.fillRect(0,by+9+i,W,4+i);
  });

  /* the whole flock, finally holding still */
  ROOSTS.forEach(function(h){
    var by=beamY[h.b];
    var hid=(L.hides===h.c);
    var scale=(0.72+h.b*0.13)*(H/640);
    g.save();
    g.translate(W*h.x, by+1);
    g.scale(scale,scale);
    drawHen(g,L,h.c,'roost',t,h.s,h.f,{alpha:hid?HIDE_ALPHA:1, hidden:hid});
    g.restore();
  });

  /* the farmer in the doorway, counting what the lamp will let him */
  g.save();
  g.translate(W*0.072,H*0.985); g.scale(0.92*(H/640),0.92*(H/640));
  drawFarmer(g,L,'squint',t);
  g.restore();

  var vg=g.createRadialGradient(lx,ly,H*0.10,W/2,H/2,H*1.05);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.72)');
  g.fillStyle=vg; g.fillRect(0,0,W,H);
  grain(g,W,H,0.05);
}

    t:"He set his three answers side by side. <span class='num'>23. 26. 25.</span> All different. All wrong.<br><br><span class='fm'>&ldquo;The fence got my morning,&rdquo;</span> he said slowly. <span class='fm'>&ldquo;The roof got my day. The tractor got my everything. And the counting got the leftovers.&rdquo;</span>" },

  { s:page17,
    t:"The farmer opened his mouth to name the next job.<br><br>The fence was mended. The roof was tight. The tractor was fixed.<br><br>And nothing came out." },

  { s:page18,
    t:"<span class='fm'>&ldquo;...Right,&rdquo;</span> said the farmer.<br><br>And he laid his tools down in the grass &mdash; finished with, every one &mdash; and climbed up onto the fence, and stayed there while the sun climbed too." },

  { s:page19,
    t:"The hens were hungry <em>now</em>, and shouting about it, and every part of him wanted to race for the grain. He stood still anyway.<br><br>At noon there are no shadows to hide in and no glare to hide behind. He counted slowly. <span class='o'>Orange: fourteen.</span> <span class='y'>Yellow: eleven.</span> <span class='k'>Black: twelve.</span><br><br><span class='num'>Thirty-seven chickens.</span>" },

  { s:page20,
    t:"Then he raced for the grain &mdash; and the tractor started first time, and hauled home sacks enough for <span class='num'>thirty-seven</span>.<br><br>That evening the feeder was full, and in the morning it was <em>still</em> full. The hens grew glossy and loud and laid eggs by the basketful." },

  { s:page21,
    t:"And ever after, when a thing truly mattered, the farmer would not squeeze it into the leftovers of the day.<br><br>He would stop, and stand still, and &mdash;<br><br><span class='fm'>&ldquo;count it in the good light.&rdquo;</span>" }
];

/* ============================================================
   8 · READER
   ============================================================ */
var cv=document.getElementById('c');
var ctx=cv.getContext('2d');
var W=cv.width, H=cv.height;
var dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr; cv.height=H*dpr;
cv.style.aspectRatio=W+' / '+H;
ctx.scale(dpr,dpr);

var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var NUM=PAGES.length;
var idx=-1;                     /* -1 title · 0..NUM-1 pages · NUM end */

var titleScreen=document.getElementById('titleScreen');
var endScreen=document.getElementById('endScreen');
var textEl=document.getElementById('text');
var counter=document.getElementById('counter');
var progress=document.getElementById('progress');
var hint=document.getElementById('hint');

for(var i=0;i<NUM;i++){
  var d=document.createElement('div'); d.className='dot'; progress.appendChild(d);
}
var dots=[].slice.call(progress.children);

var swapTimer=null;
var drawIdx=0;      /* which page the canvas is showing right now */

function render(){
  titleScreen.classList.toggle('hidden', idx!==-1);
  endScreen.classList.toggle('hidden', idx!==NUM);
  var onPage = idx>=0 && idx<NUM;
  counter.style.opacity = onPage?1:0;
  progress.style.opacity = onPage?1:0;
  hint.style.opacity = onPage?1:0;

  /* a pending text swap from the last page must never land on this one */
  if(swapTimer){ clearTimeout(swapTimer); swapTimer=null; }

  if(onPage){
    var myIdx = idx;
    counter.textContent=(idx+1)+' / '+NUM;
    dots.forEach(function(dd,i2){ dd.classList.toggle('on', i2<=myIdx); });
    textEl.style.opacity=0;
    swapTimer=setTimeout(function(){
      swapTimer=null;
      var page=PAGES[myIdx];
      if(myIdx!==idx || !page) return;   /* turned again while fading */
      drawIdx=myIdx;                     /* picture turns with the words */
      textEl.innerHTML=page.t;
      textEl.style.opacity=1;
    },170);
  }else{
    textEl.style.opacity=0;
  }
}

function go(n){
  var next=Math.max(-1,Math.min(NUM,n));
  if(next===idx) return;
  idx=next;
  render();
}

function restart(){ idx=-1; render(); }

/* ---------- fullscreen ---------- */
var fsBtn=document.getElementById('fsBtn');
var fsIcon=document.getElementById('fsIcon');
var ENTER_ICON='<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>';
var EXIT_ICON='<path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/>';
function isFs(){return document.fullscreenElement||document.webkitFullscreenElement;}
function toggleFs(){
  var el=document.documentElement;
  if(!isFs()){
    (el.requestFullscreen||el.webkitRequestFullscreen||el.webkitRequestFullScreen).call(el);
  }else{
    (document.exitFullscreen||document.webkitExitFullscreen).call(document);
  }
}
function syncFsIcon(){ fsIcon.innerHTML = isFs()?EXIT_ICON:ENTER_ICON; }
fsBtn.addEventListener('click',function(e){ e.stopPropagation(); toggleFs(); });
document.addEventListener('fullscreenchange',syncFsIcon);
document.addEventListener('webkitfullscreenchange',syncFsIcon);

document.addEventListener('click',function(e){
  var back = e.clientX < window.innerWidth*0.34;

  /* the end screen: left goes back into the book, right starts it again */
  if(idx===NUM){
    if(back) go(NUM-1); else restart();
    return;
  }
  if(idx===-1){ go(0); return; }
  go(back ? idx-1 : idx+1);
});

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '){
    e.preventDefault();
    if(idx===NUM) restart(); else go(idx+1);
    return;
  }
  if(e.key==='ArrowLeft'){
    e.preventDefault();
    go(idx===NUM ? NUM-1 : idx-1);    /* from the end, back into the book */
  }
});

function frame(t){
  var tt = reduce ? 4200 : t;
  ctx.clearRect(0,0,W,H);
  var page = PAGES[Math.max(0,Math.min(NUM-1,drawIdx))];
  page.s(ctx,W,H,tt);
  if(!reduce) requestAnimationFrame(frame);
}

render();
requestAnimationFrame(frame);

})();
</script>
</body>
