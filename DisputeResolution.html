  function renderAltDerived(host) {
    clear(host);
    var c = computeAlt();
    var p = panel('What the numbers say', '');

    var grid = el('div', 'stat-grid');
    grid.appendChild(stat('At stake', c.spread !== null ? fmtMoney(c.spread) : '—',
      c.spread !== null ? 'The gap between your best and worst outcome without a deal. This is your skin in the game.'
        : 'Put a figure on your BATNA and WATNA to see this.'));
    grid.appendChild(stat('Expected without a deal', c.expected !== null ? fmtMoney(c.expected) : '—',
      c.expected !== null ? 'Your three outcomes, weighted by the odds you gave them.' : 'Add values and odds above.'));
    var walkStat = stat('Walk-away line', c.reservation !== null ? fmtMoney(c.reservation) : '—',
      c.reservation === null ? 'Needs at least one valued outcome above.'
        : c.overridden ? 'Set by you by hand.'
          : 'Expected outcome, adjusted for how much risk you can carry.');
    walkStat.className = 'stat accent';
    grid.appendChild(walkStat);
    p.appendChild(grid);

    var gauge = buildGauge(c);
    if (gauge) p.appendChild(gauge);

    if (c.reservation !== null) {
      var co = el('div', 'callout');
      co.innerHTML = 'Any offer worth less than <b>' + escapeHtml(fmtMoney(c.reservation)) + '</b> leaves you better off ' +
        'walking away and taking your chances. Below that line, saying no is not stubbornness — it is arithmetic.' +
        (c.target !== null ? ' You are aiming for <b>' + escapeHtml(fmtMoney(c.target)) + '</b>.' : '');
      p.appendChild(co);
    }
    if (c.target !== null && c.reservation !== null && c.target < c.reservation) {
      p.appendChild(el('div', 'callout danger',
        'Your target (<b>' + escapeHtml(fmtMoney(c.target)) + '</b>) is <b>below</b> your walk-away line ' +
        '(<b>' + escapeHtml(fmtMoney(c.reservation)) + '</b>). Either you are aiming too low, or your alternatives are better than you thought.'));
    }
    if (c.spread !== null && c.theirSpread !== null) {
      var mine = Math.abs(c.spread), theirs = Math.abs(c.theirSpread);
      var msg;
      if (mine > theirs * 1.2) {
        msg = 'You have more riding on this than they do (<b>' + escapeHtml(fmtMoney(mine)) + '</b> against <b>' +
          escapeHtml(fmtMoney(theirs)) + '</b>). Expect them to be patient. Your leverage has to come from evidence and from ' +
          'concessions they want, not from waiting them out.';
      } else if (theirs > mine * 1.2) {
        msg = 'They have more riding on this than you do (<b>' + escapeHtml(fmtMoney(theirs)) + '</b> against <b>' +
          escapeHtml(fmtMoney(mine)) + '</b>). Time is on your side — you can afford to be the one who is comfortable walking away.';
      } else {
        msg = 'You both have roughly the same amount at stake. Neither side can simply outlast the other, so the deal will ' +
          'turn on trades rather than pressure.';
      }
      p.appendChild(el('div', 'callout warn', msg));
    }
    host.appendChild(p);
  }

  function stat(label, value, note) {
    var s = el('div', 'stat');
    s.appendChild(el('div', 'stat-label', escapeHtml(label)));
    s.appendChild(el('div', 'stat-value', escapeHtml(value)));
    if (note) s.appendChild(el('div', 'stat-note', note));
    return s;
  }

  /* A single bar from worst to best, with the walk-away line and target
     marked on it, so the acceptable zone is visible at a glance. */
  function buildGauge(c) {
    var pts = [];
    ['worst', 'likely', 'best', 'expected', 'reservation', 'target'].forEach(function (k) {
      if (isNum(c[k])) pts.push(c[k]);
    });
    if (pts.length < 2) return null;
    var lo = Math.min.apply(null, pts), hi = Math.max.apply(null, pts);
    if (hi - lo <= 0) return null;
    var pad = (hi - lo) * 0.1;
    lo -= pad; hi += pad;
    function pct(v) { return Math.max(0, Math.min(100, ((v - lo) / (hi - lo)) * 100)); }

    var wrap = el('div', 'gauge-wrap');
    var bar = el('div', 'gauge-bar');

    if (isNum(c.reservation)) {
      var rP = pct(c.reservation);
      var tP = isNum(c.target) ? Math.max(rP, pct(c.target)) : 100;
      var z1 = el('div', 'gz bad'); z1.style.width = rP + '%'; bar.appendChild(z1);
      var z2 = el('div', 'gz ok'); z2.style.width = (tP - rP) + '%'; bar.appendChild(z2);
      if (tP < 100) { var z3 = el('div', 'gz great'); z3.style.width = (100 - tP) + '%'; bar.appendChild(z3); }
    } else {
      var z0 = el('div', 'gz plain'); z0.style.width = '100%'; bar.appendChild(z0);
    }
    wrap.appendChild(bar);

    var marks = el('div', 'gauge-marks');
    var defs = [
      { k: 'worst', label: 'WATNA' },
      { k: 'expected', label: 'Expected' },
      { k: 'reservation', label: 'Walk away' },
      { k: 'best', label: 'BATNA' },
      { k: 'target', label: 'Target' }
    ].filter(function (d) { return isNum(c[d.k]); })
      .sort(function (a, b) { return c[a.k] - c[b.k]; });

    defs.forEach(function (d, i) {
      var m = el('div', 'gmark ' + (i % 2 ? 'low' : 'hi'));
      m.style.left = pct(c[d.k]) + '%';
      if (i % 2) {
        m.innerHTML = '<div class="stem"></div><div class="gm-label">' + escapeHtml(d.label) + '</div>' +
          '<div class="gm-val">' + escapeHtml(fmtMoney(c[d.k])) + '</div>';
      } else {
        m.innerHTML = '<div class="gm-label">' + escapeHtml(d.label) + '</div>' +
          '<div class="gm-val">' + escapeHtml(fmtMoney(c[d.k])) + '</div><div class="stem"></div>';
      }
      marks.appendChild(m);
    });
    wrap.appendChild(marks);

    if (isNum(c.reservation)) {
      var lg = el('div', 'gauge-legend');
      lg.innerHTML = '<span class="l-bad">Worse than walking away</span>' +
        '<span class="l-ok">Acceptable — keep negotiating</span>' +
        (isNum(c.target) ? '<span class="l-great">At or above target</span>' : '');
      wrap.appendChild(lg);
    }
    return wrap;
  }

  /* ---------------- shared card plumbing ---------------- */

  function makeCard(id, rankText, titleText, badges, actions) {
    var collapsed = !!ui.collapsed[id];
    var body = el('div', 'card-body');
    var card = el('div', 'card' + (collapsed ? ' collapsed' : ''));
    card.setAttribute('data-id', id);
    var head = el('div', 'card-head');

    var grip = el('span', 'card-grip', '⠿');
    grip.title = 'Drag to reorder';
    head.appendChild(grip);
    head.appendChild(el('span', 'card-caret', '▾'));
    if (rankText != null) head.appendChild(el('span', 'card-rank', escapeHtml(rankText)));

    var title = el('span', 'card-title' + (has(titleText) ? '' : ' untitled'),
      escapeHtml(has(titleText) ? titleText : 'Untitled — click to fill in'));
    head.appendChild(title);

    var badgeHost = el('span', 'card-actions');
    head.appendChild(badgeHost);
    var actionHost = el('span', 'card-actions');
    head.appendChild(actionHost);

    head.addEventListener('click', function (e) {
      if (e.target.closest('button') || e.target === grip) return;
      ui.collapsed[id] = !ui.collapsed[id];
      card.classList.toggle('collapsed');
      if (!ui.collapsed[id]) growAll(body);
      saveDraft();
    });

    (actions || []).forEach(function (a) {
      var b = el('button', 'btn tiny' + (a.danger ? ' danger' : ''), a.label);
      if (a.title) b.title = a.title;
      b.addEventListener('click', function (e) { e.stopPropagation(); a.fn(); });
      actionHost.appendChild(b);
    });

    card.appendChild(head);
    card.appendChild(body);

    card._grip = grip;
    card._body = body;
    card._setTitle = function (t) {
      title.textContent = has(t) ? t : 'Untitled — click to fill in';
      title.className = 'card-title' + (has(t) ? '' : ' untitled');
    };
    card._setBadges = function (list) {
      clear(badgeHost);
      (list || []).forEach(function (b) { badgeHost.appendChild(el('span', 'badge ' + (b.cls || ''), escapeHtml(b.text))); });
    };
    card._setBadges(badges);
    return card;
  }

  function attachDnd(card, arr, idx, after) {
    var grip = card._grip;
    grip.draggable = true;
    grip.addEventListener('dragstart', function (e) {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(idx));
      card.classList.add('dragging');
    });
    grip.addEventListener('dragend', function () { card.classList.remove('dragging'); });
    card.addEventListener('dragover', function (e) { e.preventDefault(); card.classList.add('drop-target'); });
    card.addEventListener('dragleave', function () { card.classList.remove('drop-target'); });
    card.addEventListener('drop', function (e) {
      e.preventDefault();
      card.classList.remove('drop-target');
      var from = parseInt(e.dataTransfer.getData('text/plain'), 10);
      if (isNaN(from) || from === idx || from < 0 || from >= arr.length) return;
      var moved = arr.splice(from, 1)[0];
      arr.splice(idx, 0, moved);
      markDirty();
      after();
    });
  }

  function move(arr, item, dir) {
    var i = arr.indexOf(item), j = i + dir;
    if (i < 0 || j < 0 || j >= arr.length) return false;
    arr.splice(i, 1);
    arr.splice(j, 0, item);
    return true;
  }

  /* =====================================================================
     STEP 2 — desired end state
     ===================================================================== */

  function renderDemands(v) {
    v.appendChild(sectionHead('Step 2', 'Your desired end state',
      'A demand that cannot be measured cannot be agreed. For each thing you want, say <b>what</b>, ' +
      '<b>to what specification</b>, <b>by when</b>, and <b>how you will know it has been done</b>. ' +
      'Then rank them — top of the list is what you would keep if you could only keep one.'));

    var summary = el('div');
    var list = el('div');

    var bar = el('div', 'list-toolbar no-print');
    var add = el('button', 'btn primary', '+ Add a demand');
    add.addEventListener('click', function () {
      var d = {
        id: uid('dm'), title: '', category: 'money', tier: 'important',
        spec: '', when: '', who: '', proof: '', opening: '', target: '', minimum: '', why: '', support: []
      };
      state.demands.push(d);
      ui.collapsed[d.id] = false;
      markDirty();
      draw();
      var f = list.querySelector('[data-id="' + d.id + '"] input');
      if (f) f.focus();
    });
    bar.appendChild(add);
    var sortBtn = el('button', 'btn small', 'Must-haves first');
    sortBtn.title = 'Reorder so must-haves come first, then important, then nice to have';
    sortBtn.addEventListener('click', function () {
      var order = { must: 0, important: 1, nice: 2 };
      state.demands.sort(function (a, b) { return order[a.tier] - order[b.tier]; });
      markDirty();
      draw();
      toast('Sorted by priority.');
    });
    bar.appendChild(sortBtn);
    bar.appendChild(el('span', 'spacer'));
    v.appendChild(bar);

    v.appendChild(summary);
    v.appendChild(list);
    v.appendChild(nextButton('timeline', 'Next: build the record of truth →'));

    function draw() {
      drawSummary();
      drawList();
      renderNav();
      growAll(list);
    }

    function drawSummary() {
      clear(summary);
      if (!state.demands.length) return;
      var counts = { must: 0, important: 0, nice: 0 };
      state.demands.forEach(function (d) { counts[d.tier]++; });
      var p = panel(null, null);
      var g = el('div', 'stat-grid');
      g.appendChild(stat('Must have', String(counts.must), 'No agreement is worth signing without these.'));
      g.appendChild(stat('Important', String(counts.important), 'Push hard, trade only for real movement.'));
      g.appendChild(stat('Nice to have', String(counts.nice), 'Your natural bargaining chips.'));
      p.appendChild(g);
      var top = state.demands[0];
      if (has(top.title)) {
        p.appendChild(el('div', 'callout', 'Your number one priority is <b>' + escapeHtml(top.title) +
          '</b>. If the negotiation drifts, this is the thing to steer it back to.'));
      }
      if (!counts.nice && state.demands.length > 1) {
        p.appendChild(el('div', 'callout warn',
          'Nothing is marked <b>nice to have</b>. A list where everything is essential leaves you no room to trade — ' +
          'and reads as unreasonable across the table.'));
      }
      summary.appendChild(p);
    }

    function drawList() {
      clear(list);
      if (!state.demands.length) {
        list.appendChild(emptyState('No demands yet. Start with the obvious one — the thing that made you open this tool — ' +
          'then add the smaller items you would also like settled.'));
        return;
      }
      state.demands.forEach(function (d, idx) {
        var card = makeCard(d.id, '#' + (idx + 1), d.title, demandBadges(d), [
          { label: '▲', title: 'Move up', fn: function () { if (move(state.demands, d, -1)) { markDirty(); draw(); } } },
          { label: '▼', title: 'Move down', fn: function () { if (move(state.demands, d, 1)) { markDirty(); draw(); } } },
          {
            label: '✕', title: 'Delete this demand', danger: true, fn: function () {
              uiConfirm('Delete this demand?', has(d.title) ? d.title : 'It is still untitled.', 'Delete').then(function (ok) {
                if (!ok) return;
                state.demands = state.demands.filter(function (x) { return x !== d; });
                markDirty();
                draw();
              });
            }
          }
        ]);
        attachDnd(card, state.demands, idx, draw);

        var b = card._body;
        function head() {
          card._setTitle(d.title);
          card._setBadges(demandBadges(d));
          drawSummary();
          renderNav();
        }

        b.appendChild(makeField('What do you want?', 'one thing per card',
          textControl(d, 'title', 'e.g. Payment of the final invoice', head)));
        b.appendChild(row(
          makeField('Kind of demand', '', selectControl(d, 'category', CATEGORY_OPTS, head)),
          makeField('How important is it?', '', selectControl(d, 'tier', TIER_OPTS, head))
        ));
        b.appendChild(makeField('Specification', 'exactly what "done" looks like — amount, quality, standard, format',
          areaControl(d, 'spec', 'e.g. $38,400 including GST, paid in cleared funds to the trading account, no deductions.', null, '80px')));
        b.appendChild(row(
          makeField('By when?', 'a date or a trigger', textControl(d, 'when', 'e.g. Within 14 days of signing', null)),
          makeField('Who does it, and how?', '', textControl(d, 'who', 'e.g. Their finance team, by bank transfer', null))
        ));
        b.appendChild(makeField('How will you know it has been done?', 'the proof you will accept',
          textControl(d, 'proof', 'e.g. Funds cleared in the account and a remittance advice emailed', null)));

        var pos = el('div');
        pos.appendChild(el('div', 'panel-sub', 'Three positions for this item. Open above your target; never let the ' +
          'conversation drag you below your minimum without something in return.'));
        pos.appendChild(row(
          makeField('Opening ask', '', textControl(d, 'opening', 'e.g. Full invoice + interest', null)),
          makeField('Realistic target', '', textControl(d, 'target', 'e.g. Full invoice', null)),
          makeField('Minimum acceptable', '', textControl(d, 'minimum', 'e.g. 85% within 30 days', null))
        ));
        b.appendChild(pos);

        b.appendChild(makeField('Why you are entitled to it', 'the argument in one or two lines',
          areaControl(d, 'why', 'e.g. Clause 14 of the contract; the work passed inspection on 3 March.', null, '62px')));

        if (state.events.length) {
          var picker = el('div', 'chip-picker');
          sortedEvents().forEach(function (ev) {
            var on = d.support.indexOf(ev.id) !== -1;
            var chip = el('button', 'chip' + (on ? ' on' : ''),
              escapeHtml(fmtDate(ev.date) + ' — ' + (has(ev.title) ? ev.title : 'untitled event')));
            chip.addEventListener('click', function () {
              var i = d.support.indexOf(ev.id);
              if (i === -1) d.support.push(ev.id); else d.support.splice(i, 1);
              chip.classList.toggle('on');
              markDirty();
            });
            picker.appendChild(chip);
          });
          b.appendChild(makeField('Backed up by which events?', 'from your timeline', picker));
        }

        list.appendChild(card);
      });
    }

    draw();
  }

  function demandBadges(d) {
    return [
      { text: TIER_LABEL[d.tier] || '', cls: d.tier },
      { text: CATEGORY_LABEL[d.category] || '', cls: 'muted' }
    ];
  }

  /* =====================================================================
     STEP 3 — record of truth
     ===================================================================== */

  function sortedEvents() {
    return state.events.slice().sort(function (a, b) {
      var ad = has(a.date) ? a.date : '9999-99-99';
      var bd = has(b.date) ? b.date : '9999-99-99';
      if (ad < bd) return -1;
      if (ad > bd) return 1;
      return 0;
    });
  }

  function renderTimeline(v) {
    v.appendChild(sectionHead('Step 3', 'The record of truth',
      'Facts win arguments that opinions lose. Put every event that matters on the timeline, in order, and note the ' +
      'evidence that proves it — including <b>where that evidence is kept</b>, so you can lay hands on it in the room. ' +
      'Events sort themselves by date as you add them.'));

    var bar = el('div', 'list-toolbar no-print');
    var add = el('button', 'btn primary', '+ Add an event');
    add.addEventListener('click', function () {
      var e = {
        id: uid('ev'), date: todayIso(), title: '', type: 'other', what: '', who: '',
        status: 'unverified', key: false, evidence: []
      };
      state.events.push(e);
      ui.collapsed[e.id] = false;
      markDirty();
      draw();
      var f = list.querySelector('[data-id="' + e.id + '"] input[type="text"]');
      if (f) f.focus();
    });
    bar.appendChild(add);
    bar.appendChild(el('span', 'spacer'));
    v.appendChild(bar);

    var summary = el('div');
    var list = el('div', 'tl');
    var register = el('div');
    v.appendChild(summary);
    v.appendChild(list);
    v.appendChild(register);
    v.appendChild(nextButton('concessions', 'Next: what can you trade? →'));

    function draw() {
      drawSummary();
      drawList();
      drawRegister();
      renderNav();
      growAll(list);
    }

    function drawSummary() {
      clear(summary);
      if (!state.events.length) return;
      var keyN = 0, disputed = 0, unevidenced = 0;
      state.events.forEach(function (e) {
        if (e.key) keyN++;
        if (e.status === 'disputed') disputed++;
        if ((e.key || e.status === 'disputed') && !e.evidence.length) unevidenced++;
      });
      var p = panel(null, null);
      var g = el('div', 'stat-grid');
      g.appendChild(stat('Events', String(state.events.length), 'On the timeline.'));
      g.appendChild(stat('Key moments', String(keyN), 'The ones the whole case turns on.'));
      g.appendChild(stat('Disputed', String(disputed), 'They tell it differently.'));
      g.appendChild(stat('Evidence items', String(countEvidence()), 'Attached across all events.'));
      p.appendChild(g);
      if (unevidenced) {
        p.appendChild(el('div', 'callout warn', '<b>' + unevidenced + '</b> key or disputed event' +
          (unevidenced === 1 ? ' has' : 's have') + ' no evidence attached. Those are the points where you will be asked ' +
          '“how do you know?” — find something before you get there.'));
      }
      summary.appendChild(p);
    }

    function drawList() {
      clear(list);
      if (!state.events.length) {
        list.appendChild(emptyState('The timeline is empty. Start at the beginning — the agreement, the order, the ' +
          'handshake — and work forward to today.'));
        return;
      }
      sortedEvents().forEach(function (e) {
        var badges = [{ text: fmtDate(e.date), cls: 'info' }];
        if (e.key) badges.push({ text: 'Key', cls: 'warn' });
        if (e.status === 'disputed') badges.push({ text: 'Disputed', cls: 'danger' });
        else if (e.status === 'agreed') badges.push({ text: 'Agreed', cls: 'good' });
        badges.push({ text: e.evidence.length + ' evid.', cls: e.evidence.length ? '' : 'muted' });

        var node = el('div', 'tl-node');
        var card = makeCard(e.id, null, e.title, badges, [
          {
            label: '✕', title: 'Delete this event', danger: true, fn: function () {
              uiConfirm('Delete this event?', 'Its evidence entries go with it.', 'Delete').then(function (ok) {
                if (!ok) return;
                state.events = state.events.filter(function (x) { return x !== e; });
                state.demands.forEach(function (d) {
                  d.support = d.support.filter(function (id) { return id !== e.id; });
                });
                markDirty();
                draw();
              });
            }
          }
        ]);
        if (e.key) node.classList.add('is-key');
        if (e.status === 'disputed') node.classList.add('is-disputed');
        card._grip.style.display = 'none';   // order comes from the dates

        var b = card._body;
        function head() {
          card._setTitle(e.title);
          var bs = [{ text: fmtDate(e.date), cls: 'info' }];
          if (e.key) bs.push({ text: 'Key', cls: 'warn' });
          if (e.status === 'disputed') bs.push({ text: 'Disputed', cls: 'danger' });
          else if (e.status === 'agreed') bs.push({ text: 'Agreed', cls: 'good' });
          bs.push({ text: e.evidence.length + ' evid.', cls: e.evidence.length ? '' : 'muted' });
          card._setBadges(bs);
          node.classList.toggle('is-key', !!e.key);
          node.classList.toggle('is-disputed', e.status === 'disputed');
          drawSummary();
          drawRegister();
          renderNav();
        }

        b.appendChild(row(
          makeField('Date', '', textControl(e, 'date', '', function () { markDirty(); head(); }, 'date')),
          makeField('What happened?', 'a headline', textControl(e, 'title', 'e.g. Final invoice issued', head))
        ));
        b.appendChild(row(
          makeField('Type of event', '', selectControl(e, 'type', EVENT_TYPE_OPTS, head)),
          makeField('Where does it stand?', '', selectControl(e, 'status', EVENT_STATUS_OPTS, head))
        ));
        b.appendChild(makeField('Detail', 'what was said, done, sent or agreed',
          areaControl(e, 'what', 'Facts only. Save the interpretation for your argument.', null, '80px')));
        b.appendChild(row(
          makeField('Who was involved?', '', textControl(e, 'who', 'e.g. Me, J. Patel (site manager)', null)),
          makeField('', '', checkControl('This is a key moment in the dispute', e, 'key', head))
        ));

        /* evidence */
        var evHead = el('div', 'ev-head');
        evHead.appendChild(document.createTextNode('Evidence for this event'));
        evHead.appendChild(el('span', 'spacer'));
        var addEv = el('button', 'btn tiny', '+ Add evidence');
        evHead.appendChild(addEv);
        b.appendChild(evHead);

        var evList = el('div', 'ev-list');
        b.appendChild(evList);

        addEv.addEventListener('click', function () {
          e.evidence.push({
            id: uid('vd'), label: '', type: 'document', where: '', link: '',
            strength: 'moderate', theyHave: false, notes: ''
          });
          markDirty();
          drawEvidence();
          head();
        });

        function drawEvidence() {
          clear(evList);
          if (!e.evidence.length) {
            var n = el('div', 'panel-sub', 'Nothing attached. Even a note saying “no record kept” is worth writing down — ' +
              'it tells you where you are exposed.');
            n.style.marginBottom = '0';
            evList.appendChild(n);
            return;
          }
          e.evidence.forEach(function (ev) {
            var item = el('div', 'ev-item ' + (ev.strength === 'strong' ? 'strong' : ev.strength === 'weak' ? 'weak' : ''));
            var top = el('div', 'ev-top');
            top.appendChild(el('span', 'ev-title', escapeHtml(has(ev.label) ? ev.label : 'New evidence item')));
            var rm = el('button', 'btn tiny danger', '✕');
            rm.title = 'Remove this evidence';
            rm.addEventListener('click', function () {
              e.evidence = e.evidence.filter(function (x) { return x !== ev; });
              markDirty();
              drawEvidence();
              head();
            });
            top.appendChild(rm);
            item.appendChild(top);

            item.appendChild(row(
              makeField('What is it?', '', textControl(ev, 'label', 'e.g. Signed variation order VO-12', function () {
                top.querySelector('.ev-title').textContent = has(ev.label) ? ev.label : 'New evidence item';
                head();
              })),
              makeField('Kind', '', selectControl(ev, 'type', EVIDENCE_TYPE_OPTS, head))
            ));
            item.appendChild(row(
              makeField('Where is it kept?', 'so you can produce it on the day',
                textControl(ev, 'where', 'e.g. Dropbox / Riverside / Variations, and a printed copy in the red folder', head)),
              makeField('Link', 'optional', textControl(ev, 'link', 'https://…', head, 'url'))
            ));
            item.appendChild(row(
              makeField('How strong is it?', '', selectControl(ev, 'strength', STRENGTH_OPTS, function () {
                item.className = 'ev-item ' + (ev.strength === 'strong' ? 'strong' : ev.strength === 'weak' ? 'weak' : '');
                head();
              })),
              makeField('', '', checkControl('They have a copy too', ev, 'theyHave', head))
            ));
            item.appendChild(makeField('Notes', 'what it proves, and any weakness in it',
              textControl(ev, 'notes', 'e.g. Proves they approved the extra work — but it is unsigned by their PM', head)));
            evList.appendChild(item);
          });
        }
        drawEvidence();

        node.appendChild(card);
        list.appendChild(node);
      });
    }

    function drawRegister() {
      clear(register);
      if (!countEvidence()) return;
      var p = panel('Evidence register', 'Everything you have, in one list — hand this to a lawyer or take it into the room.');
      var scroll = el('div', 'table-scroll');
      var t = el('table', 'reg');
      t.innerHTML = '<thead><tr><th>Evidence</th><th>Kind</th><th>Relates to</th><th>Stored</th><th>Strength</th></tr></thead>';
      var tb = document.createElement('tbody');
      sortedEvents().forEach(function (e) {
        e.evidence.forEach(function (ev) {
          var tr = document.createElement('tr');
          var where = escapeHtml(ev.where);
          if (has(ev.link)) {
            where += (has(ev.where) ? '<br>' : '') + '<a href="' + escapeHtml(ev.link) + '" target="_blank" rel="noopener">link</a>';
          }
          tr.innerHTML =
            '<td><b>' + escapeHtml(has(ev.label) ? ev.label : '(unnamed)') + '</b>' +
            (has(ev.notes) ? '<br><span style="color:#6E6E73">' + escapeHtml(ev.notes) + '</span>' : '') + '</td>' +
            '<td>' + escapeHtml(EVIDENCE_TYPE_LABEL[ev.type] || ev.type) + '</td>' +
            '<td>' + escapeHtml(fmtDate(e.date)) + '<br>' + escapeHtml(has(e.title) ? e.title : '(untitled event)') + '</td>' +
            '<td>' + (where || '<span style="color:#D97706">not recorded</span>') + '</td>' +
            '<td>' + escapeHtml(STRENGTH_LABEL[ev.strength] || ev.strength) + (ev.theyHave ? '<br><span style="color:#6E6E73">they have it</span>' : '') + '</td>';
          tb.appendChild(tr);
        });
      });
      t.appendChild(tb);
      scroll.appendChild(t);
      p.appendChild(scroll);
      register.appendChild(p);
    }

    draw();
  }

  /* =====================================================================
     STEP 4 — concessions
     ===================================================================== */

  function chipVerdict(c) {
    var d = (c.value || 0) - (c.cost || 0);
    if (d >= 2) return { text: 'Ideal chip', cls: 'good' };
    if (d === 1) return { text: 'Good value', cls: 'good' };
    if (d === 0) return { text: 'Even trade', cls: '' };
    if (d === -1) return { text: 'Costly', cls: 'warn' };
    return { text: 'Expensive', cls: 'danger' };
  }

  function demandTitle(id) {
    var d = null;
    state.demands.forEach(function (x) { if (x.id === id) d = x; });
    if (!d) return null;
    return has(d.title) ? d.title : 'Untitled demand';
  }

  function renderConcessions(v) {
    v.appendChild(sectionHead('Step 4', 'Concessions — your bargaining chips',
      'Nobody signs a deal that only serves the other side. Work out what you can give away, what each thing really ' +
      'costs you, and what it is worth to them. The best chips are <b>cheap for you and valuable to them</b> — and ' +
      'every one of them should be spent buying something off your demands list, never given away to be nice.'));

    var bar = el('div', 'list-toolbar no-print');
    var add = el('button', 'btn primary', '+ Add a concession');
    add.addEventListener('click', function () {
      var c = {
        id: uid('cn'), label: '', detail: '', cost: 2, value: 4,
        condition: '', tradeFor: '', stage: 'mid', status: 'available'
      };
      state.concessions.push(c);
      ui.collapsed[c.id] = false;
      markDirty();
      draw();
      var f = list.querySelector('[data-id="' + c.id + '"] input');
      if (f) f.focus();
    });
    bar.appendChild(add);
    var sortBtn = el('button', 'btn small', 'Best chips first');
    sortBtn.title = 'Order by leverage: cheap for you, valuable to them';
    sortBtn.addEventListener('click', function () {
      state.concessions.sort(function (a, b) {
        return ((b.value || 0) - (b.cost || 0)) - ((a.value || 0) - (a.cost || 0));
      });
      markDirty();
      draw();
      toast('Sorted by leverage.');
    });
    bar.appendChild(sortBtn);
    v.appendChild(bar);

    var summary = el('div');
    var list = el('div');
    var redPanel = el('div');
    v.appendChild(summary);
    v.appendChild(list);
    v.appendChild(redPanel);
    v.appendChild(nextButton('brief', 'Next: read the whole brief →'));

    function draw() {
      drawSummary();
      drawList();
      renderNav();
      growAll(list);
    }

    function drawSummary() {
      clear(summary);
      if (!state.concessions.length) return;
      var best = null, unlinked = 0;
      state.concessions.forEach(function (c) {
        if (!has(c.tradeFor) || !demandTitle(c.tradeFor)) unlinked++;
        var lev = (c.value || 0) - (c.cost || 0);
        if (!best || lev > (best.value - best.cost)) best = c;
      });
      var p = panel(null, null);
      var g = el('div', 'stat-grid');
      g.appendChild(stat('Chips on hand', String(state.concessions.length), 'Things you could offer.'));
      g.appendChild(stat('Best chip', best && has(best.label) ? best.label : '—',
        best ? 'Costs you ' + best.cost + '/5, worth ' + best.value + '/5 to them.' : ''));
      g.appendChild(stat('Red lines', String(state.redlines.length), 'Things you will not trade at any price.'));
      p.appendChild(g);
      if (unlinked) {
        p.appendChild(el('div', 'callout warn', '<b>' + unlinked + '</b> concession' + (unlinked === 1 ? ' is' : 's are') +
          ' not tied to anything you want in return. A concession given for free is not a concession — it is a discount. ' +
          'Set “what it should buy” on each one.'));
      }
      summary.appendChild(p);
    }

    function drawList() {
      clear(list);
      if (!state.concessions.length) {
        list.appendChild(emptyState('No concessions yet. Think about timing, publicity, paperwork, future work, ' +
          'interest, instalments, and anything on your demands list marked “nice to have”.'));
        return;
      }
      state.concessions.forEach(function (c, idx) {
        var card = makeCard(c.id, '#' + (idx + 1), c.label, concessionBadges(c), [
          { label: '▲', title: 'Move up', fn: function () { if (move(state.concessions, c, -1)) { markDirty(); draw(); } } },
          { label: '▼', title: 'Move down', fn: function () { if (move(state.concessions, c, 1)) { markDirty(); draw(); } } },
          {
            label: '✕', title: 'Delete this concession', danger: true, fn: function () {
              uiConfirm('Delete this concession?', has(c.label) ? c.label : 'It is still untitled.', 'Delete').then(function (ok) {
                if (!ok) return;
                state.concessions = state.concessions.filter(function (x) { return x !== c; });
                markDirty();
                draw();
              });
            }
          }
        ]);
        attachDnd(card, state.concessions, idx, draw);

        var b = card._body;
        function head() {
          card._setTitle(c.label);
          card._setBadges(concessionBadges(c));
          drawSummary();
          renderNav();
        }

        b.appendChild(makeField('What could you offer?', '',
          textControl(c, 'label', 'e.g. Accept payment in three monthly instalments', head)));
        b.appendChild(makeField('The detail', 'exactly what you would be agreeing to',
          areaControl(c, 'detail', 'e.g. 40% on signing, then two equal payments at 30 and 60 days, interest waived if kept to.', null, '70px')));
        b.appendChild(row(
          makeField('What it costs you', '1 = nothing, 5 = a great deal', scaleControl(c, 'cost', head)),
          makeField('What it is worth to them', 'your honest guess', scaleControl(c, 'value', head))
        ));

        var demandOpts = [{ v: '', l: '— not tied to anything yet —' }].concat(state.demands.map(function (d, i) {
          return { v: d.id, l: '#' + (i + 1) + ' ' + (has(d.title) ? d.title : 'Untitled demand') };
        }));
        b.appendChild(row(
          makeField('What should it buy you?', 'from your demands list', selectControl(c, 'tradeFor', demandOpts, head)),
          makeField('When would you play it?', '', selectControl(c, 'stage', STAGE_OPTS, head))
        ));
        b.appendChild(row(
          makeField('Strings attached', 'the condition you would put on it',
            textControl(c, 'condition', 'e.g. Only if they confirm the full amount in writing first', null)),
          makeField('Where it stands', '', selectControl(c, 'status', STATUS_OPTS, head))
        ));

        var vd = chipVerdict(c);
        var note = el('div', 'callout' + (vd.cls === 'danger' ? ' danger' : vd.cls === 'warn' ? ' warn' : ''));
        note.innerHTML = vd.text === 'Ideal chip'
          ? 'Cheap for you, valuable to them. Lead with this — it buys goodwill you can spend later.'
          : vd.text === 'Expensive'
            ? 'This costs you more than it is worth to them. Keep it back; if you have to use it, make sure it closes the deal outright.'
            : 'Trade this for something real. Name what you expect in return in the same sentence you offer it.';
        b.appendChild(note);

        list.appendChild(card);
      });
    }

    /* red lines */
    var rp = panel('Red lines', 'The things you will not agree to, whatever is offered. Write them down now, while you are calm.');
    var rl = el('div');
    rp.appendChild(rl);
    var addRl = el('button', 'btn small', '+ Add a red line');
    addRl.addEventListener('click', function () {
      state.redlines.push({ id: uid('rl'), text: '' });
      markDirty();
      drawRed();
      var inputs = rl.querySelectorAll('input');
      if (inputs.length) inputs[inputs.length - 1].focus();
    });
    rp.appendChild(addRl);
    redPanel.appendChild(rp);

    function drawRed() {
      clear(rl);
      if (!state.redlines.length) {
        var n = el('div', 'panel-sub', 'None set — e.g. “No confidentiality clause that stops me warning others”, ' +
          '“No admission of fault”.');
        rl.appendChild(n);
      }
      state.redlines.forEach(function (r) {
        var w = el('div', 'redline-row');
        w.appendChild(textControl(r, 'text', 'e.g. I will not sign away the warranty claim', function () { renderNav(); }));
        var rm = el('button', 'btn tiny danger', '✕');
        rm.addEventListener('click', function () {
          state.redlines = state.redlines.filter(function (x) { return x !== r; });
          markDirty();
          drawRed();
        });
        w.appendChild(rm);
        rl.appendChild(w);
      });
    }
    drawRed();

    draw();
  }

  function concessionBadges(c) {
    var vd = chipVerdict(c);
    var b = [
      { text: vd.text, cls: vd.cls },
      { text: STAGE_LABEL[c.stage] || '', cls: 'muted' }
    ];
    if (c.status !== 'available') b.push({ text: STATUS_LABEL[c.status] || '', cls: 'info' });
    return b;
  }

  /* =====================================================================
     STEP 5 — the brief
     ===================================================================== */

  function readiness() {
    var c = computeAlt();
    var out = [];
    function add(ok, text) { out.push({ ok: ok, text: text }); }

    add(has(state.matter.title) && has(state.matter.otherParty), 'The dispute and the other party are named.');
    add(has(state.alt.best.desc) && has(state.alt.worst.desc), 'Both your best and worst outcomes without a deal are described.');
    add(c.reservation !== null, 'You have a walk-away figure, so you know when to say no.');

    var noMin = state.demands.filter(function (d) { return !has(d.minimum); }).length;
    add(state.demands.length > 0, state.demands.length ? state.demands.length + ' demands recorded.' : 'No demands recorded yet.');
    add(state.demands.length > 0 && noMin === 0,
      noMin ? noMin + ' demand' + (noMin === 1 ? '' : 's') + ' with no minimum acceptable position.' : 'Every demand has a minimum you would accept.');
    var noSpec = state.demands.filter(function (d) { return !has(d.spec); }).length;
    add(state.demands.length > 0 && noSpec === 0,
      noSpec ? noSpec + ' demand' + (noSpec === 1 ? '' : 's') + ' without a specification — “done” is undefined.' : 'Every demand is specified.');

    add(state.events.length > 0, state.events.length ? state.events.length + ' events on the timeline.' : 'The timeline is empty.');
    var bare = state.events.filter(function (e) { return (e.key || e.status === 'disputed') && !e.evidence.length; }).length;
    add(state.events.length > 0 && bare === 0,
      bare ? bare + ' key or disputed event' + (bare === 1 ? '' : 's') + ' with no evidence.' : 'Every key or disputed event has evidence attached.');
    var noWhere = 0;
    state.events.forEach(function (e) {
      e.evidence.forEach(function (ev) { if (!has(ev.where) && !has(ev.link)) noWhere++; });
    });
    add(countEvidence() > 0 && noWhere === 0,
      noWhere ? noWhere + ' evidence item' + (noWhere === 1 ? '' : 's') + ' with no storage location recorded.'
        : countEvidence() ? 'Every evidence item says where it is kept.' : 'No evidence recorded yet.');

    add(state.concessions.length > 0, state.concessions.length ? state.concessions.length + ' concessions prepared.' : 'No concessions prepared — you have nothing to trade.');
    var unlinked = state.concessions.filter(function (x) { return !has(x.tradeFor) || !demandTitle(x.tradeFor); }).length;
    add(state.concessions.length > 0 && unlinked === 0,
      unlinked ? unlinked + ' concession' + (unlinked === 1 ? '' : 's') + ' not tied to anything you want in return.' : 'Every concession is tied to a demand.');
    add(state.redlines.length > 0, state.redlines.length ? state.redlines.length + ' red line' + (state.redlines.length === 1 ? '' : 's') + ' set.' : 'No red lines set.');

    return out;
  }

  function buildBriefHtml() {
    var m = state.matter, c = computeAlt(), h = [];
    function esc(s) { return escapeHtml(s); }
    function para(label, text) {
      return has(text) ? '<p><b>' + esc(label) + '</b> ' + esc(text).replace(/\n/g, '<br>') + '</p>' : '';
    }

    h.push('<h2>The dispute</h2>');
    h.push('<h3>' + esc(has(m.title) ? m.title : 'Untitled dispute') + '</h3>');
    var line = [];
    if (has(m.otherParty)) line.push('Against <b>' + esc(m.otherParty) + '</b>');
    if (has(m.myRole)) line.push('as ' + esc(m.myRole));
    if (has(m.deadline)) line.push('deadline: ' + esc(m.deadline));
    if (has(m.forum)) line.push('forum: ' + esc(m.forum));
    if (line.length) h.push('<p class="muted">' + line.join(' &middot; ') + '</p>');
    if (has(m.summary)) h.push('<p>' + esc(m.summary).replace(/\n/g, '<br>') + '</p>');

    h.push('<h2>Readiness check</h2><ul class="check-list">');
    readiness().forEach(function (r) {
      h.push('<li class="' + (r.ok ? 'ok' : 'gap') + '"><span class="ic">' + (r.ok ? '&#10003;' : '!') + '</span><span>' + esc(r.text) + '</span></li>');
    });
    h.push('</ul>');

    h.push('<h2>The bottom line</h2>');
    h.push('<p><b>Walk-away line:</b> ' + esc(c.reservation !== null ? fmtMoney(c.reservation) : 'not set') +
      ' &nbsp;&middot;&nbsp; <b>Target:</b> ' + esc(c.target !== null ? fmtMoney(c.target) : 'not set') +
      ' &nbsp;&middot;&nbsp; <b>At stake:</b> ' + esc(c.spread !== null ? fmtMoney(c.spread) : 'not calculated') + '</p>');
    if (c.reservation !== null) {
      h.push('<p>Reject anything worth less than <b>' + esc(fmtMoney(c.reservation)) + '</b> — below that line you are ' +
        'better off taking your chances without an agreement.</p>');
    }

    h.push('<h2>If there is no agreement</h2>');
    h.push(para('Best realistic outcome (BATNA):', state.alt.best.desc));
    if (isNum(state.alt.best.value)) h.push('<p class="muted">Worth ' + esc(fmtMoney(state.alt.best.value)) + ' &middot; ' + esc(String(state.alt.best.prob || 0)) + '% likely</p>');
    h.push(para('Most likely outcome:', state.alt.likely.desc));
    if (isNum(state.alt.likely.value)) h.push('<p class="muted">Worth ' + esc(fmtMoney(state.alt.likely.value)) + ' &middot; ' + esc(String(state.alt.likely.prob || 0)) + '% likely</p>');
    h.push(para('Worst realistic outcome (WATNA):', state.alt.worst.desc));
    if (isNum(state.alt.worst.value)) h.push('<p class="muted">Worth ' + esc(fmtMoney(state.alt.worst.value)) + ' &middot; ' + esc(String(state.alt.worst.prob || 0)) + '% likely</p>');

    if (state.alt.stakes.length) {
      h.push('<h3>Also at stake</h3><ul>');
      state.alt.stakes.forEach(function (s) {
        if (!has(s.label) && !has(s.notes)) return;
        h.push('<li><b>' + esc(s.label) + '</b> (' + esc(s.impact) + ' impact)' + (has(s.notes) ? ' — ' + esc(s.notes) : '') + '</li>');
      });
      h.push('</ul>');
    }
    var th = state.alt.theirs;
    if (has(th.best) || has(th.worst) || has(th.pressure)) {
      h.push('<h3>Their position, as best you can tell</h3>');
      h.push(para('Their best without a deal:', th.best));
      h.push(para('Their worst without a deal:', th.worst));
      h.push(para('Pressure they are under:', th.pressure));
    }

    h.push('<h2>What you want, in order</h2>');
    if (!state.demands.length) {
      h.push('<p class="muted">Nothing recorded.</p>');
    } else {
      state.demands.forEach(function (d, i) {
        h.push('<div class="b-item ' + esc(d.tier) + '">');
        h.push('<div class="b-title">' + (i + 1) + '. ' + esc(has(d.title) ? d.title : 'Untitled demand') + '</div>');
        var meta = [TIER_LABEL[d.tier] || '', CATEGORY_LABEL[d.category] || ''];
        if (has(d.when)) meta.push('by ' + d.when);
        if (has(d.who)) meta.push(d.who);
        h.push('<div class="b-meta">' + esc(meta.filter(has).join(' · ')) + '</div>');
        if (has(d.spec)) h.push('<div class="b-detail"><b>Specification:</b> ' + esc(d.spec).replace(/\n/g, '<br>') + '</div>');
        if (has(d.proof)) h.push('<div class="b-detail"><b>Proof it is done:</b> ' + esc(d.proof) + '</div>');
        var pos = [];
        if (has(d.opening)) pos.push('open at ' + d.opening);
        if (has(d.target)) pos.push('target ' + d.target);
        if (has(d.minimum)) pos.push('minimum ' + d.minimum);
        if (pos.length) h.push('<div class="b-detail"><b>Positions:</b> ' + esc(pos.join(' → ')) + '</div>');
        if (has(d.why)) h.push('<div class="b-detail"><b>Why:</b> ' + esc(d.why) + '</div>');
        var sup = (d.support || []).map(function (id) {
          var found = null;
          state.events.forEach(function (e) { if (e.id === id) found = e; });
          return found ? fmtDate(found.date) + ' ' + (has(found.title) ? found.title : 'event') : null;
        }).filter(Boolean);
        if (sup.length) h.push('<div class="b-detail muted"><b>Backed by:</b> ' + esc(sup.join('; ')) + '</div>');
        h.push('</div>');
      });
    }

    h.push('<h2>Record of truth</h2>');
    if (!state.events.length) {
      h.push('<p class="muted">No events recorded.</p>');
    } else {
      sortedEvents().forEach(function (e) {
        var tags = [EVENT_TYPE_LABEL[e.type] || ''];
        if (e.key) tags.push('KEY');
        tags.push(EVENT_STATUS_LABEL[e.status] || '');
        h.push('<div class="b-item">');
        h.push('<div class="b-title">' + esc(fmtDate(e.date)) + ' — ' + esc(has(e.title) ? e.title : 'Untitled event') + '</div>');
        h.push('<div class="b-meta">' + esc(tags.filter(has).join(' · ')) + (has(e.who) ? ' · ' + esc(e.who) : '') + '</div>');
        if (has(e.what)) h.push('<div class="b-detail">' + esc(e.what).replace(/\n/g, '<br>') + '</div>');
        if (e.evidence.length) {
          h.push('<div class="b-detail"><b>Evidence:</b> ' + esc(e.evidence.map(function (v) {
            return (has(v.label) ? v.label : 'unnamed') + ' (' + (STRENGTH_LABEL[v.strength] || '') + ')';
          }).join('; ')) + '</div>');
        } else if (e.key || e.status === 'disputed') {
          h.push('<div class="b-detail muted"><b>Evidence:</b> none attached</div>');
        }
        h.push('</div>');
      });
    }

    if (countEvidence()) {
      h.push('<h2>Evidence register</h2>');
      h.push('<div class="table-scroll"><table class="reg"><thead><tr><th>Evidence</th><th>Kind</th><th>Relates to</th><th>Stored</th><th>Strength</th></tr></thead><tbody>');
      sortedEvents().forEach(function (e) {
        e.evidence.forEach(function (v) {
          h.push('<tr><td><b>' + esc(has(v.label) ? v.label : '(unnamed)') + '</b>' +
            (has(v.notes) ? '<br><span class="muted">' + esc(v.notes) + '</span>' : '') + '</td>' +
            '<td>' + esc(EVIDENCE_TYPE_LABEL[v.type] || v.type) + '</td>' +
            '<td>' + esc(fmtDate(e.date)) + '<br>' + esc(has(e.title) ? e.title : '(untitled)') + '</td>' +
            '<td>' + esc(v.where) + (has(v.link) ? '<br>' + esc(v.link) : '') + '</td>' +
            '<td>' + esc(STRENGTH_LABEL[v.strength] || v.strength) + (v.theyHave ? '<br><span class="muted">they have it</span>' : '') + '</td></tr>');
        });
      });
      h.push('</tbody></table></div>');
    }

    h.push('<h2>What you can trade</h2>');
    if (!state.concessions.length) {
      h.push('<p class="muted">No concessions prepared.</p>');
    } else {
      ['open', 'mid', 'close', 'last'].forEach(function (stage) {
        var group = state.concessions.filter(function (x) { return x.stage === stage; });
        if (!group.length) return;
        h.push('<h3>' + esc(STAGE_LABEL[stage]) + '</h3>');
        group.forEach(function (x) {
          h.push('<div class="b-item">');
          h.push('<div class="b-title">' + esc(has(x.label) ? x.label : 'Untitled concession') + '</div>');
          var buys = demandTitle(x.tradeFor);
          var meta = ['costs you ' + (x.cost || '?') + '/5', 'worth ' + (x.value || '?') + '/5 to them', chipVerdict(x).text];
          if (x.status !== 'available') meta.push(STATUS_LABEL[x.status]);
          h.push('<div class="b-meta">' + esc(meta.join(' · ')) + '</div>');
          if (has(x.detail)) h.push('<div class="b-detail">' + esc(x.detail).replace(/\n/g, '<br>') + '</div>');
          h.push('<div class="b-detail"><b>Buys:</b> ' + esc(buys || 'nothing yet — do not give this away for free') + '</div>');
          if (has(x.condition)) h.push('<div class="b-detail"><b>Only if:</b> ' + esc(x.condition) + '</div>');
          h.push('</div>');
        });
      });
    }

    h.push('<h2>Red lines</h2>');
    if (!state.redlines.length) {
      h.push('<p class="muted">None set.</p>');
    } else {
      h.push('<ul>');
      state.redlines.forEach(function (r) { if (has(r.text)) h.push('<li>' + esc(r.text) + '</li>'); });
      h.push('</ul>');
    }

    return h.join('\n');
  }

  function buildBriefText() {
    var m = state.matter, c = computeAlt(), out = [];
    function line(s) { out.push(s == null ? '' : String(s)); }
    function heading(s) { line(''); line(s.toUpperCase()); line(new Array(s.length + 1).join('=')); }

    line((has(m.title) ? m.title : 'Untitled dispute') + (has(m.otherParty) ? ' — against ' + m.otherParty : ''));
    if (has(m.deadline)) line('Deadline: ' + m.deadline);
    if (has(m.summary)) { line(''); line(m.summary); }

    heading('The bottom line');
    line('Walk-away line: ' + (c.reservation !== null ? fmtMoney(c.reservation) : 'not set'));
    line('Target: ' + (c.target !== null ? fmtMoney(c.target) : 'not set'));
    line('At stake: ' + (c.spread !== null ? fmtMoney(c.spread) : 'not calculated'));

    heading('If there is no agreement');
    line('BATNA (best): ' + (has(state.alt.best.desc) ? state.alt.best.desc : '—') + (isNum(state.alt.best.value) ? ' [' + fmtMoney(state.alt.best.value) + ']' : ''));
    line('Most likely: ' + (has(state.alt.likely.desc) ? state.alt.likely.desc : '—') + (isNum(state.alt.likely.value) ? ' [' + fmtMoney(state.alt.likely.value) + ']' : ''));
    line('WATNA (worst): ' + (has(state.alt.worst.desc) ? state.alt.worst.desc : '—') + (isNum(state.alt.worst.value) ? ' [' + fmtMoney(state.alt.worst.value) + ']' : ''));

    heading('What you want, in order');
    if (!state.demands.length) line('(nothing recorded)');
    state.demands.forEach(function (d, i) {
      line((i + 1) + '. ' + (has(d.title) ? d.title : 'Untitled') + '  [' + (TIER_LABEL[d.tier] || '') + ']');
      if (has(d.spec)) line('   Spec: ' + d.spec.replace(/\n/g, ' '));
      if (has(d.when)) line('   By: ' + d.when);
      if (has(d.proof)) line('   Proof: ' + d.proof);
      var pos = [];
      if (has(d.opening)) pos.push('open ' + d.opening);
      if (has(d.target)) pos.push('target ' + d.target);
      if (has(d.minimum)) pos.push('min ' + d.minimum);
      if (pos.length) line('   Positions: ' + pos.join(' -> '));
    });

    heading('Record of truth');
    if (!state.events.length) line('(nothing recorded)');
    sortedEvents().forEach(function (e) {
      line(fmtDate(e.date) + ' — ' + (has(e.title) ? e.title : 'Untitled event') +
        (e.key ? ' [KEY]' : '') + ' [' + (EVENT_STATUS_LABEL[e.status] || '') + ']');
      if (has(e.what)) line('   ' + e.what.replace(/\n/g, ' '));
      e.evidence.forEach(function (v) {
        line('   * ' + (has(v.label) ? v.label : 'unnamed') + ' (' + (STRENGTH_LABEL[v.strength] || '') + ') — ' +
          (has(v.where) ? v.where : 'location not recorded') + (has(v.link) ? ' ' + v.link : ''));
      });
    });

    heading('What you can trade');
    if (!state.concessions.length) line('(nothing prepared)');
    state.concessions.forEach(function (x) {
      line('- ' + (has(x.label) ? x.label : 'Untitled') + ' [' + (STAGE_LABEL[x.stage] || '') + '; costs ' +
        (x.cost || '?') + '/5, worth ' + (x.value || '?') + '/5 to them]');
      if (has(x.detail)) line('   ' + x.detail.replace(/\n/g, ' '));
      line('   Buys: ' + (demandTitle(x.tradeFor) || 'nothing yet'));
      if (has(x.condition)) line('   Only if: ' + x.condition);
    });

    heading('Red lines');
    if (!state.redlines.length) line('(none set)');
    state.redlines.forEach(function (r) { if (has(r.text)) line('- ' + r.text); });

    return out.join('\n');
  }

  function renderBrief(v) {
    v.appendChild(sectionHead('Step 5', 'Negotiation brief',
      'Everything you have put in, arranged for the day itself. Print it, save it as a PDF, or download it as a ' +
      'standalone page you can email to whoever is coming with you.'));

    var bar = el('div', 'list-toolbar no-print');
    var pr = el('button', 'btn primary', '⎙ Print / save as PDF');
    pr.addEventListener('click', doPrint);
    bar.appendChild(pr);
    var cp = el('button', 'btn', '⧉ Copy as text');
    cp.addEventListener('click', function () {
      var text = buildBriefText();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast('Brief copied to the clipboard.'); }, fallback);
      } else { fallback(); }
      function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); toast('Brief copied to the clipboard.'); }
        catch (err) { toast('Could not copy — use Print instead.', true); }
        document.body.removeChild(ta);
      }
    });
    bar.appendChild(cp);
    var dl = el('button', 'btn', '⤓ Download brief');
    dl.addEventListener('click', exportBriefFile);
    bar.appendChild(dl);
    v.appendChild(bar);

    var p = panel(null, null);
    p.classList.add('brief');
    p.innerHTML = buildBriefHtml();
    v.appendChild(p);
  }

  function doPrint() {
    if (ui.section !== 'brief') { go('brief'); setTimeout(function () { window.print(); }, 120); }
    else window.print();
  }

  function exportJson() {
    var name = 'dispute-' + slug(state.matter.title) + '.json';
    downloadFile(name, JSON.stringify(state, null, 2), 'application/json');
    toast('Saved ' + name + ' to your downloads.');
  }

  function importFromFile(file) {
    var r = new FileReader();
    r.onload = function () {
      var data;
      try { data = JSON.parse(String(r.result)); }
      catch (e) { toast('That file is not readable JSON.', true); return; }
      if (!data || typeof data !== 'object') { toast('That file does not look like a workbench file.', true); return; }
      state = normalise(data);
      ui.collapsed = {};
      markDirty();
      render();
      toast('Loaded ' + file.name + '.');
    };
    r.onerror = function () { toast('Could not read that file.', true); };
    r.readAsText(file);
  }

  /* =====================================================================
     Start up
     ===================================================================== */

  function init() {
    $('exportBtn').addEventListener('click', exportJson);
    $('importBtn').addEventListener('click', function () { $('importFile').click(); });
    $('importFile').addEventListener('change', function (e) {
      var f = e.target.files[0];
      if (f) importFromFile(f);
      e.target.value = '';
    });
    $('printBtn').addEventListener('click', doPrint);
    $('briefFileBtn').addEventListener('click', exportBriefFile);

    $('exampleBtn').addEventListener('click', function () {
      uiConfirm('Load the worked example?',
        'It replaces whatever is in the workbench now. Save a copy first if you want to keep it.',
        'Load the example').then(function (ok) {
          if (!ok) return;
          state = exampleState();
          ui.collapsed = {};
          state.demands.concat(state.concessions).forEach(function (x) { ui.collapsed[x.id] = true; });
          state.events.forEach(function (x) { ui.collapsed[x.id] = true; });
          markDirty();
          go('alt');
          toast('Worked example loaded — edit or clear it as you like.');
        });
    });

    $('resetBtn').addEventListener('click', function () {
      uiConfirm('Clear the whole workbench?',
        'Everything you have entered is deleted from this browser. This cannot be undone.',
        'Clear everything').then(function (ok) {
          if (!ok) return;
          state = blankState();
          ui = { section: 'matter', collapsed: {} };
          markDirty();
          render();
          toast('Cleared. Starting fresh.');
        });
    });

    $('navToggle').addEventListener('click', function () { document.body.classList.toggle('nav-open'); });
    $('navScrim').addEventListener('click', function () { document.body.classList.remove('nav-open'); });

    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 's') { e.preventDefault(); exportJson(); }
      if (e.key === 'Escape') {
        document.body.classList.remove('nav-open');
        Array.prototype.forEach.call(document.querySelectorAll('.modal.open'), function (m) { m.classList.remove('open'); });
      }
    });
    $('confirmModal').addEventListener('click', function (e) {
      if (e.target === $('confirmModal')) $('confirmCancel').click();
    });

    try {
      var savedUi = JSON.parse(localStorage.getItem(UI_KEY) || '{}');
      if (savedUi.collapsed) ui.collapsed = savedUi.collapsed;
      if (savedUi.section) ui.section = savedUi.section;
    } catch (e) { /* first run */ }

    var draft = null;
    try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { draft = null; }
    if (draft) {
      state = normalise(draft);
      setPill('saved');
    } else {
      setPill('saved');
    }
    render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
