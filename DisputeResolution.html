<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dispute Resolution Workbench</title>
<style>
/* ===== Dispute Resolution Workbench — design tokens shared with the FAQ Editor ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --color-bg: #F5F7FA;
  --color-surface: #FFFFFF;
  --color-text: #1D1D1F;
  --color-text-soft: #6E6E73;
  --color-border: rgba(0, 0, 0, 0.08);
  --color-border-strong: rgba(0, 0, 0, 0.16);
  --color-accent: #0A66C2;
  --color-accent-hover: #084A8E;
  --color-accent-soft: #e7f0fb;
  --color-danger: #C0392B;
  --color-good: #2E9F5C;
  --color-warn: #D97706;
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
  --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.08);
  --sidebar-width: 264px;
}

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--color-bg);
  color: var(--color-text);
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

button, input, select, textarea { font-family: inherit; }

/* ---------- Header ---------- */
.app-header {
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  padding: 0.7rem 1.1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  flex-shrink: 0;
  z-index: 900;
}
.app-brand { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
.app-title { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.app-subtitle { font-size: 0.76rem; color: var(--color-text-soft); margin-top: 0.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.header-actions { display: flex; gap: 0.4rem; align-items: center; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }

.btn {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  padding: 0.48rem 0.85rem;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.83rem;
  font-weight: 600;
  color: var(--color-text);
  transition: background 0.15s ease, border-color 0.15s ease;
  white-space: nowrap;
}
.btn:hover { background: var(--color-bg); border-color: var(--color-border-strong); }
.btn.primary { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }
.btn.primary:hover { background: var(--color-accent-hover); border-color: var(--color-accent-hover); }
.btn.danger { color: var(--color-danger); }
.btn.danger:hover { background: #fbeae8; border-color: #e7b9b3; }
.btn.small { padding: 0.3rem 0.55rem; font-size: 0.76rem; }
.btn.tiny { padding: 0.15rem 0.4rem; font-size: 0.72rem; font-weight: 700; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.nav-toggle { display: none; }

.save-pill {
  font-size: 0.73rem;
  color: var(--color-text-soft);
  padding: 0.28rem 0.6rem;
  border: 1px solid var(--color-border);
  border-radius: 999px;
  white-space: nowrap;
}
.save-pill.dirty { color: var(--color-warn); border-color: #f0d09a; background: #fff8ec; }
.save-pill.saved { color: var(--color-good); border-color: #b9e3c9; background: #f0faf4; }

/* ---------- Layout ---------- */
.main-area { display: flex; flex: 1; min-height: 0; overflow: hidden; }

.sidebar {
  width: var(--sidebar-width);
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  min-height: 0;
}
.step-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 0.6rem 0.55rem; }
.step {
  display: flex;
  gap: 0.6rem;
  align-items: flex-start;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 0.55rem 0.6rem;
  cursor: pointer;
  margin-bottom: 0.2rem;
}
.step:hover { background: var(--color-bg); }
.step.active { background: var(--color-accent-soft); border-color: #bcd6f3; }
.step-num {
  flex-shrink: 0;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--color-bg);
  border: 1px solid var(--color-border-strong);
  color: var(--color-text-soft);
  font-size: 0.72rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  margin-top: 0.1rem;
}
.step.active .step-num { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
.step.done .step-num { background: var(--color-good); border-color: var(--color-good); color: #fff; }
.step-text { min-width: 0; flex: 1; }
.step-label { font-size: 0.86rem; font-weight: 600; line-height: 1.25; }
.step-hint { font-size: 0.72rem; color: var(--color-text-soft); margin-top: 0.1rem; line-height: 1.3; }

.sidebar-footer {
  padding: 0.6rem 0.7rem;
  border-top: 1px solid var(--color-border);
  background: var(--color-bg);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}
.mini-stat { font-size: 0.72rem; color: var(--color-text-soft); line-height: 1.5; }
.mini-stat b { color: var(--color-text); }

.nav-scrim { display: none; }

.view-container { flex: 1; min-width: 0; overflow-y: auto; background: var(--color-bg); }
.view-inner { max-width: 900px; margin: 0 auto; padding: 1.4rem 1.4rem 5rem; }

/* ---------- Section headings ---------- */
.section-head { margin-bottom: 1.1rem; }
.section-kicker {
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.7px; text-transform: uppercase;
  color: var(--color-accent); margin-bottom: 0.3rem;
}
.section-title { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.015em; }
.section-blurb { font-size: 0.87rem; color: var(--color-text-soft); margin-top: 0.4rem; line-height: 1.55; max-width: 62ch; }

.card-panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 12px;
  box-shadow: var(--shadow-sm);
  padding: 1.2rem 1.3rem;
  margin-bottom: 1.1rem;
}
.panel-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 0.25rem; }
.panel-sub { font-size: 0.8rem; color: var(--color-text-soft); margin-bottom: 1rem; line-height: 1.5; }

/* ---------- Fields ---------- */
.field { margin-bottom: 0.95rem; }
.field:last-child { margin-bottom: 0; }
.field > label { display: block; font-size: 0.81rem; font-weight: 600; margin-bottom: 0.32rem; }
.field .hint { font-weight: 400; color: var(--color-text-soft); font-size: 0.75rem; margin-left: 0.35rem; }

.field input[type="text"], .field input[type="number"], .field input[type="date"],
.field input[type="url"], .field textarea, .field select {
  width: 100%;
  padding: 0.55rem 0.65rem;
  border: 1px solid var(--color-border-strong);
  border-radius: 7px;
  font-size: 0.88rem;
  color: var(--color-text);
  background: #fff;
}
.field textarea { resize: vertical; min-height: 74px; line-height: 1.5; }
.field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid var(--color-accent); outline-offset: 1px; border-color: var(--color-accent); }

.field-row { display: flex; gap: 0.85rem; flex-wrap: wrap; }
.field-row > .field { flex: 1; min-width: 170px; margin-bottom: 0.95rem; }
.field-row > .field.narrow { flex: 0 1 130px; min-width: 110px; }

.check-field { display: flex; align-items: center; gap: 0.45rem; font-size: 0.83rem; cursor: pointer; }
.check-field input { width: 16px; height: 16px; flex-shrink: 0; }

.range-field input[type="range"] { width: 100%; }
.range-value { font-size: 0.78rem; color: var(--color-text-soft); }

/* ---------- Cards (demands / events / concessions) ---------- */
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 10px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 0.7rem;
  overflow: hidden;
}
.card-head {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.6rem 0.7rem;
  cursor: pointer;
  user-select: none;
  background: var(--color-surface);
}
.card-head:hover { background: var(--color-bg); }
.card-caret { font-size: 0.68rem; color: var(--color-text-soft); width: 0.85rem; text-align: center; transition: transform 0.15s; flex-shrink: 0; }
.card.collapsed .card-caret { transform: rotate(-90deg); }
.card.collapsed .card-body { display: none; }
.card-rank {
  flex-shrink: 0; font-size: 0.72rem; font-weight: 700; color: var(--color-accent);
  background: var(--color-accent-soft); border-radius: 5px; padding: 0.1rem 0.35rem; min-width: 26px; text-align: center;
}
.card-title { flex: 1; min-width: 0; font-size: 0.88rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-title.untitled { color: var(--color-text-soft); font-weight: 400; font-style: italic; }
.card-actions { display: flex; gap: 0.2rem; flex-shrink: 0; }
.card-body { padding: 0.2rem 0.9rem 1rem; border-top: 1px solid var(--color-border); }
.card-grip { cursor: grab; color: var(--color-text-soft); font-size: 0.85rem; flex-shrink: 0; }
.card.dragging { opacity: 0.4; }
.card.drop-target { box-shadow: inset 0 3px 0 var(--color-accent); }

.badge {
  font-size: 0.66rem; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
  padding: 0.12rem 0.4rem; border-radius: 4px; flex-shrink: 0;
  background: var(--color-bg); color: var(--color-text-soft); border: 1px solid var(--color-border);
}
.badge.must { background: #fbeae8; color: #a3271b; border-color: #eebcb4; }
.badge.important { background: #fff5e6; color: #9a5b06; border-color: #f0d09a; }
.badge.nice { background: #eef4f0; color: #37714f; border-color: #c3ddcd; }
.badge.good { background: #f0faf4; color: #22764a; border-color: #b9e3c9; }
.badge.warn { background: #fff8ec; color: #9a5b06; border-color: #f0d09a; }
.badge.danger { background: #fbeae8; color: #a3271b; border-color: #eebcb4; }
.badge.info { background: var(--color-accent-soft); color: var(--color-accent-hover); border-color: #bcd6f3; }
.badge.muted { opacity: 0.8; }

.list-toolbar { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.8rem; }
.list-toolbar .spacer { flex: 1; }
.list-empty {
  border: 1px dashed var(--color-border-strong);
  border-radius: 10px;
  padding: 1.6rem 1.2rem;
  text-align: center;
  color: var(--color-text-soft);
  font-size: 0.85rem;
  line-height: 1.6;
  background: var(--color-surface);
}

/* ---------- Numbers / gauge ---------- */
.stat-grid { display: flex; gap: 0.7rem; flex-wrap: wrap; }
.stat {
  flex: 1; min-width: 150px;
  border: 1px solid var(--color-border);
  border-radius: 9px;
  padding: 0.7rem 0.8rem;
  background: var(--color-bg);
}
.stat-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--color-text-soft); }
.stat-value { font-size: 1.25rem; font-weight: 700; margin-top: 0.2rem; letter-spacing: -0.02em; }
.stat-note { font-size: 0.74rem; color: var(--color-text-soft); margin-top: 0.2rem; line-height: 1.4; }
.stat.accent { background: var(--color-accent-soft); border-color: #bcd6f3; }
.stat.accent .stat-value { color: var(--color-accent-hover); }

.gauge-wrap { margin-top: 1.2rem; }
.gauge-bar {
  position: relative;
  height: 26px;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--color-border-strong);
  display: flex;
}
.gz { height: 100%; }
.gz.bad { background: repeating-linear-gradient(45deg, #f7d9d5, #f7d9d5 6px, #fbeae8 6px, #fbeae8 12px); }
.gz.ok { background: #fdf0d9; }
.gz.great { background: #dff2e6; }
.gz.plain { background: var(--color-bg); }
.gauge-marks { position: relative; height: 74px; margin-top: 2px; }
.gmark { position: absolute; transform: translateX(-50%); text-align: center; width: 92px; }
.gmark .stem { width: 2px; height: 9px; background: var(--color-text-soft); margin: 0 auto 2px; }
.gmark .gm-label { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; color: var(--color-text-soft); line-height: 1.2; }
.gmark .gm-val { font-size: 0.76rem; font-weight: 700; }
.gmark.low { top: 38px; }
.gmark.hi { top: 0; }
.gauge-legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.74rem; color: var(--color-text-soft); margin-top: 0.9rem; }
.gauge-legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 0.3rem; vertical-align: -1px; }
.gauge-legend .l-bad::before { background: #f7d9d5; }
.gauge-legend .l-ok::before { background: #fdf0d9; }
.gauge-legend .l-great::before { background: #dff2e6; }

.callout {
  border-left: 3px solid var(--color-accent);
  background: #f6f9fd;
  padding: 0.7rem 0.9rem;
  border-radius: 0 7px 7px 0;
  font-size: 0.84rem;
  line-height: 1.6;
  margin-top: 1rem;
}
.callout.warn { border-left-color: var(--color-warn); background: #fff8ec; }
.callout.danger { border-left-color: var(--color-danger); background: #fdf1ef; }
.callout b { font-weight: 700; }

/* ---------- Stakes chips ---------- */
.stake-row { display: flex; gap: 0.5rem; align-items: flex-start; margin-bottom: 0.5rem; }
.stake-row .s-label { flex: 2; min-width: 120px; }
.stake-row .s-impact { flex: 0 1 130px; }
.stake-row .s-note { flex: 3; min-width: 140px; }
.stake-row input, .stake-row select {
  width: 100%; padding: 0.45rem 0.55rem; border: 1px solid var(--color-border-strong);
  border-radius: 6px; font-size: 0.84rem; background: #fff;
}
.stake-row .rm { flex-shrink: 0; }

/* ---------- Timeline ---------- */
.tl { position: relative; padding-left: 1.5rem; }
.tl::before {
  content: ''; position: absolute; left: 6.5px; top: 4px; bottom: 4px;
  width: 2px; background: #d3d6dc;
}
.tl-node { position: relative; }
.tl-node > .card { margin-bottom: 0.7rem; }
.tl-node::before {
  content: ''; position: absolute; left: -1.28rem; top: 1rem;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--color-accent); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--color-accent);
}
.tl-node.is-key::before { background: var(--color-warn); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--color-warn); }
.tl-node.is-disputed::before { background: var(--color-danger); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--color-danger); }
.tl-date {
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
  color: var(--color-text-soft); flex-shrink: 0; min-width: 84px;
}

.ev-list { margin-top: 0.5rem; }
.ev-head {
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
  color: var(--color-text-soft); margin: 1rem 0 0.4rem; display: flex; align-items: center; gap: 0.5rem;
}
.ev-head .spacer { flex: 1; }
.ev-item {
  border: 1px solid var(--color-border);
  border-left: 3px solid var(--color-accent);
  border-radius: 0 8px 8px 0;
  background: var(--color-bg);
  padding: 0.6rem 0.7rem;
  margin-bottom: 0.5rem;
}
.ev-item.weak { border-left-color: #d0d0d4; }
.ev-item.strong { border-left-color: var(--color-good); }
.ev-top { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.4rem; }
.ev-top .ev-title { flex: 1; font-size: 0.84rem; font-weight: 600; }

table.reg { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
table.reg th, table.reg td { border: 1px solid var(--color-border); padding: 0.4rem 0.55rem; text-align: left; vertical-align: top; line-height: 1.45; }
table.reg thead th { background: var(--color-bg); font-size: 0.7rem; letter-spacing: 0.4px; text-transform: uppercase; color: var(--color-text-soft); }
.table-scroll { overflow-x: auto; }

/* ---------- Support chips (link demands to events) ---------- */
.chip-picker { display: flex; flex-wrap: wrap; gap: 0.35rem; max-height: 130px; overflow-y: auto; padding: 0.15rem; }
.chip {
  border: 1px solid var(--color-border-strong); background: #fff; border-radius: 999px;
  padding: 0.22rem 0.6rem; font-size: 0.76rem; cursor: pointer; color: var(--color-text-soft);
}
.chip:hover { border-color: var(--color-accent); }
.chip.on { background: var(--color-accent-soft); border-color: #bcd6f3; color: var(--color-accent-hover); font-weight: 600; }

/* ---------- Red lines ---------- */
.redline-row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.45rem; }
.redline-row input {
  flex: 1; padding: 0.5rem 0.6rem; border: 1px solid var(--color-border-strong);
  border-radius: 6px; font-size: 0.85rem; background: #fff;
}

/* ---------- Brief ---------- */
.brief h2 {
  font-size: 0.78rem; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
  color: var(--color-accent); margin: 1.6rem 0 0.6rem; padding-bottom: 0.3rem;
  border-bottom: 1px solid var(--color-border);
}
.brief h2:first-child { margin-top: 0; }
.brief h3 { font-size: 0.92rem; margin: 0.9rem 0 0.3rem; }
.brief p { font-size: 0.86rem; line-height: 1.6; margin-bottom: 0.5rem; }
.brief ul { margin: 0.3rem 0 0.7rem 1.1rem; font-size: 0.86rem; line-height: 1.6; }
.brief li { margin-bottom: 0.25rem; }
.brief .muted { color: var(--color-text-soft); }
.brief .b-item { border-left: 3px solid var(--color-border-strong); padding: 0.15rem 0 0.15rem 0.7rem; margin-bottom: 0.7rem; }
.brief .b-item.must { border-left-color: var(--color-danger); }
.brief .b-item.important { border-left-color: var(--color-warn); }
.brief .b-item.nice { border-left-color: var(--color-good); }
.brief .b-item .b-title { font-size: 0.88rem; font-weight: 700; }
.brief .b-item .b-meta { font-size: 0.78rem; color: var(--color-text-soft); margin-top: 0.1rem; line-height: 1.5; }
.brief .b-item .b-detail { font-size: 0.83rem; line-height: 1.55; margin-top: 0.25rem; }
.check-list { list-style: none; margin-left: 0; }
.check-list li { display: flex; gap: 0.5rem; align-items: flex-start; font-size: 0.84rem; margin-bottom: 0.3rem; line-height: 1.5; }
.check-list .ic { flex-shrink: 0; font-weight: 700; }
.check-list .ok .ic { color: var(--color-good); }
.check-list .gap .ic { color: var(--color-warn); }

/* ---------- Toast & modal ---------- */
.toast {
  position: fixed; bottom: 1.3rem; left: 50%; transform: translateX(-50%) translateY(160%);
  background: #1d1d1f; color: #fff; padding: 0.7rem 1.2rem; border-radius: 8px;
  font-size: 0.85rem; box-shadow: var(--shadow-md); z-index: 4000; transition: transform 0.25s ease; max-width: 90%;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { background: #7a1d16; }

.modal { position: fixed; inset: 0; background: rgba(15,23,42,0.45); display: none; align-items: center; justify-content: center; z-index: 3000; }
.modal.open { display: flex; }
.modal-box { background: #fff; border-radius: 12px; padding: 1.4rem; width: 440px; max-width: 92%; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
.modal-box h3 { font-size: 1.02rem; margin-bottom: 0.4rem; }
.modal-box p.sub { font-size: 0.84rem; color: var(--color-text-soft); margin-bottom: 0.9rem; line-height: 1.5; }
.modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.1rem; }

.hidden-file { display: none; }

/* ---------- Responsive ---------- */
@media (max-width: 820px) {
  .nav-toggle { display: inline-block; }
  .app-subtitle { display: none; }
  .app-title { font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .app-header { flex-wrap: wrap; padding: 0.55rem 0.7rem; gap: 0.5rem; }
  .app-brand { flex: 1 1 100%; min-width: 0; }
  .header-actions { flex-shrink: 1; min-width: 0; width: 100%; justify-content: flex-start; }
  .gmark { width: 74px; }
  .gmark .gm-label { font-size: 0.6rem; }
  .gmark .gm-val { font-size: 0.7rem; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: 268px; z-index: 1200;
    transform: translateX(-100%); transition: transform 0.2s ease;
  }
  body.nav-open .sidebar { transform: none; box-shadow: var(--shadow-md); }
  .nav-scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 1100; }
  body.nav-open .nav-scrim { display: block; }
  .view-inner { padding: 1rem 0.9rem 4rem; }
  .card-panel { padding: 1rem; }
  .btn { padding: 0.45rem 0.7rem; font-size: 0.8rem; }
}

@media print {
  body { overflow: visible; height: auto; display: block; background: #fff; }
  .app-header, .sidebar, .nav-scrim, .no-print, .toast, .modal { display: none !important; }
  .main-area { display: block; overflow: visible; }

  .card-panel { box-shadow: none; border: none; padding: 0; margin-bottom: 0.8rem; page-break-inside: avoid; }
  .brief h2 { page-break-after: avoid; }
  .brief .b-item, .ev-item, table.reg { page-break-inside: avoid; }
}
</style>
</head>
<body>
  <header class="app-header">
    <div class="app-brand">
      <button class="btn small nav-toggle" id="navToggle" title="Show the steps">&#9776;</button>
      <div>
        <div class="app-title">Dispute Resolution Workbench</div>
        <div class="app-subtitle" id="appSubtitle">Prepare a negotiation: alternatives, demands, evidence, concessions.</div>
      </div>
    </div>
    <div class="header-actions">
      <span class="save-pill" id="savePill">Loading&hellip;</span>
      <button class="btn" id="exampleBtn" title="Fill the workbench with a worked example you can edit or clear">Example</button>
      <button class="btn" id="importBtn" title="Open a workbench file saved earlier">Import</button>
      <button class="btn" id="briefFileBtn" title="Download the negotiation brief as a standalone web page">&#10515; Brief</button>
      <button class="btn" id="printBtn" title="Print the brief, or save it as a PDF">&#9113; Print</button>
      <button class="btn primary" id="exportBtn" title="Download everything as a JSON file you can re-import later">&#10515; Save file</button>
      <input type="file" id="importFile" class="hidden-file" accept="application/json,.json">
    </div>
  </header>

  <div class="main-area">
    <aside class="sidebar" id="sidebar">
      <nav class="step-nav" id="stepNav"></nav>
      <div class="sidebar-footer">
        <div class="mini-stat" id="miniStat"></div>
        <button class="btn small danger" id="resetBtn">Clear everything</button>
      </div>
    </aside>

    <div class="view-container" id="viewContainer">
      <div class="view-inner" id="view"></div>
    </div>
  </div>

  <div class="nav-scrim" id="navScrim"></div>
  <div class="toast" id="toast"></div>

  <div class="modal" id="confirmModal">
    <div class="modal-box">
      <h3 id="confirmTitle">Are you sure?</h3>
      <p class="sub" id="confirmSub"></p>
      <div class="modal-actions">
        <button class="btn" id="confirmCancel">Cancel</button>
        <button class="btn danger" id="confirmOk">Yes, do it</button>
      </div>
    </div>
  </div>

<script>
/* ===============================================================
   Dispute Resolution Workbench
   ---------------------------------------------------------------
   A single-file negotiation preparation tool. Five steps:
     0. The dispute      — who is involved and what it is about
     1. BATNA / WATNA    — what happens if no agreement is reached
     2. Desired end state— ranked, specified demands
     3. Record of truth  — dated events with attached evidence
     4. Concessions      — what you can trade away to get the above
     5. Brief            — a printable summary of the lot

   Everything is kept in localStorage as you type, and can be saved
   to (or loaded from) a JSON file. No server, no dependencies.
   =============================================================== */
(function () {
  'use strict';

  var DRAFT_KEY = 'dispute_workbench_v1';
  var UI_KEY = 'dispute_workbench_ui_v1';

  /* ---------------- small helpers ---------------- */

  function $(id) { return document.getElementById(id); }
  function uid(p) { return (p || 'x') + '_' + Math.random().toString(36).slice(2, 9); }
  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function isNum(v) { return typeof v === 'number' && isFinite(v); }
  function trimmed(v) { return String(v == null ? '' : v).trim(); }
  function has(v) { return trimmed(v) !== ''; }

  function toast(msg, isError) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = 'toast'; }, 3000);
  }

  function uiConfirm(title, sub, okLabel) {
    return new Promise(function (resolve) {
      var m = $('confirmModal');
      $('confirmTitle').textContent = title;
      $('confirmSub').textContent = sub || '';
      $('confirmOk').textContent = okLabel || 'Yes, do it';
      m.classList.add('open');
      function done(v) {
        m.classList.remove('open');
        $('confirmOk').onclick = null;
        $('confirmCancel').onclick = null;
        resolve(v);
      }
      $('confirmOk').onclick = function () { done(true); };
      $('confirmCancel').onclick = function () { done(false); };
    });
  }

  function downloadFile(name, text, mime) {
    var blob = new Blob([text], { type: mime || 'application/octet-stream' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function slug(s) {
    return String(s || '').toLowerCase().trim()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'dispute';
  }

  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function fmtDate(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(trimmed(d));
    if (!m) return has(d) ? trimmed(d) : 'No date';
    return Number(m[3]) + ' ' + MONTHS[Number(m[2]) - 1] + ' ' + m[1];
  }
  function todayIso() {
    var d = new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function fmtMoney(n) {
    if (!isNum(n)) return '—';
    var cur = trimmed(state.matter.currency) || '$';
    var neg = n < 0;
    var a = Math.abs(n);
    var body = a >= 1000
      ? Math.round(a).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',')
      : String(Math.round(a * 100) / 100);
    return (neg ? '−' : '') + cur + body;
  }

  /* ---------------- state ---------------- */

  var state = blankState();
  var ui = { section: 'matter', collapsed: {} };
  var saveTimer = null;

  function blankState() {
    return {
      version: 1,
      matter: {
        title: '', otherParty: '', myRole: '', summary: '',
        deadline: '', forum: '', currency: '$'
      },
      alt: {
        best: { desc: '', value: null, prob: 25 },
        likely: { desc: '', value: null, prob: 50 },
        worst: { desc: '', value: null, prob: 25 },
        riskAversion: 30,
        reservationOverride: null,
        target: null,
        stakes: [],
        theirs: { best: '', bestValue: null, worst: '', worstValue: null, pressure: '' }
      },
      demands: [],
      events: [],
      concessions: [],
      redlines: []
    };
  }

  /* Repair anything loaded from disk or an older draft so the rest of
     the code can assume every field exists. */
  function normalise(raw) {
    var s = blankState();
    if (!raw || typeof raw !== 'object') return s;

    var m = raw.matter || {};
    ['title', 'otherParty', 'myRole', 'summary', 'deadline', 'forum', 'currency'].forEach(function (k) {
      if (m[k] != null) s.matter[k] = String(m[k]);
    });
    if (!has(s.matter.currency)) s.matter.currency = '$';

    var a = raw.alt || {};
    ['best', 'likely', 'worst'].forEach(function (k) {
      var src = a[k] || {};
      s.alt[k].desc = src.desc != null ? String(src.desc) : '';
      s.alt[k].value = isNum(src.value) ? src.value : null;
      s.alt[k].prob = isNum(src.prob) ? src.prob : s.alt[k].prob;
    });
    if (isNum(a.riskAversion)) s.alt.riskAversion = a.riskAversion;
    if (isNum(a.reservationOverride)) s.alt.reservationOverride = a.reservationOverride;
    if (isNum(a.target)) s.alt.target = a.target;
    s.alt.stakes = (Array.isArray(a.stakes) ? a.stakes : []).map(function (st) {
      return {
        id: st.id || uid('st'),
        label: String(st.label || ''),
        impact: st.impact || 'medium',
        notes: String(st.notes || '')
      };
    });
    var th = a.theirs || {};
    s.alt.theirs = {
      best: String(th.best || ''),
      bestValue: isNum(th.bestValue) ? th.bestValue : null,
      worst: String(th.worst || ''),
      worstValue: isNum(th.worstValue) ? th.worstValue : null,
      pressure: String(th.pressure || '')
    };

    s.demands = (Array.isArray(raw.demands) ? raw.demands : []).map(function (d) {
      return {
        id: d.id || uid('dm'),
        title: String(d.title || ''),
        category: d.category || 'money',
        tier: d.tier || 'important',
        spec: String(d.spec || ''),
        when: String(d.when || ''),
        who: String(d.who || ''),
        proof: String(d.proof || ''),
        opening: String(d.opening || ''),
        target: String(d.target || ''),
        minimum: String(d.minimum || ''),
        why: String(d.why || ''),
        support: Array.isArray(d.support) ? d.support.slice() : []
      };
    });

    s.events = (Array.isArray(raw.events) ? raw.events : []).map(function (e) {
      return {
        id: e.id || uid('ev'),
        date: String(e.date || ''),
        title: String(e.title || ''),
        type: e.type || 'other',
        what: String(e.what || ''),
        who: String(e.who || ''),
        status: e.status || 'unverified',
        key: !!e.key,
        evidence: (Array.isArray(e.evidence) ? e.evidence : []).map(function (v) {
          return {
            id: v.id || uid('vd'),
            label: String(v.label || ''),
            type: v.type || 'document',
            where: String(v.where || ''),
            link: String(v.link || ''),
            strength: v.strength || 'moderate',
            theyHave: !!v.theyHave,
            notes: String(v.notes || '')
          };
        })
      };
    });

    s.concessions = (Array.isArray(raw.concessions) ? raw.concessions : []).map(function (c) {
      return {
        id: c.id || uid('cn'),
        label: String(c.label || ''),
        detail: String(c.detail || ''),
        cost: isNum(c.cost) ? c.cost : 3,
        value: isNum(c.value) ? c.value : 3,
        condition: String(c.condition || ''),
        tradeFor: String(c.tradeFor || ''),
        stage: c.stage || 'mid',
        status: c.status || 'available'
      };
    });

    s.redlines = (Array.isArray(raw.redlines) ? raw.redlines : []).map(function (r) {
      return { id: (r && r.id) || uid('rl'), text: String((r && r.text) || (typeof r === 'string' ? r : '')) };
    });

    return s;
  }

  /* ---------------- saving ---------------- */

  function setPill(kind) {
    var p = $('savePill');
    if (kind === 'dirty') { p.className = 'save-pill dirty'; p.textContent = 'Saving…'; }
    else if (kind === 'saved') { p.className = 'save-pill saved'; p.textContent = 'Saved in this browser'; }
    else { p.className = 'save-pill'; p.textContent = 'Loading…'; }
  }

  function saveDraft() {
    try {
      localStorage.setItem(DRAFT_KEY, JSON.stringify(state));
      localStorage.setItem(UI_KEY, JSON.stringify({ section: ui.section, collapsed: ui.collapsed }));
      setPill('saved');
    } catch (e) {
      setPill('');
      $('savePill').textContent = 'Could not save';
    }
  }

  function markDirty() {
    setPill('dirty');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveDraft, 400);
  }

  /* ---------------- form field builders ----------------
     Each control writes straight into the state object it was given and
     schedules a save. `after` lets a card refresh its own header or a
     derived panel without re-rendering (and losing focus on) the field
     being typed into. */

  function makeField(label, hint, control) {
    var f = el('div', 'field');
    if (label) {
      var l = document.createElement('label');
      l.innerHTML = escapeHtml(label) + (hint ? ' <span class="hint">' + escapeHtml(hint) + '</span>' : '');
      f.appendChild(l);
    }
    f.appendChild(control);
    return f;
  }

  function textControl(obj, key, placeholder, after, type) {
    var i = document.createElement('input');
    i.type = type || 'text';
    if (placeholder) i.placeholder = placeholder;
    i.value = obj[key] == null ? '' : obj[key];
    i.addEventListener('input', function () {
      obj[key] = i.value;
      markDirty();
      if (after) after();
    });
    return i;
  }

  function numControl(obj, key, placeholder, after) {
    var i = document.createElement('input');
    i.type = 'number';
    i.step = 'any';
    i.inputMode = 'decimal';
    if (placeholder) i.placeholder = placeholder;
    i.value = isNum(obj[key]) ? obj[key] : '';
    i.addEventListener('input', function () {
      var t = i.value.trim();
      var n = parseFloat(t);
      obj[key] = (t === '' || !isFinite(n)) ? null : n;
      markDirty();
      if (after) after();
    });
    return i;
  }

  /* Textareas grow to fit what is in them — people write paragraphs in
     this tool and a clipped box hides half of it. */
  function growArea(t) {
    if (!t || !t.offsetHeight) return;      // not visible: nothing to measure
    t.style.height = 'auto';
    t.style.height = (t.scrollHeight + 2) + 'px';
  }
  function growAll(root) {
    Array.prototype.forEach.call((root || document).querySelectorAll('textarea'), growArea);
  }

  function areaControl(obj, key, placeholder, after, minHeight) {
    var t = document.createElement('textarea');
    if (placeholder) t.placeholder = placeholder;
    if (minHeight) t.style.minHeight = minHeight;
    t.value = obj[key] == null ? '' : obj[key];
    t.addEventListener('input', function () {
      obj[key] = t.value;
      growArea(t);
      markDirty();
      if (after) after();
    });
    return t;
  }

  function selectControl(obj, key, options, after) {
    var s = document.createElement('select');
    options.forEach(function (o) {
      var op = document.createElement('option');
      op.value = o.v;
      op.textContent = o.l;
      s.appendChild(op);
    });
    s.value = obj[key];
    if (s.value !== obj[key]) { obj[key] = s.value; }   // fall back to first option
    s.addEventListener('change', function () {
      obj[key] = s.value;
      markDirty();
      if (after) after();
    });
    return s;
  }

  function checkControl(labelText, obj, key, after) {
    var w = el('label', 'check-field');
    var i = document.createElement('input');
    i.type = 'checkbox';
    i.checked = !!obj[key];
    i.addEventListener('change', function () {
      obj[key] = i.checked;
      markDirty();
      if (after) after();
    });
    w.appendChild(i);
    w.appendChild(document.createTextNode(labelText));
    return w;
  }

  function row() {
    var r = el('div', 'field-row');
    for (var i = 0; i < arguments.length; i++) if (arguments[i]) r.appendChild(arguments[i]);
    return r;
  }

  function panel(title, sub) {
    var p = el('div', 'card-panel');
    if (title) p.appendChild(el('div', 'panel-title', escapeHtml(title)));
    if (sub) p.appendChild(el('div', 'panel-sub', sub));
    return p;
  }

  function sectionHead(kicker, title, blurb) {
    var h = el('div', 'section-head');
    h.appendChild(el('div', 'section-kicker', escapeHtml(kicker)));
    h.appendChild(el('div', 'section-title', escapeHtml(title)));
    if (blurb) h.appendChild(el('div', 'section-blurb', blurb));
    return h;
  }

  function emptyState(text) { return el('div', 'list-empty', text); }

  /* ---------------- option lists ---------------- */

  var IMPACT_OPTS = [
    { v: 'high', l: 'High impact' },
    { v: 'medium', l: 'Medium impact' },
    { v: 'low', l: 'Low impact' }
  ];
  var TIER_OPTS = [
    { v: 'must', l: 'Must have — no deal without it' },
    { v: 'important', l: 'Important — push hard' },
    { v: 'nice', l: 'Nice to have — tradeable' }
  ];
  var TIER_LABEL = { must: 'Must have', important: 'Important', nice: 'Nice to have' };
  var CATEGORY_OPTS = [
    { v: 'money', l: 'Money — payment or refund' },
    { v: 'work', l: 'Work — repair, replace, complete' },
    { v: 'delivery', l: 'Goods or services delivered' },
    { v: 'documents', l: 'Documents or information' },
    { v: 'conduct', l: 'Future conduct or terms' },
    { v: 'apology', l: 'Apology or acknowledgement' },
    { v: 'release', l: 'Release — end of claims' },
    { v: 'other', l: 'Other' }
  ];
  var CATEGORY_LABEL = {};
  CATEGORY_OPTS.forEach(function (o) { CATEGORY_LABEL[o.v] = o.l.split(' — ')[0]; });

  var EVENT_TYPE_OPTS = [
    { v: 'agreement', l: 'Agreement or contract' },
    { v: 'meeting', l: 'Meeting or call' },
    { v: 'message', l: 'Email, letter or message' },
    { v: 'payment', l: 'Payment or invoice' },
    { v: 'delivery', l: 'Delivery or work done' },
    { v: 'failure', l: 'Failure or breach' },
    { v: 'complaint', l: 'Complaint raised' },
    { v: 'notice', l: 'Formal notice' },
    { v: 'other', l: 'Other' }
  ];
  var EVENT_TYPE_LABEL = {};
  EVENT_TYPE_OPTS.forEach(function (o) { EVENT_TYPE_LABEL[o.v] = o.l; });

  var EVENT_STATUS_OPTS = [
    { v: 'agreed', l: 'Both sides agree this happened' },
    { v: 'disputed', l: 'They dispute this' },
    { v: 'unverified', l: 'Not tested yet' }
  ];
  var EVENT_STATUS_LABEL = { agreed: 'Agreed', disputed: 'Disputed', unverified: 'Untested' };

  var EVIDENCE_TYPE_OPTS = [
    { v: 'document', l: 'Document or contract' },
    { v: 'email', l: 'Email or letter' },
    { v: 'message', l: 'Text or chat message' },
    { v: 'invoice', l: 'Invoice, receipt or statement' },
    { v: 'photo', l: 'Photo or video' },
    { v: 'recording', l: 'Audio recording' },
    { v: 'witness', l: 'Witness account' },
    { v: 'report', l: 'Expert or inspection report' },
    { v: 'note', l: 'Own notes or diary' },
    { v: 'other', l: 'Other' }
  ];
  var EVIDENCE_TYPE_LABEL = {};
  EVIDENCE_TYPE_OPTS.forEach(function (o) { EVIDENCE_TYPE_LABEL[o.v] = o.l; });

  var STRENGTH_OPTS = [
    { v: 'strong', l: 'Strong — hard to argue with' },
    { v: 'moderate', l: 'Moderate — helps' },
    { v: 'weak', l: 'Weak — needs support' }
  ];
  var STRENGTH_LABEL = { strong: 'Strong', moderate: 'Moderate', weak: 'Weak' };

  var SCALE_OPTS = [
    { v: 1, l: '1 — very low' },
    { v: 2, l: '2 — low' },
    { v: 3, l: '3 — moderate' },
    { v: 4, l: '4 — high' },
    { v: 5, l: '5 — very high' }
  ];
  var STAGE_OPTS = [
    { v: 'open', l: 'Offer early — opens the door' },
    { v: 'mid', l: 'Mid-negotiation — trade for movement' },
    { v: 'close', l: 'Hold to close the deal' },
    { v: 'last', l: 'Last resort only' }
  ];
  var STAGE_LABEL = {
    open: 'Offer early', mid: 'Trade mid-way', close: 'Closing chip', last: 'Last resort'
  };
  var STATUS_OPTS = [
    { v: 'available', l: 'Not offered yet' },
    { v: 'offered', l: 'Offered' },
    { v: 'accepted', l: 'Accepted by them' },
    { v: 'withdrawn', l: 'Withdrawn' }
  ];
  var STATUS_LABEL = {
    available: 'Not offered', offered: 'Offered', accepted: 'Accepted', withdrawn: 'Withdrawn'
  };

  /* A numeric select needs its own binding — option values are strings. */
  function scaleControl(obj, key, after) {
    var s = document.createElement('select');
    SCALE_OPTS.forEach(function (o) {
      var op = document.createElement('option');
      op.value = String(o.v);
      op.textContent = o.l;
      s.appendChild(op);
    });
    s.value = String(obj[key]);
    s.addEventListener('change', function () {
      obj[key] = parseInt(s.value, 10);
      markDirty();
      if (after) after();
    });
    return s;
  }

  /* ---------------- the maths behind step 1 ----------------
     Every figure is "what I end up with, in money, if no agreement is
     reached" — negative numbers are losses. */

  function computeAlt() {
    var a = state.alt;
    var best = isNum(a.best.value) ? a.best.value : null;
    var likely = isNum(a.likely.value) ? a.likely.value : null;
    var worst = isNum(a.worst.value) ? a.worst.value : null;

    var scenarios = [];
    if (best !== null) scenarios.push({ v: best, p: Math.max(0, isNum(a.best.prob) ? a.best.prob : 0) });
    if (likely !== null) scenarios.push({ v: likely, p: Math.max(0, isNum(a.likely.prob) ? a.likely.prob : 0) });
    if (worst !== null) scenarios.push({ v: worst, p: Math.max(0, isNum(a.worst.prob) ? a.worst.prob : 0) });

    var expected = null;
    if (scenarios.length) {
      var totalP = 0, weighted = 0, plain = 0;
      scenarios.forEach(function (s) { totalP += s.p; weighted += s.v * s.p; plain += s.v; });
      expected = totalP > 0 ? weighted / totalP : plain / scenarios.length;
    }

    /* Risk aversion pulls the acceptable floor down from the expected
       outcome towards the worst case: someone who cannot absorb the
       downside should settle for less than the gamble is "worth". */
    var floor = expected;
    var aversion = (isNum(a.riskAversion) ? a.riskAversion : 0) / 100;
    if (expected !== null && worst !== null && worst < expected) {
      floor = expected - aversion * (expected - worst);
    }

    var reservation = isNum(a.reservationOverride) ? a.reservationOverride : floor;
    var spread = (best !== null && worst !== null) ? best - worst : null;

    var theirSpread = null;
    var tb = a.theirs.bestValue, tw = a.theirs.worstValue;
    if (isNum(tb) && isNum(tw)) theirSpread = tb - tw;

    return {
      best: best, likely: likely, worst: worst,
      expected: expected, floor: floor, reservation: reservation,
      target: isNum(a.target) ? a.target : null,
      spread: spread, theirSpread: theirSpread,
      overridden: isNum(a.reservationOverride)
    };
  }

  /* ---------------- navigation ---------------- */

  var SECTIONS = [
    { id: 'matter', num: '0', label: 'The dispute', hint: 'Parties, subject, deadline' },
    { id: 'alt', num: '1', label: 'BATNA & WATNA', hint: 'What no deal costs you' },
    { id: 'demands', num: '2', label: 'Desired end state', hint: 'Ranked list of demands' },
    { id: 'timeline', num: '3', label: 'Record of truth', hint: 'Events and evidence' },
    { id: 'concessions', num: '4', label: 'Concessions', hint: 'What you can trade' },
    { id: 'brief', num: '5', label: 'Negotiation brief', hint: 'Print or share' }
  ];

  function sectionDone(id) {
    var c;
    if (id === 'matter') return has(state.matter.title) && has(state.matter.otherParty);
    if (id === 'alt') {
      c = computeAlt();
      return has(state.alt.best.desc) && has(state.alt.worst.desc) && c.reservation !== null;
    }
    if (id === 'demands') return state.demands.length > 0;
    if (id === 'timeline') return state.events.length > 0;
    if (id === 'concessions') return state.concessions.length > 0;
    return false;
  }

  function renderNav() {
    var nav = $('stepNav');
    clear(nav);
    SECTIONS.forEach(function (s) {
      var b = el('button', 'step' + (ui.section === s.id ? ' active' : '') + (sectionDone(s.id) ? ' done' : ''));

      nav.appendChild(b);
    });

    var c = computeAlt();
    var bits = [];
    bits.push('<b>' + state.demands.length + '</b> demand' + (state.demands.length === 1 ? '' : 's'));
    bits.push('<b>' + state.events.length + '</b> event' + (state.events.length === 1 ? '' : 's'));
    bits.push('<b>' + countEvidence() + '</b> evidence item' + (countEvidence() === 1 ? '' : 's'));
    bits.push('<b>' + state.concessions.length + '</b> concession' + (state.concessions.length === 1 ? '' : 's'));

  }

  function countEvidence() {
    var n = 0;
    state.events.forEach(function (e) { n += e.evidence.length; });

      'The distance between them is what you actually have riding on this negotiation — and your BATNA, not your hopes, ' +

    p.appendChild(row(

        numControl(state.alt, 'target', 'e.g. 42000', refresh))
    ));

    v.appendChild(derived);
    renderAltDerived(derived);

    /* Non-financial stakes */
    var sp = panel('What else is on the line?',
      'Not everything that matters is money. Relationships, reputation, time, licences, sleep. ' +

    var stakeList = el('div');

    v.appendChild(sp);

    function drawStakes() {
      clear(stakeList);
      if (!state.alt.stakes.length) {

      state.alt.stakes.forEach(function (st) {

        var b = el('div', 's-impact'); b.appendChild(selectControl(st, 'impact', IMPACT_OPTS, null)); r.appendChild(b);
        var c = el('div', 's-note'); c.appendChild(textControl(st, 'notes', 'Why it matters', null)); r.appendChild(c);

        rm.addEventListener('click', function () {
          state.alt.stakes = state.alt.stakes.filter(function (x) { return x !== st; });
          markDirty();
          drawStakes();
        });
        r.appendChild(rm);
        stakeList.appendChild(r);
      });
    }
    drawStakes();

    /* The other side */
    var tp = panel('Their alternatives — your best guess',
      'The side with the weaker walk-away position concedes more. Guess theirs honestly; it is often better than you fear ' +
      'and worse than they claim.');
    tp.appendChild(row(
      makeField('Their best outcome without a deal', '',
        textControl(state.alt.theirs, 'best', 'e.g. We drop it and they keep the money', refresh)),
      makeField('Worth to them', 'optional',
        numControl(state.alt.theirs, 'bestValue', '', refresh))
    ));
    tp.appendChild(row(
      makeField('Their worst outcome without a deal', '',
        textControl(state.alt.theirs, 'worst', 'e.g. Pay in full plus costs, plus public findings', refresh)),
      makeField('Cost to them', 'optional',
        numControl(state.alt.theirs, 'worstValue', '', refresh))
    ));
    tp.appendChild(makeField('What pressure are they under?', 'time, cash flow, reputation, a board, a deadline',
      areaControl(state.alt.theirs, 'pressure', 'e.g. They are refinancing in March and want no open disputes on the books.', null, '70px')));
    v.appendChild(tp);

    v.appendChild(nextButton('demands', 'Next: what do you actually want? →'));

  function altScenario(label, placeholder, obj, refresh) {
    var wrap = el('div');
    wrap.style.marginBottom = '1rem';
    wrap.appendChild(makeField(label, '', areaControl(obj, 'desc', placeholder, refresh, '62px')));
    var vf = makeField('Where that leaves you', 'in money, after costs — a loss is negative',

  function riskSlider(refresh) {
    var wrap = el('div', 'range-field');
    var i = document.createElement('input');
    i.type = 'range';
    i.min = '0';
    i.max = '100';
    i.step = '5';
    i.value = String(isNum(state.alt.riskAversion) ? state.alt.riskAversion : 30);
    var out = el('div', 'range-value');
    function label() {
      var n = parseInt(i.value, 10);
      var word = n <= 15 ? 'I can take the worst case on the chin — hold out for the best odds'
        : n <= 45 ? 'I would rather not test the worst case'
          : n <= 75 ? 'The worst case would really hurt — I want certainty'
            : 'The worst case would be ruinous — almost any deal beats it';
      out.textContent = n + '% — ' + word;
    }
    i.addEventListener('input', function () {
      state.alt.riskAversion = parseInt(i.value, 10);
      label();
      markDirty();
      if (refresh) refresh();
    });
    label();
    wrap.appendChild(i);
    wrap.appendChild(out);
    return wrap;
