<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tommy's Tower Blocks</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #87cefa;
    font-family: "Trebuchet MS", Arial, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .top-bar {
    position: fixed;
    top: 8px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 0 16px;
    pointer-events: none;
  }
  .pill {
    background: rgba(255, 255, 255, 0.9);
    color: #2c3e50;
    font-weight: bold;
    font-size: clamp(15px, 3.5vw, 22px);
    padding: 6px 14px;
    border-radius: 999px;
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
  }
  #knockBtn {
    position: fixed;
    right: 16px;
    bottom: 16px;
    font-family: inherit;
    font-size: clamp(16px, 4vw, 22px);
    font-weight: bold;
    color: #fff;
    background: #e74c3c;
    border: 4px solid #fff;
    border-radius: 999px;
    padding: 10px 20px;
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
    cursor: pointer;
  }
  #knockBtn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="top-bar">
  <div class="pill">Blocks: <span id="count">0</span></div>
  <div class="pill">Best: <span id="best">0</span></div>
</div>

<button id="knockBtn">Knock it down!</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ------------------------------------------------------------
// Sizes. The world is measured with "up" meaning higher, and
// height 0 is the ground. B is the size of one block.
// ------------------------------------------------------------
let W = 0;
let H = 0;
let B = 80;
let groundY = 0;     // where the ground is on the screen (when the camera is at the bottom)
let hookY = 0;       // how far down from the top the hanging block sits

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  B = Math.round(Math.max(44, Math.min(W * 0.2, H * 0.1, 84)));
  groundY = H - 80;
  hookY = 70 + B * 1.3;
}
resize();
window.addEventListener("resize", resize);

// Turn a world height into a y position on the screen.
function screenY(worldY) {
  return groundY - worldY + camY;
}

// ------------------------------------------------------------
// Game state
// ------------------------------------------------------------
const COLORS = ["#e74c3c", "#e67e22", "#f1c40f", "#2ecc71", "#3498db", "#9b59b6", "#ff69b4", "#1abc9c"];
const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

const tower = [];        // blocks that are part of the tower: { x, color, letter, squash }
const debris = [];       // blocks that fell off and are tumbling
const popups = [];
const sparkles = [];

let camY = 0;            // how far the camera has moved up
let state = "ready";     // "ready" (block hanging), "falling", "wait", "knocked"
let waitTimer = 0;
let swingPhase = 0;
let time = 0;
let hasDropped = false;
let best = 0;

// The block currently hanging from the crane or falling.
const current = { x: 0, y: 0, vy: 0, color: COLORS[0], letter: "A", pop: 1 };

try {
  best = parseInt(localStorage.getItem("tommyTowerBest") || "0", 10) || 0;
} catch (e) {
  best = 0;
}
document.getElementById("best").textContent = best;

const MILESTONES = {
  3: "Taller than Tommy!",
  5: "Taller than the house!",
  8: "Taller than the tree!",
  15: "Up with the birds!",
  25: "In the clouds!",
  40: "Higher than an aeroplane!",
  60: "Into space!",
  100: "All the way to the moon!"
};

// ------------------------------------------------------------
// Sounds
// ------------------------------------------------------------
let audio = null;

function initAudio() {
  if (audio) return;
  try {
    audio = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) {
    audio = null;
  }
}

function tone(freq, duration, type, volume, slideTo) {
  if (!audio) return;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, audio.currentTime);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audio.currentTime + duration);
  gain.gain.setValueAtTime(volume || 0.2, audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + duration);
  osc.connect(gain);
  gain.connect(audio.destination);
  osc.start();
  osc.stop(audio.currentTime + duration);
}

function soundThunk() { tone(160, 0.15, "triangle", 0.35, 90); }
function soundPerfect() {
  tone(880, 0.15, "triangle", 0.2);
  setTimeout(function () { tone(1320, 0.25, "triangle", 0.2); }, 90);
}
function soundWhoops() { tone(500, 0.5, "sine", 0.2, 120); }
function soundCrash() {
  if (!audio) return;
  const length = Math.floor(audio.sampleRate * 0.6);
  const buffer = audio.createBuffer(1, length, audio.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < length; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2);
  }
  const src = audio.createBufferSource();
  const gain = audio.createGain();
  gain.gain.value = 0.35;
  src.buffer = buffer;
  src.connect(gain);
  gain.connect(audio.destination);
  src.start();
}
function soundCheer() {
  [523, 659, 784, 1047].forEach(function (n, i) {
    setTimeout(function () { tone(n, 0.22, "triangle", 0.2); }, i * 110);
  });
}

// ------------------------------------------------------------
// The crane
// ------------------------------------------------------------
function swingAmount() {
  return Math.max(0, Math.min(W / 2 - B * 0.7, B * 3.2));
}

function swingSpeed() {
  // Starts gentle and speeds up a little as the tower grows.
  return Math.min(1.5 + tower.length * 0.03, 2.6);
}

function newBlock() {
  const n = tower.length;
  current.color = COLORS[n % COLORS.length];
  current.letter = LETTERS[n % LETTERS.length];
  current.vy = 0;
  current.pop = 0;
  state = "ready";
}
newBlock();

function towerTop() {
  return tower.length * B;
}

// ------------------------------------------------------------
// Dropping and landing
// ------------------------------------------------------------
function drop() {
  initAudio();
  if (state !== "ready") return;
  hasDropped = true;
  state = "falling";
  current.vy = 0;
  // Remember where the block is in the world when we let go.
  current.y = groundY + camY - hookY - B / 2; // world height of the block's bottom
}

function addPopup(text, color, big) {
  popups.push({ text: text, color: color, life: big ? 2.2 : 1.2, big: big, y: H * 0.42 });
}

function addStars(x, worldY) {
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2;
    const speed = 60 + Math.random() * 120;
    sparkles.push({ x: x, y: worldY, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 0.8 });
  }
}

function makeDebris(x, bottomY, vx, vy, spin, color, letter) {
  debris.push({
    x: x,
    y: bottomY + B / 2,   // debris uses the block's centre
    vx: vx,
    vy: vy,
    angle: 0,
    spin: spin,
    color: color,
    letter: letter,
    life: 3.5
  });
}

function land() {
  const supportY = towerTop();
  current.y = supportY;

  if (tower.length > 0) {
    const top = tower[tower.length - 1];
    const dx = current.x - top.x;

    if (Math.abs(dx) >= B) {
      // Missed the tower completely - keep falling past it.
      makeDebris(current.x, current.y, 0, current.vy, (Math.random() - 0.5) * 2, current.color, current.letter);
      addPopup("Missed!", "#7f8c8d", false);
      soundWhoops();
      afterLanding();
      return;
    }

    if (Math.abs(dx) > B / 2) {
      // Too far over the edge - it tips over and tumbles off.
      const side = Math.sign(dx);
      makeDebris(current.x, current.y, side * 90, 100, side * 4, current.color, current.letter);
      addPopup("Whoops!", "#e67e22", false);
      soundWhoops();
      afterLanding();
      return;
    }

    if (Math.abs(dx) < B * 0.1) {
      // Nearly perfect - snap it right into place.
      current.x = top.x;
      addPopup("Perfect!", "#27ae60", false);
      addStars(current.x, supportY + B);
      soundPerfect();
    } else {
      soundThunk();
    }
  } else {
    soundThunk();
  }

  tower.push({ x: current.x, color: current.color, letter: current.letter, squash: 1 });
  checkBalance();
  afterLanding();

  const count = tower.length;
  if (MILESTONES[count]) {
    addPopup(MILESTONES[count], "#8e44ad", true);
    soundCheer();
  }
}

// Real blocks fall over if the blocks above lean too far out.
// For every block, the middle (centre of mass) of all the blocks
// sitting on it must be over the top of it.
function checkBalance() {
  for (let i = 0; i < tower.length - 1; i++) {
    let sum = 0;
    let n = 0;
    for (let j = i + 1; j < tower.length; j++) {
      sum += tower[j].x;
      n++;
    }
    const middle = sum / n;
    const lean = middle - tower[i].x;
    if (Math.abs(lean) > B / 2) {
      // Everything above block i topples over!
      const side = Math.sign(lean);
      const fallen = tower.splice(i + 1);
      fallen.forEach(function (b, k) {
        const level = i + 1 + k;
        makeDebris(b.x, level * B, side * (60 + k * 40), 50, side * (2 + Math.random() * 2), b.color, b.letter);
      });
      addPopup("Timber!", "#c0392b", true);
      soundCrash();
      return;
    }
  }
}

function afterLanding() {
  document.getElementById("count").textContent = tower.length;
  if (tower.length > best) {
    best = tower.length;
    document.getElementById("best").textContent = best;
    try {
      localStorage.setItem("tommyTowerBest", String(best));
    } catch (e) {
      // Saving isn't possible here - that's fine.
    }
  }
  state = "wait";
  waitTimer = 0.45;
}

function knockDown() {
  initAudio();
  if (tower.length === 0 || state === "knocked") return;
  const side = Math.random() < 0.5 ? -1 : 1;
  tower.forEach(function (b, i) {
    makeDebris(
      b.x,
      i * B,
      side * (80 + i * 25 + Math.random() * 80) + (Math.random() - 0.5) * 120,
      150 + Math.random() * 200,
      (Math.random() - 0.5) * 8,
      b.color,
      b.letter
    );
  });
  tower.length = 0;
  document.getElementById("count").textContent = 0;
  addPopup("CRASH!", "#e74c3c", true);
  soundCrash();
  state = "knocked";
  waitTimer = 2.5;
}

// ------------------------------------------------------------
// Update
// ------------------------------------------------------------
function update(dt) {
  time += dt;
  swingPhase += swingSpeed() * dt;
  const hookX = W / 2 + Math.sin(swingPhase) * swingAmount();

  if (state === "ready") {
    current.x = hookX;
    current.pop = Math.min(1, current.pop + dt * 5);
  } else if (state === "falling") {
    current.vy -= 2600 * dt;
    current.y += current.vy * dt;
    if (current.y <= towerTop()) land();
  } else {
    waitTimer -= dt;
    if (waitTimer <= 0) newBlock();
  }

  // Move the camera so the top of the tower stays in a nice place.
  const wantTopOnScreen = Math.max(hookY + B * 2.2, H * 0.55);
  const targetCam = Math.max(0, towerTop() - (groundY - wantTopOnScreen));
  camY += (targetCam - camY) * Math.min(1, dt * 3);

  for (const b of tower) b.squash = Math.max(0, b.squash - dt * 4);

  // Tumbling blocks
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.vy -= 2600 * dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.angle += d.spin * dt;
    const reach = (B / 2) * (Math.abs(Math.cos(d.angle)) + Math.abs(Math.sin(d.angle)));
    if (d.y - reach < 0) {
      d.y = reach;
      if (d.vy < 0) d.vy = -d.vy * 0.3;
      d.vx *= 0.8;
      d.spin *= 0.7;
      // Settle down flat when it's nearly stopped.
      if (Math.abs(d.vy) < 60) {
        const flat = Math.round(d.angle / (Math.PI / 2)) * (Math.PI / 2);
        d.angle += (flat - d.angle) * Math.min(1, dt * 10);
        d.spin *= 0.8;
      }
    }
    d.life -= dt;
    if (d.life <= 0) debris.splice(i, 1);
  }

  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].life -= dt;
    popups[i].y -= 25 * dt;
    if (popups[i].life <= 0) popups.splice(i, 1);
  }

  for (let i = sparkles.length - 1; i >= 0; i--) {
    const s = sparkles[i];
    s.life -= dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    if (s.life <= 0) sparkles.splice(i, 1);
  }
}

// ------------------------------------------------------------
// Drawing
// ------------------------------------------------------------
function mixColor(a, b, t) {
  const ar = parseInt(a.slice(1, 3), 16), ag = parseInt(a.slice(3, 5), 16), ab = parseInt(a.slice(5, 7), 16);
  const br = parseInt(b.slice(1, 3), 16), bg = parseInt(b.slice(3, 5), 16), bb = parseInt(b.slice(5, 7), 16);
  const r = Math.round(ar + (br - ar) * t);
  const g = Math.round(ag + (bg - ag) * t);
  const bl = Math.round(ab + (bb - ab) * t);
  return "rgb(" + r + "," + g + "," + bl + ")";
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// Draw a toy block with its centre at (cx, cy) on the screen.
function drawBlock(cx, cy, color, letter, angle, scaleX, scaleY, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.translate(cx, cy);
  ctx.rotate(angle || 0);
  ctx.scale(scaleX || 1, scaleY || 1);
  const h = B / 2;

  ctx.fillStyle = color;
  roundRect(-h, -h, B, B, B * 0.12);
  ctx.fill();
  ctx.strokeStyle = "rgba(0, 0, 0, 0.3)";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Lighter inside panel
  ctx.fillStyle = "rgba(255, 255, 255, 0.28)";
  roundRect(-h * 0.72, -h * 0.72, B * 0.72, B * 0.72, B * 0.08);
  ctx.fill();

  // Letter
  ctx.font = "bold " + Math.round(B * 0.52) + "px 'Trebuchet MS', Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.lineWidth = Math.max(3, B * 0.06);
  ctx.strokeStyle = "rgba(0, 0, 0, 0.35)";
  ctx.strokeText(letter, 0, B * 0.03);
  ctx.fillStyle = "#ffffff";
  ctx.fillText(letter, 0, B * 0.03);

  ctx.restore();
}

function drawSky() {
  // The sky gets darker the higher we go, until we reach space.
  const t = Math.min(1, camY / (B * 55));
  const top = mixColor("#4aa8e8", "#0b0d2e", t);
  const bottom = mixColor("#bfe6ff", "#1c1f5a", t);
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, top);
  grad.addColorStop(1, bottom);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars appear in space
  if (t > 0.5) {
    ctx.fillStyle = "rgba(255, 255, 255, " + ((t - 0.5) * 2) + ")";
    for (let i = 0; i < 80; i++) {
      const sx = (i * 97.3) % W;
      const sy = ((i * 61.7) + camY * 0.2) % H;
      const twinkle = 1 + Math.sin(time * 3 + i) * 0.5;
      ctx.fillRect(sx, sy, twinkle * 1.5, twinkle * 1.5);
    }
  }
}

function drawCloud(x, worldY, s) {
  const y = screenY(worldY);
  if (y < -100 || y > H + 100) return;
  ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
  ctx.beginPath();
  ctx.arc(x, y, 30 * s, 0, Math.PI * 2);
  ctx.arc(x + 34 * s, y - 16 * s, 38 * s, 0, Math.PI * 2);
  ctx.arc(x + 72 * s, y, 30 * s, 0, Math.PI * 2);
  ctx.arc(x + 36 * s, y + 10 * s, 30 * s, 0, Math.PI * 2);
  ctx.fill();
}

function drawBird(x, worldY) {
  const y = screenY(worldY);
  if (y < -50 || y > H + 50) return;
  const flap = Math.sin(time * 8 + x) * 6;
  ctx.strokeStyle = "#2c3e50";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x - 12, y - flap);
  ctx.quadraticCurveTo(x - 6, y - 8, x, y);
  ctx.quadraticCurveTo(x + 6, y - 8, x + 12, y - flap);
  ctx.stroke();
}

function drawPlane(worldY) {
  const y = screenY(worldY);
  if (y < -80 || y > H + 80) return;
  const x = ((time * 70) % (W + 300)) - 150;
  ctx.fillStyle = "#ecf0f1";
  ctx.beginPath();
  ctx.ellipse(x, y, 60, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#e74c3c";
  ctx.beginPath();
  ctx.moveTo(x - 50, y);
  ctx.lineTo(x - 66, y - 26);
  ctx.lineTo(x - 40, y - 4);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#bdc3c7";
  ctx.beginPath();
  ctx.moveTo(x - 6, y);
  ctx.lineTo(x - 22, y + 26);
  ctx.lineTo(x + 8, y + 2);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#3498db";
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.arc(x - 20 + i * 12, y - 3, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawMoon(worldY) {
  const y = screenY(worldY);
  if (y < -120 || y > H + 120) return;
  const x = W * 0.25;
  ctx.fillStyle = "#f5f3ce";
  ctx.beginPath();
  ctx.arc(x, y, 60, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#dcd9a8";
  ctx.beginPath();
  ctx.arc(x - 18, y - 12, 12, 0, Math.PI * 2);
  ctx.arc(x + 20, y + 15, 9, 0, Math.PI * 2);
  ctx.arc(x + 10, y - 25, 6, 0, Math.PI * 2);
  ctx.fill();
}

function drawScenery() {
  // Things up in the sky, placed at heights measured in blocks.
  drawBird(W * 0.2, B * 14);
  drawBird(W * 0.28, B * 15.5);
  drawBird(W * 0.8, B * 17);
  drawCloud(W * 0.05, B * 21, 1.0);
  drawCloud(W * 0.65, B * 25, 1.3);
  drawCloud(W * 0.15, B * 29, 0.9);
  drawCloud(W * 0.7, B * 33, 1.1);
  drawPlane(B * 40);
  drawMoon(B * 100);

  const gy = screenY(0);
  if (gy > H + 400) return;

  // The house and tree shrink a bit on narrow phone screens.
  const U = Math.min(B, W / 9);

  // House on the left (about 4 blocks tall)
  const baseX = W / 2;
  const houseW = U * 2.6;
  const houseX = Math.max(8, baseX - U * 2.2 - houseW);
  const wallH = U * 2.4;
  ctx.fillStyle = "#fff3c4";
  ctx.fillRect(houseX, gy - wallH, houseW, wallH);
  ctx.fillStyle = "#c0392b";
  ctx.beginPath();
  ctx.moveTo(houseX - U * 0.2, gy - wallH);
  ctx.lineTo(houseX + houseW / 2, gy - U * 4);
  ctx.lineTo(houseX + houseW + U * 0.2, gy - wallH);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#6d4c41";
  ctx.fillRect(houseX + houseW / 2 - U * 0.25, gy - U * 0.95, U * 0.5, U * 0.95);
  ctx.fillStyle = "#aee3ff";
  ctx.fillRect(houseX + U * 0.25, gy - wallH + U * 0.4, U * 0.55, U * 0.55);
  ctx.fillRect(houseX + houseW - U * 0.8, gy - wallH + U * 0.4, U * 0.55, U * 0.55);

  // Tree on the right (about 7 blocks tall)
  const treeX = Math.min(W - U * 1.2, baseX + U * 3.3);
  ctx.fillStyle = "#7a4b25";
  ctx.fillRect(treeX - U * 0.25, gy - U * 4.5, U * 0.5, U * 4.5);
  ctx.fillStyle = "#3e9b4f";
  ctx.beginPath();
  ctx.arc(treeX, gy - U * 5.5, U * 1.4, 0, Math.PI * 2);
  ctx.arc(treeX - U * 0.9, gy - U * 4.6, U * 0.9, 0, Math.PI * 2);
  ctx.arc(treeX + U * 0.9, gy - U * 4.6, U * 0.9, 0, Math.PI * 2);
  ctx.fill();

  // Grass
  ctx.fillStyle = "#5cb85c";
  ctx.fillRect(0, gy, W, Math.max(0, H - gy + 10));
  ctx.fillStyle = "#4cae4c";
  ctx.fillRect(0, gy, W, 6);
}

function drawCrane() {
  const hookX = W / 2 + Math.sin(swingPhase) * swingAmount();
  const railY = 64;

  // Rail along the top
  ctx.fillStyle = "#f39c12";
  ctx.fillRect(0, railY - 6, W, 12);
  ctx.fillStyle = "#d35400";
  for (let x = -((time * 0) % 30); x < W; x += 30) {
    ctx.fillRect(x, railY - 6, 4, 12);
  }

  // Trolley
  ctx.fillStyle = "#34495e";
  roundRect(hookX - 22, railY - 12, 44, 20, 5);
  ctx.fill();

  if (state === "ready") {
    // Rope and hook down to the block
    const blockTop = hookY - B / 2;
    ctx.strokeStyle = "#2c3e50";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(hookX, railY + 8);
    ctx.lineTo(hookX, blockTop - 6);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(hookX, blockTop - 6, 6, Math.PI, 0);
    ctx.stroke();
    const pop = 0.6 + current.pop * 0.4;
    drawBlock(current.x, hookY, current.color, current.letter, Math.sin(swingPhase) * -0.06, pop, pop);
  } else {
    // Empty hook
    ctx.strokeStyle = "#2c3e50";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(hookX, railY + 8);
    ctx.lineTo(hookX, railY + 40);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(hookX, railY + 46, 6, Math.PI, Math.PI * 2.6);
    ctx.stroke();
  }
}

function draw() {
  drawSky();
  drawScenery();

  // Tower
  for (let i = 0; i < tower.length; i++) {
    const b = tower[i];
    const squashY = 1 - b.squash * 0.12;
    const squashX = 1 + b.squash * 0.08;
    drawBlock(b.x, screenY(i * B + B / 2) + (B * (1 - squashY)) / 2, b.color, b.letter, 0, squashX, squashY);
  }

  // Falling block
  if (state === "falling") {
    drawBlock(current.x, screenY(current.y + B / 2), current.color, current.letter, 0);
  }

  // Tumbling blocks
  for (const d of debris) {
    drawBlock(d.x, screenY(d.y), d.color, d.letter, d.angle, 1, 1, Math.min(1, d.life));
  }

  // Sparkly stars for a perfect drop
  ctx.fillStyle = "#ffe066";
  for (const s of sparkles) {
    ctx.globalAlpha = Math.max(0, s.life);
    ctx.beginPath();
    ctx.arc(s.x, screenY(s.y), 4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawCrane();

  // Words that pop up
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    const size = p.big ? Math.min(W / 12, 46) : Math.min(W / 14, 34);
    ctx.font = "bold " + Math.round(size) + "px 'Trebuchet MS', Arial, sans-serif";
    ctx.lineWidth = 6;
    ctx.strokeStyle = "#ffffff";
    ctx.strokeText(p.text, W / 2, p.y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, W / 2, p.y);
  }
  ctx.globalAlpha = 1;

  if (!hasDropped) {
    ctx.font = "bold " + Math.round(Math.min(W / 14, 32)) + "px 'Trebuchet MS', Arial, sans-serif";
    ctx.lineWidth = 6;
    ctx.strokeStyle = "#ffffff";
    ctx.fillStyle = "#2c3e50";
    const pulse = 1 + Math.sin(time * 4) * 0.05;
    ctx.save();
    ctx.translate(W / 2, H * 0.5);
    ctx.scale(pulse, pulse);
    ctx.strokeText("Tap to drop the block!", 0, 0);
    ctx.fillText("Tap to drop the block!", 0, 0);
    ctx.restore();
  }
}

// ------------------------------------------------------------
// Main loop
// ------------------------------------------------------------
let lastTime = performance.now();

function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ------------------------------------------------------------
// Controls
// ------------------------------------------------------------
canvas.addEventListener("pointerdown", function (e) {
  e.preventDefault();
  drop();
});

window.addEventListener("keydown", function (e) {
  if (e.key === " " || e.key === "Enter" || e.key === "ArrowDown") {
    e.preventDefault();
    drop();
  }
  if (e.key === "k" || e.key === "K") knockDown();
});

document.getElementById("knockBtn").addEventListener("click", function (e) {
  e.stopPropagation();
  this.blur(); // so the space bar drops blocks instead of pressing this again
  knockDown();
});
</script>
</body>
</html>
